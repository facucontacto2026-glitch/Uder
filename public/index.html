<style>
:root{
  --bg:#FFFFFF;
  --surface:#F6F6F6;
  --card:#FFFFFF;
  --ink:#000000;
  --ink-secondary:#5E5E5E;
  --line:#EEEEEE;
  --accent:#F5B700;
  --ok:#0E8345;
  --bad:#DE1135;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column
}
.app{
  max-width:480px;
  width:100%;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  background:#fff
}

/* TOP BAR ESTILO UBER */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px 8px;
  background:#fff;
  z-index:1000
}
.top-loc{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:700;
  color:var(--ink);
  cursor:pointer
}
.top-loc i{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#276EF1
}
.brand{
  font-size:26px;
  font-weight:800;
  letter-spacing:-1px;
  color:#000
}
.brand span{
  color:var(--accent);
  background:#000;
  padding:1px 7px;
  border-radius:6px;
  margin-right:4px
}

/* MAPA */
#map{
  width:100%;
  height:290px;
  background:#E5E3DF;
  z-index:1
}

/* CONTENEDOR PRINCIPAL */
.main-view{
  flex:1;
  padding:16px 20px 85px;
  background:#fff
}

/* BUSCADOR FLOTANTE TIPO PÍLDORA */
.search-pill{
  display:flex;
  align-items:center;
  background:var(--surface);
  border-radius:30px;
  padding:12px 18px;
  gap:12px;
  box-shadow:0 3px 12px rgba(0,0,0,0.06);
  cursor:pointer;
  margin-bottom:16px
}
.search-pill svg{flex-shrink:0}
.search-pill input{
  border:0;
  background:transparent;
  font:600 16px 'Plus Jakarta Sans',sans-serif;
  color:#000;
  width:100%;
  outline:none
}
.search-btn{
  border:0;
  background:#000;
  color:#fff;
  padding:8px 16px;
  border-radius:20px;
  font-weight:700;
  font-size:13px;
  cursor:pointer
}

/* CHIPS */
.chips-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
  scrollbar-width:none
}
.chips-row::-webkit-scrollbar{display:none}
.chip-uber{
  border:0;
  background:var(--surface);
  color:#000;
  font:600 13px 'Plus Jakarta Sans',sans-serif;
  padding:8px 16px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px
}
.chip-uber[aria-pressed="true"]{
  background:#000;
  color:#fff
}

/* TARJETAS DE SERVICIO (REMIS / UDER) */
.ride-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  border-radius:14px;
  border:2px solid transparent;
  background:#fff;
  margin-bottom:10px;
  cursor:pointer;
  transition:all 0.15s ease
}
.ride-card:hover{background:var(--surface)}
.ride-card.selected{
  border-color:#000;
  background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,0.08)
}
.ride-left{
  display:flex;
  align-items:center;
  gap:16px
}
.ride-icon{
  width:64px;
  height:44px;
  background:var(--surface);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px
}
.ride-info h4{
  margin:0;
  font-size:17px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px
}
.ride-info h4 span{
  font-size:12px;
  font-weight:600;
  color:var(--ink-secondary)
}
.ride-info p{
  margin:3px 0 0;
  font-size:12px;
  color:var(--ink-secondary);
  font-weight:500
}
.ride-price b{
  font-size:18px;
  font-weight:800;
  color:#000
}

/* BARRA DE FORMA DE PAGO */
.payment-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;
  background:var(--surface);
  border-radius:12px;
  margin:14px 0;
  cursor:pointer;
  font-weight:700;
  font-size:14px
}
.payment-bar div{
  display:flex;
  align-items:center;
  gap:10px
}

/* BOTONES PRINCIPALES */
.btn-uber{
  width:100%;
  height:54px;
  background:#000;
  color:#fff;
  border:0;
  border-radius:12px;
  font:700 16px 'Plus Jakarta Sans',sans-serif;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px
}
.btn-uber:active{background:#333}
.btn-ghost-uber{
  width:100%;
  height:48px;
  background:transparent;
  color:var(--ink-secondary);
  border:0;
  font:700 14px 'Plus Jakarta Sans',sans-serif;
  cursor:pointer;
  margin-top:6px
}

/* RESULTADOS DE BÚSQUEDA */
.search-res-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  text-align:left;
  width:100%;
  background:transparent;
  border-left:0;border-right:0;border-top:0
}
.search-res-item i{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  font-style:normal;
  flex-shrink:0
}
.search-res-item div b{display:block;font-size:15px;color:#000}
.search-res-item div small{font-size:12px;color:var(--ink-secondary)}

/* BARRA DE NAVEGACIÓN INFERIOR (UBER STYLE) */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  max-width:480px;
  width:100%;
  height:65px;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:2000;
  padding-bottom:env(safe-area-inset-bottom,0px)
}
.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px;
  font-weight:700;
  color:var(--ink-secondary);
  cursor:pointer;
  background:none;
  border:0
}
.nav-item.active{color:#000}
.nav-item svg{width:22px;height:22px}

/* INPUTS PARA FORMULARIOS */
.field-input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #D5DBE5;
  background:#F9F9F9;
  font:600 15px 'Plus Jakarta Sans',sans-serif;
  margin-top:6px;
  margin-bottom:14px;
  outline:none
}
.field-input:focus{
  border-color:#000;
  background:#fff
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#000;
  color:#fff;
  padding:12px 20px;
  border-radius:24px;
  font-size:14px;
  font-weight:600;
  box-shadow:0 4px 15px rgba(0,0,0,0.2);
  z-index:3000;
  max-width:85%;
  text-align:center
}
.badge-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#E8F5E9;
  color:#1B5E20;
  padding:6px 12px;
  border-radius:8px;
  font-weight:700;
  font-size:13px
}
.plate{
  font-weight:800;
  letter-spacing:2px;
  border:2px solid #000;
  border-radius:6px;
  padding:3px 8px;
  font-size:13px
}
</style>
</head>
<body>

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>

      Cuenta
    </button>
  </nav>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var sb = supabase.createClient("https://mmgvttmgchnbppcemrwg.supabase.co", "sb_publishable_HtTCeT611_CKOvtxebUxTw_FQpL_seZ");

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}

var CEN={lat:-25.798,lng:-64.968},BB={w:-65.05,e:-64.90,n:-25.74,s:-25.86};
var S={o:null,on:"",d:null,dn:"",mode:"o",ty:0,pg:"Efectivo",p:0,dr:null,km:0,cuadras:0,res:[],msg:"¿A dónde vamos hoy?",ph:"home",oref:"",dref:"",viajeId:null,mapFitDone:false},tm=null,pollTm=null;

var TY=[
  ["Remis", "Servicio tradicional de remis", 1.0, "🚗", "4 min"],
  ["Uder", "Auto particular, el más económico", 0.95, "🚘", "3 min"]
];
var PG=["Efectivo", "Mercado Pago"];

function $(x){return document.getElementById(x)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function lab(n, r){
  var nom = esc(n || "Punto");
  var ref = esc(r || "").trim();
  if(!ref) return nom;
  var soloNum = ref.replace(/altura\s*/gi, "").trim();
  if(nom.indexOf(soloNum) >= 0 || nom.indexOf(ref) >= 0) return nom;
  return nom + " · " + ref;
}

function setRef(v){if(S.mode==="o")S.oref=v;else S.dref=v}

// GESTIÓN DE SESIÓN DE USUARIO
var U = null;
try { U = JSON.parse(localStorage.getItem("uder_user") || "null"); } catch(e){}
function save(){ try { localStorage.setItem("uder_user", JSON.stringify(U)); } catch(e){} }

// CIERRE DE SESIÓN ASINCRÓNICO Y LIMPIO
async function logout(){
  toast("Cerrando sesión…");
  try {
    await sb.auth.signOut();
  } catch(e){}
  U = null;
  try {
    localStorage.removeItem("uder_user");
    sessionStorage.clear();
  } catch(e){}
  toast("Sesión cerrada");
  cambiarSeccion("cuenta");
}

// SINCRONIZAR USUARIO AUTENTICADO
function sincronizarUsuario(usr){
  var meta = usr.user_metadata || {};
  var nomComp = meta.full_name || meta.name || "";
  var partes = nomComp.split(" ");
  U = {
    id: usr.id,
    email: usr.email,
    nombre: meta.first_name || partes[0] || "Pasajero",
    apellido: meta.last_name || partes.slice(1).join(" ") || "",
    dni: meta.dni || ""
  };
  save();
  cambiarSeccion("cuenta");
}

sb.auth.onAuthStateChange(function(event, session){
  if(session && session.user){
    sincronizarUsuario(session.user);
  }
});

sb.auth.getSession().then(function(r){
  if(r.data && r.data.session && r.data.session.user){
    sincronizarUsuario(r.data.session.user);
  }
});

function loginGoogle(){
  toast("Conectando con Google…");
  sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  }).catch(function(){
    toast("No se pudo abrir Google. Probá ingresar.");
  });
}

function doLoginEmail(){
  var e = $("l_e").value.trim(), w = $("l_w").value;
  if(!e || !w) { toast("Completá email y contraseña"); return; }
  toast("Ingresando…");
  sb.auth.signInWithPassword({ email: e, password: w }).then(function(r){
    if(r.error) { toast("Email o contraseña incorrectos"); return; }
    sincronizarUsuario(r.data.user);
  });
}

function doRegistroEmail(){
  var e = $("r_e").value.trim(), w = $("r_w").value;
  var n = $("r_n").value.trim(), a = $("r_a").value.trim();
  if(!e || !w || !n) { toast("Completá todos los campos"); return; }
  if(w.length < 6) { toast("La contraseña debe tener al menos 6 caracteres"); return; }
  toast("Creando cuenta…");
  sb.auth.signUp({
    email: e,
    password: w,
    options: { data: { full_name: n + " " + a, first_name: n, last_name: a } }
  }).then(function(r){
    if(r.error) { toast("Error: " + r.error.message); return; }
    toast("¡Cuenta creada!");
    if(r.data.user) sincronizarUsuario(r.data.user);
    else cambiarSeccion("cuenta");
  });
}

// CAMBIAR PESTAÑAS INFERIORES
function cambiarSeccion(sec){
  document.querySelectorAll(".nav-item").forEach(function(btn){ btn.classList.remove("active"); });
  if(sec === "home"){
    $("nav_inicio").classList.add("active");
    go("home");
  } else if(sec === "actividad"){
    $("nav_actividad").classList.add("active");
    go("actividad");
  } else if(sec === "cuenta"){
    $("nav_cuenta").classList.add("active");
    go("cuenta");
  }
}

function esNocturno(){
  var h = new Date().getHours();
  return (h >= 22 || h < 6);
}

function getCuadras(){
  return Math.max(1, Math.round(S.km * 10));
}

function price(i){
  var cuadras = getCuadras();
  var base = esNocturno() ? 3600 : 2600;
  var total = base;
  if(cuadras > 10){
    total += (cuadras - 10) * 320;
  }
  var mult = (TY[i] && TY[i][2]) ? TY[i][2] : 1.0;
  return Math.round(total * mult);
}

function M(n){return "ARS " + Math.round(n).toLocaleString("es-AR")}

function pedirViajeReal(){
  var monto = Math.round(price(S.ty));
  var cuadras = getCuadras();
  var payload = {
    pasajero_id: U && U.id ? U.id : null,
    pasajero_nombre: U ? (U.nombre + (U.apellido ? " " + U.apellido.charAt(0) + "." : "")) : "Pasajero",
    tipo: TY[S.ty][0],
    forma_pago: S.pg,
    monto: monto,
    ganancia_conductor: Math.round(monto * 0.85),
    km: Number(S.km.toFixed(1)),
    cuadras: cuadras,
    origen_nombre: S.on,
    origen_ref: S.oref || "",
    origen_lat: S.o.lat,
    origen_lng: S.o.lng,
    destino_nombre: S.dn,
    destino_ref: S.dref || "",
    destino_lat: S.d.lat,
    destino_lng: S.d.lng,
    pasajero_lat: S.o.lat,
    pasajero_lng: S.o.lng,
    estado: "buscando",
    pago_estado: "pendiente"
  };

  fetch("/api/pedir-viaje", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json() })
  .then(function(j){
    if(!j.viaje) throw new Error("Error al crear viaje");
    S.viajeId = j.viaje.id;
    try {
      sessionStorage.setItem("uder_trip", JSON.stringify({
        viajeId: S.viajeId, o:S.o, on:S.on, oref:S.oref, d:S.d, dn:S.dn, dref:S.dref, km:S.km, cuadras:cuadras, ty:S.ty, pg:S.pg
      }));
    } catch(e){}

    if(S.pg === "Mercado Pago"){
      pagarMP(j.viaje.id, monto);
    } else {
      go("search");
    }
  })
  .catch(function(){
    toast("No se pudo pedir el viaje. Probá de nuevo.");
  });
}

function pagarMP(viajeId, monto){
  toast("Abriendo Mercado Pago…");
  fetch("/api/crear-pago", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      viaje_id: viajeId,
      monto: monto,
      descripcion: "Viaje Uder: "+S.on+" a "+S.dn,
      nombre: U ? U.nombre : "Pasajero",
      apellido: U ? U.apellido : "Uder",
      dni: U ? U.dni : "0"
    })
  })
  .then(function(r){ return r.json() })
  .then(function(j){
    if(!j.url) throw 0;
    location.href = j.url;
  })
  .catch(function(){
    toast("Error al conectar con Mercado Pago.");
  });
}

function volverMP(){
  var q=new URLSearchParams(location.search),r=q.get("pago");if(!r)return false;
  var id=q.get("payment_id")||q.get("collection_id"), viajeId=q.get("viaje"), t=null;
  try{t=JSON.parse(sessionStorage.getItem("uder_trip")||"null")}catch(e){}
  history.replaceState(null,"",location.pathname);
  if(!t && !viajeId){cambiarSeccion("home");toast("No encontramos tu viaje.");return true}
  if(t) Object.assign(S,t);
  if(viajeId) S.viajeId = viajeId;
  draw();

  if(r==="ok"&&id){
    S.ph="verif";$("v").innerHTML='<div style="padding:20px 0;text-align:center"><h3>Confirmando pago…</h3><p style="color:var(--ink-secondary)">Estamos verificando con Mercado Pago.</p></div>';
    fetch("/api/verificar-pago?payment_id="+encodeURIComponent(id)+"&ref="+encodeURIComponent(t?t.ref:"")+"&viaje="+encodeURIComponent(S.viajeId||""))
    .then(function(x){return x.json()})
    .then(function(j){
      if(j.aprobado){
        toast("Pago acreditado ✓");
        go("search");
      }else{
        toast("No pudimos confirmar el pago.");
        go("opt");
      }
    }).catch(function(){toast("Error de verificación.");go("opt")});
    return true;
  }
  toast("El pago no se completó.");go("opt");return true;
}

// SEGUIMIENTO EN VIVO DEL CHOFER
var carMarker = null;
function actualizarPosicionChofer(pos){
  if(!pos || pos.lat == null || pos.lng == null) return;
  var p = [pos.lat, pos.lng];

  if(!carMarker){
    var carHtml = '<div style="background:#000;color:#F5B700;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.3)">🚗</div>';
    carMarker = L.marker(p, {
      icon: L.divIcon({ className: '', html: carHtml, iconSize: [38, 38], iconAnchor: [19, 19] }),
      zIndexOffset: 2000
    }).addTo(map);
  } else {
    carMarker.setLatLng(p);
  }

  if(S.ph === "pick" && S.o){
    var distKm = hav({lat: pos.lat, lng: pos.lng}, S.o);
    var cuadras = Math.max(1, Math.round(distKm * 10));
    var elDist = $("eta_chofer");

    if(elDist){
      if(distKm < 0.12){
        elDist.innerHTML = '<span class="badge-status" style="background:#FFF3CD;color:#856404">🔔 ¡Tu conductor ya está en tu puerta!</span>';
      } else {
        var txtDist = distKm < 1 ? Math.round(distKm * 1000) + " m" : distKm.toFixed(1) + " km";
        elDist.innerHTML = '<span class="badge-status">🚗 Conductor a <b>' + cuadras + ' cuadras</b> (' + txtDist + ')</span>';
      }
    }

    if(!S.mapFitDone){
      map.fitBounds([p, [S.o.lat, S.o.lng]], { padding: [60, 60], maxZoom: 17 });
      S.mapFitDone = true;
    }
  }

  if(S.ph === "trip" && S.d){
    var distDest = hav({lat: pos.lat, lng: pos.lng}, S.d);
    var elDest = $("eta_destino");
    if(elDest){

      elDest.innerHTML = '<span class="badge-status">🏁 Faltan <b>' + cuadrasRest + ' cuadras</b> para llegar</span>';
    }
  }
}

function consultarViaje(){
  if(!S.viajeId) return;
  fetch("/api/estado-viaje?id="+encodeURIComponent(S.viajeId))
  .then(function(r){return r.json()})
  .then(function(res){
    var v = res.viaje;
    if(!v) return;

    if(v.estado === "cancelado"){
      clearInterval(pollTm);
      toast("El viaje fue cancelado.");
      cambiarSeccion("home");
      return;
    }

    if((v.estado === "aceptado" || v.estado === "en_camino") && S.ph === "search"){
      S.dr = [v.conductor_nombre, v.vehiculo, v.patente];
      go("pick");

function hav(p,q){var r=Math.PI/180,u=(q.lat-p.lat)*r,w=(q.lng-p.lng)*r,a=Math.pow(Math.sin(u/2),2)+Math.cos(p.lat*r)*Math.cos(q.lat*r)*Math.pow(Math.sin(w/2),2);return 12742*Math.asin(Math.sqrt(a))}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}

// CÁLCULO DE RUTA
function calcularRutaReal(origen, destino){
  var distDirecta = hav(origen, destino);
  var urlDirecta = "https://router.project-osrm.org/route/v1/driving/" + origen.lng + "," + origen.lat + ";" + destino.lng + "," + destino.lat + "?overview=full&geometries=geojson&alternatives=true";
  var cruceLng = -64.9620, cruceLat = -25.7935;
  var urlConCruce = "https://router.project-osrm.org/route/v1/driving/" + origen.lng + "," + origen.lat + ";" + cruceLng + "," + cruceLat + ";" + destino.lng + "," + destino.lat + "?overview=full&geometries=geojson";

  return fetch(urlDirecta)
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.routes || !j.routes.length) throw new Error("Sin ruta");
      var rDirecta = j.routes.sort(function(a,b){ return a.distance - b.distance; })[0];
      var kmDirecto = rDirecta.distance / 1000;

      if(kmDirecto > Math.max(0.6, distDirecta * 1.35)){
        return fetch(urlConCruce)
          .then(function(cr){ return cr.json(); })
          .then(function(cj){
            if(cj.routes && cj.routes.length){
              var rCruce = cj.routes[0];
              var kmCruce = rCruce.distance / 1000;
              if(kmCruce < kmDirecto){
                return {
                  km: Math.max(0.5, kmCruce),
                  puntos: rCruce.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
                };
              }
            }
            return {
              km: Math.max(0.5, Math.min(kmDirecto, distDirecta * 1.25)),
              puntos: rDirecta.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
            };
          })
          .catch(function(){
            return {
              km: Math.max(0.5, Math.min(kmDirecto, distDirecta * 1.25)),
              puntos: rDirecta.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
            };
          });
      }

      return {
        km: Math.max(0.5, kmDirecto),
        puntos: rDirecta.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
      };
    })
    .catch(function(){
      return {
        km: Math.max(0.5, distDirecta * 1.25),
        puntos: [[origen.lat, origen.lng], [destino.lat, destino.lng]]
      };
    });
}

// BUSCADOR DE CALLES
function buscarDireccion(textoUsuario){
  var numMatch = textoUsuario.match(/\b\d{1,5}\b/);
  var num = numMatch ? numMatch[0] : "";
  var textoLimpio = textoUsuario.replace(/\b\d{1,5}\b/g, "").trim();

  var tMin = textoLimpio.toLowerCase();
  var terminoBusqueda = textoLimpio;
  var esBarrioPeron = false;

  if(tMin.indexOf("peron") >= 0 || tMin.indexOf("malvina") >= 0){
    terminoBusqueda = "Ex Combatientes de Malvinas";
    esBarrioPeron = true;
  } else if(tMin.indexOf("mitre") >= 0){
    terminoBusqueda = "Bartolomé Mitre";
  } else if(tMin.indexOf("guemes") >= 0){
    terminoBusqueda = "Güemes";
  }

  var consulta = terminoBusqueda + (num ? " " + num : "");
  var urlGeoref = "https://apis.datos.gob.ar/georef/api/v2.0/direcciones?max=6&provincia=salta&departamento=rosario%20de%20la%20frontera&direccion=" + encodeURIComponent(consulta);

  return fetch(urlGeoref)
    .then(function(r){ return r.json() })
    .then(function(j){
      var lista = (j.direcciones || []).filter(function(d){ return d.ubicacion && d.ubicacion.lat != null; });
      if(lista.length > 0){
        return lista.map(function(d){
          var nom = d.nomenclatura ? d.nomenclatura.split(",")[0] : d.calle.nombre;
          if(esBarrioPeron) nom = "Ex Combatientes de Malvinas (B° Perón)";
          return {
            p: { lat: parseFloat(d.ubicacion.lat), lng: parseFloat(d.ubicacion.lon) },
            n: nom,
            num: num,
            refSugerida: num ? "altura " + num : ""
          };
        });
      }
      throw new Error("No en georef");
    })
    .catch(function(){
      var nomUrl = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=ar&viewbox=" + BB.w + "," + BB.n + "," + BB.e + "," + BB.s + "&bounded=0&q=" + encodeURIComponent(terminoBusqueda + ", Rosario de la Frontera, Salta");
      return fetch(nomUrl)
        .then(function(r){ return r.json() })
        .then(function(arr){
          if(!Array.isArray(arr) || !arr.length) return [];
          return arr.map(function(x){
            var calleNombre = x.display_name.split(",")[0];
            calleNombre = calleNombre.replace(/Ram[oó]n Abdala/gi, "B° Perón");
            if(esBarrioPeron && calleNombre.indexOf("Perón") < 0) calleNombre = "Ex Combatientes de Malvinas (B° Perón)";
            return {
              p: { lat: parseFloat(x.lat), lng: parseFloat(x.lon) },
              n: calleNombre,
              num: num,
              refSugerida: num ? "altura " + num : ""
            };
          });
        })
        .catch(function(){ return []; });
    });
}

var map=L.map("map",{zoomControl:false}).setView([CEN.lat,CEN.lng],14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:""}).addTo(map);
var G=L.layerGroup().addTo(map),routeLine=null;

function pin(p,c,m,t){
  var k=L.marker([p.lat,p.lng],{draggable:true,icon:L.divIcon({className:"",html:'<div style="width:20px;height:20px;border-radius:50%;background:'+c+';border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(G).bindTooltip(t);
  k.on("dragend",function(){
    var q=k.getLatLng();
    if(S.ph==="home") setPt(m,{lat:q.lat,lng:q.lng},null,true);
  });
}

function draw(keep){
  G.clearLayers();
  routeLine=null;
  var b=[];
  if(S.o){pin(S.o,"#000000","o","Desde: "+lab(S.on,S.oref));b.push([S.o.lat,S.o.lng])}
  if(S.d){pin(S.d,"#DE1135","d","Hasta: "+lab(S.dn,S.dref));b.push([S.d.lat,S.d.lng])}
  
  if(S.o && S.d){
    calcularRutaReal(S.o, S.d).then(function(res){
      S.km = res.km;
      S.cuadras = getCuadras();
      routeLine = L.polyline(res.puntos, {color:"#000000", weight:5, opacity:0.85}).addTo(G);
    });
  }

  if(keep)return;
  if(b.length===2) map.fitBounds(b,{padding:[40,40]});
  else if(b.length===1) map.setView(b[0],16);
}

function setPt(m,p,n,keep){
  if(m==="o"){
    S.o=p;
    S.on=n||"Punto en el mapa";
    if(!S.d){
      S.mode="d";
      S.msg="¿A dónde vas?";
    }
  } else {
    S.d=p;
    S.dn=n||"Punto en el mapa";
  }
  S.res=[];
  draw(keep);
  go("home");

  setTimeout(function(){
    var qEl = $("q");
    if(qEl && S.mode === "d" && !S.d){
      qEl.value = "";
      qEl.placeholder = "¿A dónde vas? (ej: peron 412)";
      qEl.focus();
    }
  }, 100);
}

function mode(m){S.mode=m;go("home")}

function loc(){
  toast("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(function(g){
    var p = {lat: g.coords.latitude, lng: g.coords.longitude};
    var enRosario = (p.lng > BB.w && p.lng < BB.e && p.lat > BB.s && p.lat < BB.n);
    if(enRosario){
      setPt("o", p, "Ubicación actual");
      map.setView([p.lat, p.lng], 16);
    } else {
      setPt("o", { lat: CEN.lat, lng: CEN.lng }, "Centro (Rosario de la Frontera)");
    }
  }, function(){
    setPt("o", { lat: CEN.lat, lng: CEN.lng }, "Centro (Rosario de la Frontera)");
  }, { enableHighAccuracy: true, timeout: 8000 });
}

  var q = $("q").value.trim();
  if(!q){ toast("Escribí una calle"); return; }
  S.msg = "Buscando…";
  go("home");

  buscarDireccion(q).then(function(rs){
    S.res = rs;
    S.msg = rs.length ? "Seleccioná la dirección:" : "No encontramos esa calle. Probá de nuevo o tocala en el mapa.";
    go("home");
    $("q").value = q;

    toast("No se pudo buscar.");
    go("home");

          '<p style="color:var(--ink-secondary);font-size:14px;margin:0 0 24px">Para pedir viajes con tu cuenta y guardar tu historial.</p>' +

          '<button class="btn-uber" style="background:#fff;color:#000;border:1px solid #ddd;margin-bottom:14px" onclick="loginGoogle()">' +
            '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.43 7.34 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.24C.45 8.15 0 9.99 0 12s.45 3.85 1.24 5.42l4.04-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.57 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>' +
            'Continuar con Google' +
          '</button>' +

          '<div style="text-align:left;background:var(--surface);border-radius:14px;padding:18px;margin-bottom:14px">' +
            '<div style="font-weight:700;margin-bottom:10px">O con tu correo</div>' +
            '<input id="l_e" type="email" placeholder="Email" class="field-input">' +
            '<input id="l_w" type="password" placeholder="Contraseña" class="field-input">' +
            '<button class="btn-uber" onclick="doLoginEmail()">Ingresar</button>' +
          '</div>' +

          '<button class="btn-ghost-uber" onclick="go(\'reg\')">¿No tenés cuenta? Registrate</button>' +
        '</div>';
    }
  }

  // PANTALLA REGISTRO
  if(ph==="reg"){
    v.innerHTML = 
      '<div style="padding:10px 0">' +
        '<h2 style="font-size:24px;font-weight:800;margin:0 0 6px">Crear cuenta</h2>' +
        '<p style="color:var(--ink-secondary);font-size:14px;margin:0 0 20px">Registrate gratis para pedir viajes.</p>' +
        '<input id="r_n" placeholder="Nombre/s" class="field-input">' +
        '<input id="r_a" placeholder="Apellido" class="field-input">' +
        '<input id="r_e" type="email" placeholder="Email" class="field-input">' +
        '<input id="r_w" type="password" placeholder="Contraseña (mínimo 6)" class="field-input">' +
        '<button class="btn-uber" onclick="doRegistroEmail()">Crear cuenta</button>' +
        '<button class="btn-ghost-uber" onclick="cambiarSeccion(\'cuenta\')">Volver</button>' +
      '</div>';
  }

  // OTRAS PANTALLAS (ELEGIR VIAJE, RADAR, EN CAMINO)
  if(ph==="opt"){
    var cuadras = getCuadras();
    var noche = esNocturno();
    var tagTarifa = noche ? "🌙 Tarifa Nocturna" : "☀️ Tarifa Diurna";

    v.innerHTML = 
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
        '<h3 style="margin:0;font-size:20px;font-weight:800">Elige un viaje</h3>' +
        '<span style="font-size:12px;font-weight:700;color:var(--ink-secondary)">'+cuadras+' cuadras ('+S.km.toFixed(1)+' km) · '+tagTarifa+'</span>' +
      '</div>' +
      TY.map(function(t,i){
        var isSelected = (i === S.ty);
        return '<div class="ride-card '+(isSelected?'selected':'')+'" onclick="S.ty='+i+';go(\'opt\')">' +
          '<div class="ride-left">' +
            '<div class="ride-icon">'+t[3]+'</div>' +
            '<div class="ride-info">' +
              '<h4>'+t[0]+' <span>👤 4</span></h4>' +
              '<p>'+t[4]+' · '+t[1]+'</p>' +
            '</div>' +
          '</div>' +
          '<div class="ride-price">' +
            '<b>'+M(price(i))+'</b>' +
          '</div>' +
        '</div>';
      }).join("") +
      '<div class="payment-bar" onclick="cambiarPago()">' +
        '<div>' +
          '<span>'+(S.pg==="Mercado Pago"?'🔵':'💵')+'</span>' +
          '<span>'+esc(S.pg)+'</span>' +
        '</div>' +
        '<span style="color:var(--ink-secondary)">Cambiar ❯</span>' +
      '</div>' +
      '<button class="btn-uber" onclick="pedirViajeReal()">' +
        'Elegir viaje '+TY[S.ty][0]+' · '+M(price(S.ty)) +
      '</button>' +
      '<button class="btn-ghost-uber" onclick="cambiarSeccion(\'home\')">Modificar ruta</button>';
  }

  if(ph==="search"){
    v.innerHTML = 
      '<div style="text-align:center;padding:15px 0">' +
        '<h3 style="margin:0 0 6px;font-size:20px;font-weight:800">Buscando tu '+TY[S.ty][0]+'…</h3>' +
        '<p style="margin:0 0 16px;color:var(--ink-secondary);font-size:14px">Avisando a los conductores más cercanos en Rosario de la Frontera.</p>' +
        '<div class="bar" style="height:6px;border-radius:10px;background:#EEEEEE;overflow:hidden;margin-bottom:20px"><i style="width:65%;display:block;height:100%;background:#000"></i></div>' +
        '<button class="btn-uber" style="background:var(--surface);color:#000" onclick="cancelarViajeActual()">Cancelar pedido</button>' +
      '</div>';
    pollTm = setInterval(consultarViaje, 2500);
  }

  if(ph==="pick"){
    var d = S.dr || ["Conductor", "Auto en camino", "---"];
    v.innerHTML = 
      '<div style="padding:10px 0">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
          '<div>' +
            '<h3 style="margin:0;font-size:20px;font-weight:800">'+esc(d[0])+' viene a buscarte</h3>' +
            '<p style="margin:4px 0 0;color:var(--ink-secondary);font-size:14px">'+esc(d[1])+'</p>' +
          '</div>' +
          '<div class="plate" style="font-size:15px">'+esc(d[2])+'</div>' +
        '</div>' +
        '<div id="eta_chofer" style="margin:16px 0">' +
          '<span class="badge-status">🚗 Localizando conductor en el mapa…</span>' +
        '</div>' +
        '<div style="background:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between">' +
          '<span>Forma de pago: <b>'+esc(S.pg)+'</b></span>' +
          '<span>Total: <b>'+M(price(S.ty))+'</b></span>' +
        '</div>' +
        '<button class="btn-ghost-uber" style="color:var(--bad)" onclick="cancelarViajeActual()">Cancelar viaje</button>' +
      '</div>';
    pollTm = setInterval(consultarViaje, 2500);
  }

  if(ph==="trip"){
    v.innerHTML = 
      '<div style="padding:10px 0">' +
        '<h3 style="margin:0;font-size:20px;font-weight:800">Viaje en curso</h3>' +
        '<p style="margin:4px 0 14px;color:var(--ink-secondary);font-size:14px">Con '+esc(S.dr[0])+' hacia tu destino</p>' +
        '<div id="eta_destino" style="margin-bottom:16px">' +
          '<span class="badge-status">En viaje a destino…</span>' +
        '</div>' +
        '<div style="background:var(--surface);padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center">' +
          '<span style="font-size:14px;font-weight:600">Total a pagar:</span>' +
          '<b style="font-size:20px">'+M(price(S.ty))+'</b>' +
        '</div>' +
      '</div>';
    pollTm = setInterval(consultarViaje, 2500);
  }

  if(ph==="done"){
    v.innerHTML = 
      '<div style="text-align:center;padding:20px 0">' +
        '<h2 style="font-size:26px;font-weight:800;margin:0">¡Llegaste a destino!</h2>' +
        '<div style="font-size:42px;font-weight:900;margin:16px 0;letter-spacing:-1px">'+M(price(S.ty))+'</div>' +
        '<p style="color:var(--ink-secondary);margin-bottom:24px">'+(S.pg==="Efectivo"?"Pagale en efectivo a tu chofer.":"El cobro fue completado con Mercado Pago.")+'</p>' +
        '<button class="btn-uber" onclick="S.d=null;S.dn=\'\';S.viajeId=null;draw();cambiarSeccion(\'home\')">Listo</button>' +
      '</div>';
  }
}

// ARRANQUE AUTOMÁTICO
if(!volverMP()) {
  cambiarSeccion("home");
}
</script>
</body>
</html>
