<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uder · Rosario de la Frontera</title>
<link rel="manifest" href="/manifest-pasajero.json">
<link rel="apple-touch-icon" href="/icon-pasajero.svg">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#14213D;--mute:#5B6678;--line:#D5DBE5;--accent:#F5B700;--on-accent:#14213D;--ok:#1F9D63;--bad:#D64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--card:#17233A;--ink:#EEF1F5;--mute:#9AA6BA;--line:#2A3956;--ok:#3CC884;--bad:#F07575}}
:root[data-theme="dark"]{--bg:#0E1626;--card:#17233A;--ink:#EEF1F5;--mute:#9AA6BA;--line:#2A3956;--ok:#3CC884;--bad:#F07575}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:440px;margin:0 auto;padding:0 16px 32px}
header{position:sticky;top:0;z-index:1000;background:var(--bg);padding:14px 0;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:26px;letter-spacing:-1px}
.logo i{font-style:normal;color:var(--accent);background:var(--ink);padding:0 6px;border-radius:6px;margin-right:6px}
.logo small{font-weight:600;font-size:12px;color:var(--mute);margin-left:6px;letter-spacing:0}
#map{height:300px;border-radius:20px;border:1px solid var(--line);margin-bottom:14px;z-index:1}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid var(--line)}
h2{margin:0 0 6px;font-size:22px;letter-spacing:-.5px}
p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:800 16px "Sora",sans-serif;cursor:pointer;background:var(--accent);color:var(--on-accent);margin-top:14px}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:600}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.st:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:9px 13px;font:600 13px "Sora",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.search{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px "Sora",sans-serif}
.go{border:0;border-radius:14px;padding:0 16px;background:var(--ink);color:var(--bg);font:700 14px "Sora",sans-serif;cursor:pointer}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;margin-top:8px;font:600 13px "Sora",sans-serif;cursor:pointer}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;margin-top:10px;font:600 15px "Sora",sans-serif;cursor:pointer}
.opt small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px}
.opt b{font-size:18px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--bg)}
.lbl{font-size:13px;font-weight:600;color:var(--mute);margin:18px 0 0}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok);width:0}
.tag{display:inline-block;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;background:var(--line);color:var(--ink)}
.plate{font-weight:800;letter-spacing:2px;border:2px solid var(--ink);border-radius:8px;padding:3px 10px;font-size:14px}
.st{border:0;background:none;font-size:34px;color:var(--line);cursor:pointer;padding:2px}.st.on{color:var(--accent)}
.fare{font-size:40px;font-weight:800;letter-spacing:-1.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:90%;z-index:2000}
.fl{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;color:var(--mute);line-height:1.4}
.badge-chofer{display:inline-flex;align-items:center;gap:6px;background:#e8f7ee;color:#1F9D63;font-weight:700;padding:6px 12px;border-radius:12px;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo"><i>U</i>der<small>Rosario de la Frontera</small></div>
  <button id="btn_instalar" class="chip" style="display:none;margin-left:auto;background:var(--accent);color:var(--on-accent);font-weight:800" onclick="instalarPwa()">📲 Instalar App</button>
</header>
<div id="map" role="application" aria-label="Mapa de Rosario de la Frontera"></div>
<main id="v"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// PWA: Service Worker e Instalación
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  var b = $("btn_instalar");
  if(b) b.style.display = "inline-flex";
});
function instalarPwa(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choiceResult){
      if(choiceResult.outcome === 'accepted'){
        var b = $("btn_instalar");
        if(b) b.style.display = "none";
      }
      deferredPrompt = null;
    });
  } else {
    alert("Para instalar en tu celular:\n\n1. Tocá los 3 puntitos ⋮ (o el botón compartir 📤 en iPhone).\n2. Elegí 'Instalar aplicación' o 'Agregar a Inicio'.");
  }
}

var CEN={lat:-25.798,lng:-64.968},BB={w:-65.05,e:-64.90,n:-25.74,s:-25.86};
var S={o:null,on:"",d:null,dn:"",mode:"o",ty:0,pg:"Efectivo",p:0,dr:null,km:0,cuadras:0,res:[],msg:"¿Dónde te buscamos? Escribí tu calle o tocá '🎯 Mi ubicación'.",ph:"home",oref:"",dref:"",viajeId:null,mapFitDone:false},tm=null,pollTm=null;

var TY=[
  ["Remis","Servicio tradicional de remis",1.0],
  ["Uder","Auto particular, el más económico",0.95]
];

var PG=["Efectivo","Mercado Pago"];

function $(x){return document.getElementById(x)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function lab(n, r){
  var nom = esc(n || "Punto");
  var ref = esc(r || "").trim();
  if(!ref) return nom;
  var soloNum = ref.replace(/altura\s*/gi, "").trim();
  if(nom.indexOf(soloNum) >= 0 || nom.indexOf(ref) >= 0) return nom;
  return nom + " · " + ref;
}

function setRef(v){if(S.mode==="o")S.oref=v;else S.dref=v}
var U=null;try{U=JSON.parse(localStorage.getItem("uder_user")||"null")}catch(e){}
function save(){try{localStorage.setItem("uder_user",JSON.stringify(U))}catch(e){}}
function logout(){U=null;try{localStorage.removeItem("uder_user")}catch(e){}toast("Tus datos se borraron");go("welcome")}
function err(m){$("err").textContent=m}
function age(s){var d=new Date(s),t=new Date(),a=t.getFullYear()-d.getFullYear(),m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a}

function saveReg(){
  var n=$("f_n").value.trim(),a=$("f_a").value.trim(),d=$("f_d").value,i=$("f_i").value.replace(/\D/g,""),re=/^[A-Za-z\u00C0-\u00FF'. -]{2,}$/;
  if(!re.test(n))return err("Escribí tu nombre completo.");if(!re.test(a))return err("Escribí tu apellido.");
  if(!d||isNaN(new Date(d))||new Date(d).getFullYear()<1900)return err("Elegí tu fecha de nacimiento.");
  if(age(d)<18)return err("Tenés que ser mayor de 18 años para pedir viajes.");
  if(i.length<7||i.length>8)return err("El DNI debe tener 7 u 8 números.");
  if(!$("f_k").checked)return err("Tenés que aceptar los términos para continuar.");
  U={nombre:n,apellido:a,nac:d,dni:i};save();toast("¡Bienvenido/a, "+n+"!");go("home")
}

function esNocturno(){
  var h = new Date().getHours();
  return (h >= 22 || h < 6);
}

function getCuadras(){
  return Math.max(1, Math.round(S.km * 10));
}

function price(i){
  var cuadras = getCuadras();
  var base = esNocturno() ? 3600 : 2600;
  var total = base;
  if(cuadras > 10){
    total += (cuadras - 10) * 320;
  }
  var mult = (TY[i] && TY[i][2]) ? TY[i][2] : 1.0;
  return Math.round(total * mult);
}

function pedirViajeReal(){
  var monto = Math.round(price(S.ty));
  var cuadras = getCuadras();
  var payload = {
    pasajero_nombre: U.nombre + (U.apellido ? " " + U.apellido.charAt(0) + "." : ""),
    tipo: TY[S.ty][0],
    forma_pago: S.pg,
    monto: monto,
    ganancia_conductor: Math.round(monto * 0.85),
    km: Number(S.km.toFixed(1)),
    cuadras: cuadras,
    origen_nombre: S.on,
    origen_ref: S.oref || "",
    origen_lat: S.o.lat,
    origen_lng: S.o.lng,
    destino_nombre: S.dn,
    destino_ref: S.dref || "",
    destino_lat: S.d.lat,
    destino_lng: S.d.lng,
    pasajero_lat: S.o.lat,
    pasajero_lng: S.o.lng,
    estado: "buscando",
    pago_estado: "pendiente"
  };

  fetch("/api/pedir-viaje", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json() })
  .then(function(j){
    if(!j.viaje) throw new Error("Error al crear viaje");
    S.viajeId = j.viaje.id;
    try {
      sessionStorage.setItem("uder_trip", JSON.stringify({
        viajeId: S.viajeId, o:S.o, on:S.on, oref:S.oref, d:S.d, dn:S.dn, dref:S.dref, km:S.km, cuadras:cuadras, ty:S.ty, pg:S.pg
      }));
    } catch(e){}

    if(S.pg === "Mercado Pago"){
      pagarMP(j.viaje.id, monto);
    } else {
      go("search");
    }
  })
  .catch(function(e){
    toast("No se pudo pedir el viaje. Probá de nuevo.");
  });
}

function ask(){
  pedirViajeReal();
}

function pagarMP(viajeId, monto){
  toast("Abriendo Mercado Pago…");
  fetch("/api/crear-pago", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      viaje_id: viajeId,
      monto: monto,
      descripcion: "Viaje Uder: "+S.on+" a "+S.dn,
      nombre: U.nombre,
      apellido: U.apellido,
      dni: U.dni
    })
  })
  .then(function(r){ return r.json() })
  .then(function(j){
    if(!j.url) throw 0;
    location.href = j.url;
  })
  .catch(function(){
    toast("No se pudo conectar con Mercado Pago. Probá de nuevo.");
  });
}

function volverMP(){
  var q=new URLSearchParams(location.search),r=q.get("pago");if(!r)return false;
  var id=q.get("payment_id")||q.get("collection_id"), viajeId=q.get("viaje"), t=null;
  try{t=JSON.parse(sessionStorage.getItem("uder_trip")||"null")}catch(e){}
  history.replaceState(null,"",location.pathname);
  if(!t && !viajeId){go("home");toast("No encontramos tu viaje.");return true}
  if(t) Object.assign(S,t);
  if(viajeId) S.viajeId = viajeId;
  draw();

  if(r==="ok"&&id){
    S.ph="verif";$("v").innerHTML='<div class="card"><h2>Confirmando pago…</h2><p>Estamos verificando con Mercado Pago.</p><div class="bar"><i style="width:75%"></i></div></div>';
    fetch("/api/verificar-pago?payment_id="+encodeURIComponent(id)+"&ref="+encodeURIComponent(t?t.ref:"")+"&viaje="+encodeURIComponent(S.viajeId||""))
    .then(function(x){return x.json()})
    .then(function(j){
      if(j.aprobado){
        toast("Pago acreditado ✓");
        go("search");
      }else{
        toast("No pudimos confirmar el pago.");
        go("opt");
      }
    }).catch(function(){toast("Error de verificación.");go("opt")});
    return true;
  }
  toast("El pago no se completó.");go("opt");return true;
}

// SEGUIMIENTO EN VIVO DEL CHOFER EN EL MAPA
var carMarker = null;

function actualizarPosicionChofer(pos){
  if(!pos || pos.lat == null || pos.lng == null) return;
  var p = [pos.lat, pos.lng];

  if(!carMarker){
    var carHtml = '<div style="background:#14213D;color:#F5B700;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.5)">🚗</div>';
    carMarker = L.marker(p, {
      icon: L.divIcon({ className: '', html: carHtml, iconSize: [38, 38], iconAnchor: [19, 19] }),
      zIndexOffset: 2000
    }).addTo(map);
    carMarker.bindTooltip("Tu conductor", { permanent: false, direction: "top" });
  } else {
    carMarker.setLatLng(p);
  }

  if(S.ph === "pick" && S.o){
    var distKm = hav({lat: pos.lat, lng: pos.lng}, S.o);
    var cuadras = Math.max(1, Math.round(distKm * 10));
    var elDist = $("eta_chofer");

    if(elDist){
      if(distKm < 0.12){
        elDist.innerHTML = '<span class="badge-chofer" style="background:#fff3cd;color:#856404">🔔 <b>¡Tu conductor ya está en tu puerta!</b></span>';
      } else {
        var txtDist = distKm < 1 ? Math.round(distKm * 1000) + " metros" : distKm.toFixed(1) + " km";
        elDist.innerHTML = '<span class="badge-chofer">🚗 Conductor a <b>' + cuadras + ' cuadras</b> (' + txtDist + ')</span>';
      }
    }

    if(!S.mapFitDone){
      map.fitBounds([p, [S.o.lat, S.o.lng]], { padding: [60, 60], maxZoom: 17 });
      S.mapFitDone = true;
    }
  }

  if(S.ph === "trip" && S.d){
    var distDest = hav({lat: pos.lat, lng: pos.lng}, S.d);
    var elDest = $("eta_destino");
    if(elDest){
      var cuadrasRest = Math.max(1, Math.round(distDest * 10));
      elDest.innerHTML = '<span class="badge-chofer">🏁 Faltan <b>' + cuadrasRest + ' cuadras</b> para llegar</span>';
    }
  }
}

function consultarViaje(){
  if(!S.viajeId) return;
  fetch("/api/estado-viaje?id="+encodeURIComponent(S.viajeId))
  .then(function(r){return r.json()})
  .then(function(res){
    var v = res.viaje;
    if(!v) return;

    if(v.estado === "cancelado"){
      clearInterval(pollTm);
      toast("El viaje fue cancelado.");
      go("home");
      return;
    }

    if((v.estado === "aceptado" || v.estado === "en_camino") && S.ph === "search"){
      S.dr = [v.conductor_nombre, v.vehiculo, v.patente];
      go("pick");
    }

    if(res.conductor_pos){
      actualizarPosicionChofer(res.conductor_pos);
    }

    if(v.estado === "en_curso" && S.ph === "pick"){
      go("trip");
    }

    if(v.estado === "finalizado" && (S.ph === "trip" || S.ph === "pick")){
      clearInterval(pollTm);
      go("done");
    }
  })
  .catch(function(){});
}

function cancelarViajeActual(){
  if(S.viajeId){
    fetch("/api/cancelar-viaje", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id: S.viajeId})
    });
  }
  clearInterval(pollTm);
  toast("Viaje cancelado");
  go("home");
}

function M(n){return "$"+Math.round(n).toLocaleString("es-AR")}
function hav(p,q){var r=Math.PI/180,u=(q.lat-p.lat)*r,w=(q.lng-p.lng)*r,a=Math.pow(Math.sin(u/2),2)+Math.cos(p.lat*r)*Math.cos(q.lat*r)*Math.pow(Math.sin(w/2),2);return 12742*Math.asin(Math.sqrt(a))}
function toast(m){var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}

// CÁLCULO DE RUTA: 100% POR CALLES Y CURVAS REALES
function calcularRutaReal(origen, destino){
  var distDirecta = hav(origen, destino);
  var urlDirecta = "https://router.project-osrm.org/route/v1/driving/" + origen.lng + "," + origen.lat + ";" + destino.lng + "," + destino.lat + "?overview=full&geometries=geojson&alternatives=true";

  var cruceLng = -64.9620, cruceLat = -25.7935;
  var urlConCruce = "https://router.project-osrm.org/route/v1/driving/" + origen.lng + "," + origen.lat + ";" + cruceLng + "," + cruceLat + ";" + destino.lng + "," + destino.lat + "?overview=full&geometries=geojson";

  return fetch(urlDirecta)
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.routes || !j.routes.length) throw new Error("Sin ruta");
      var rDirecta = j.routes.sort(function(a,b){ return a.distance - b.distance; })[0];
      var kmDirecto = rDirecta.distance / 1000;

      if(kmDirecto > Math.max(0.6, distDirecta * 1.35)){
        return fetch(urlConCruce)
          .then(function(cr){ return cr.json(); })
          .then(function(cj){
            if(cj.routes && cj.routes.length){
              var rCruce = cj.routes[0];
              var kmCruce = rCruce.distance / 1000;
              if(kmCruce < kmDirecto){
                return {
                  km: Math.max(0.5, kmCruce),
                  puntos: rCruce.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
                };
              }
            }
            return {
              km: Math.max(0.5, Math.min(kmDirecto, distDirecta * 1.25)),
              puntos: rDirecta.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
            };
          })
          .catch(function(){
            return {
              km: Math.max(0.5, Math.min(kmDirecto, distDirecta * 1.25)),
              puntos: rDirecta.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
            };
          });
      }

      return {
        km: Math.max(0.5, kmDirecto),
        puntos: rDirecta.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
      };
    })
    .catch(function(){
      return {
        km: Math.max(0.5, distDirecta * 1.25),
        puntos: [[origen.lat, origen.lng], [destino.lat, destino.lng]]
      };
    });
}

// BUSCADOR INTELIGENTE
function buscarDireccion(textoUsuario){
  var numMatch = textoUsuario.match(/\b\d{1,5}\b/);
  var num = numMatch ? numMatch[0] : "";
  var textoLimpio = textoUsuario.replace(/\b\d{1,5}\b/g, "").trim();

  var tMin = textoLimpio.toLowerCase();
  var terminoBusqueda = textoLimpio;
  var esBarrioPeron = false;

  if(tMin.indexOf("peron") >= 0 || tMin.indexOf("malvina") >= 0){
    terminoBusqueda = "Ex Combatientes de Malvinas";
    esBarrioPeron = true;
  } else if(tMin.indexOf("mitre") >= 0){
    terminoBusqueda = "Bartolomé Mitre";
  } else if(tMin.indexOf("guemes") >= 0){
    terminoBusqueda = "Güemes";
  }

  var consulta = terminoBusqueda + (num ? " " + num : "");
  var urlGeoref = "https://apis.datos.gob.ar/georef/api/v2.0/direcciones?max=6&provincia=salta&departamento=rosario%20de%20la%20frontera&direccion=" + encodeURIComponent(consulta);

  return fetch(urlGeoref)
    .then(function(r){ return r.json() })
    .then(function(j){
      var lista = (j.direcciones || []).filter(function(d){ return d.ubicacion && d.ubicacion.lat != null; });
      if(lista.length > 0){
        return lista.map(function(d){
          var nom = d.nomenclatura ? d.nomenclatura.split(",")[0] : d.calle.nombre;
          if(esBarrioPeron) nom = "Ex Combatientes de Malvinas (B° Perón)";
          return {
            p: { lat: parseFloat(d.ubicacion.lat), lng: parseFloat(d.ubicacion.lon) },
            n: nom,
            num: num,
            refSugerida: num ? "altura " + num : ""
          };
        });
      }
      throw new Error("No en georef");
    })
    .catch(function(){
      var nomUrl = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=ar&viewbox=" + BB.w + "," + BB.n + "," + BB.e + "," + BB.s + "&bounded=0&q=" + encodeURIComponent(terminoBusqueda + ", Rosario de la Frontera, Salta");
      return fetch(nomUrl)
        .then(function(r){ return r.json() })
        .then(function(arr){
          if(!Array.isArray(arr) || !arr.length) return [];
          return arr.map(function(x){
            var calleNombre = x.display_name.split(",")[0];
            calleNombre = calleNombre.replace(/Ram[oó]n Abdala/gi, "B° Perón");
            if(esBarrioPeron && calleNombre.indexOf("Perón") < 0) calleNombre = "Ex Combatientes de Malvinas (B° Perón)";
            return {
              p: { lat: parseFloat(x.lat), lng: parseFloat(x.lon) },
              n: calleNombre,
              num: num,
              refSugerida: num ? "altura " + num : ""
            };
          });
        })
        .catch(function(){ return []; });
    });
}

var map=L.map("map",{zoomControl:true}).setView([CEN.lat,CEN.lng],14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© Colaboradores de OpenStreetMap"}).addTo(map);
var G=L.layerGroup().addTo(map),routeLine=null;

function pin(p,c,m,t){
  var k=L.marker([p.lat,p.lng],{draggable:true,icon:L.divIcon({className:"",html:'<div style="width:22px;height:22px;border-radius:50%;background:'+c+';border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(G).bindTooltip(t);
  k.on("dragend",function(){
    var q=k.getLatLng();
    if(S.ph==="home") setPt(m,{lat:q.lat,lng:q.lng},null,true);
  });
}

function draw(keep){
  G.clearLayers();
  routeLine=null;
  var b=[];
  if(S.o){pin(S.o,"#14213D","o","Desde: "+lab(S.on,S.oref));b.push([S.o.lat,S.o.lng])}
  if(S.d){pin(S.d,"#D64545","d","Hasta: "+lab(S.dn,S.dref));b.push([S.d.lat,S.d.lng])}
  
  if(S.o && S.d){
    calcularRutaReal(S.o, S.d).then(function(res){
      S.km = res.km;
      S.cuadras = getCuadras();
      routeLine = L.polyline(res.puntos, {color:"#14213D", weight:5, opacity:0.85}).addTo(G);
      var distEl = $("calc_dist");
      var tagHorario = esNocturno() ? "🌙 Tarifa Nocturna" : "☀️ Tarifa Diurna";
      if(distEl) distEl.innerHTML = S.cuadras + " cuadras (" + S.km.toFixed(1) + " km) · " + tagHorario;
    });
  }

  if(keep)return;
  if(b.length===2) map.fitBounds(b,{padding:[40,40]});
  else if(b.length===1) map.setView(b[0],16);
}

function setPt(m,p,n,keep){
  if(m==="o"){
    S.o=p;
    S.on=n||"Punto en el mapa";
    if(!S.d){
      S.mode="d";
      S.msg="¡Salida lista! Ahora escribí tu destino o tocalo en el mapa.";
    } else {
      S.msg="Punto de retiro actualizado.";
    }
  } else {
    S.d=p;
    S.dn=n||"Punto en el mapa";
    S.msg="Destino listo. Tocá 'Ver opciones' para pedir tu viaje.";
  }
  S.res=[];
  draw(keep);
  go("home");

  setTimeout(function(){
    var qEl = $("q");
    if(qEl && S.mode === "d" && !S.d){
      qEl.value = "";
      qEl.placeholder = "Escribí tu destino (ej: peron 412, mitre 185)";
      qEl.focus();
    }
  }, 100);
}

map.on("click",function(e){
  if(S.ph!=="home")return;
  if(S.mode==="o")S.oref="";else S.dref="";
  setPt(S.mode,{lat:e.latlng.lat,lng:e.latlng.lng},"Punto en el mapa");
});

function mode(m){S.mode=m;go("home")}

function loc(){
  if(!navigator.geolocation){S.msg="Tu navegador no permite ubicación.";go("home");return}
  S.msg="Conectando satélites GPS precisos…";
  go("home");

  var mejorFix = null;
  var wId = navigator.geolocation.watchPosition(function(g){
    var lat = g.coords.latitude, lng = g.coords.longitude, acc = g.coords.accuracy;
    if(!mejorFix || acc < mejorFix.acc){
      mejorFix = { lat: lat, lng: lng, acc: acc };
    }
    if(acc <= 25){
      navigator.geolocation.clearWatch(wId);
      aplicarLoc(mejorFix.lat, mejorFix.lng, mejorFix.acc);
    }
  }, function(){
    S.msg="No pudimos activar el GPS. Marcá tu salida en el mapa o escribí tu calle.";
    go("home");
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 9000 });

  setTimeout(function(){
    navigator.geolocation.clearWatch(wId);
    if(mejorFix){
      aplicarLoc(mejorFix.lat, mejorFix.lng, mejorFix.acc);
    }
  }, 4500);
}

function aplicarLoc(lat, lng, acc){
  var enRosario = (lng > BB.w && lng < BB.e && lat > BB.s && lat < BB.n);
  if(enRosario){
    S.msg = "GPS satelital detectado (±" + Math.round(acc) + " m).";
    S.oref = "";
    setPt("o", { lat: lat, lng: lng }, "Mi ubicación actual");
    map.setView([lat, lng], 17);
  } else {
    S.msg = "Aviso: En la compu internet te ubica en Salta Capital (las PCs no tienen GPS). Te dejamos en el centro para probar.";
    setPt("o", { lat: CEN.lat, lng: CEN.lng }, "Centro (Punto de prueba)");
    map.setView([CEN.lat, CEN.lng], 16);
  }
}

function find(){
  var q = $("q").value.trim();
  if(!q){ toast("Escribí una calle"); return; }
  S.msg = "Buscando…";
  go("home");
  $("q").value = q;

  buscarDireccion(q).then(function(rs){
    S.res = rs;
    S.msg = rs.length ? "Elegí el lugar correcto:" : "No encontramos esa calle. Probá escribiéndola de otra forma o tocala en el mapa.";
    go("home");
    $("q").value = q;
  }).catch(function(){
    S.msg = "No se pudo buscar. Marcá el punto en el mapa.";
    go("home");
  });
}

function pickRes(i){
  var r = S.res[i];
  if(!r) return;
  var ref = r.refSugerida || (r.num ? "altura " + r.num : "");
  if(S.mode === "o") S.oref = ref; else S.dref = ref;
  setPt(S.mode, r.p, r.n);
}

function opts(){
  if(!S.o||!S.d){toast("Marcá origen y destino");return}
  if(hav(S.o,S.d)<.05){toast("El destino está muy cerca");return}
  
  toast("Calculando la ruta por calles…");
  calcularRutaReal(S.o, S.d).then(function(res){
    S.km = res.km;
    S.cuadras = getCuadras();
    go("opt");
  });
}

function go(ph){
  if(ph==="home"&&!U)ph="welcome";
  clearInterval(tm);clearInterval(pollTm);
  S.ph=ph;
  var v=$("v");
  var showMap=!(ph==="welcome"||ph==="reg");
  $("map").style.display=showMap?"block":"none";
  if(showMap)map.invalidateSize();

  if(ph==="home"||ph==="opt"){
    if(carMarker){ map.removeLayer(carMarker); carMarker = null; }
    S.mapFitDone = false;
  }

  if(ph==="welcome"){v.innerHTML='<div class="card"><h2>Viajá seguro con Uder</h2><p>Rosario de la Frontera. Registrate para pedir tu auto en efectivo o con Mercado Pago.</p>'+(U?'<button class="btn" onclick="go(\'home\')">Continuar como '+esc(U.nombre)+'</button><button class="btn ghost" onclick="logout()">Cerrar sesión</button>':'<button class="btn" onclick="go(\'reg\')">Registrarme</button>')+'</div>'}
  if(ph==="reg"){var mx=new Date().toISOString().slice(0,10);v.innerHTML='<div class="card"><h2>Creá tu cuenta</h2><label class="fl">Nombre</label><input id="f_n"><label class="fl">Apellido</label><input id="f_a"><label class="fl">Nacimiento</label><input id="f_d" type="date" max="'+mx+'"><label class="fl">DNI</label><input id="f_i" inputmode="numeric" maxlength="10"><label class="ck"><input type="checkbox" id="f_k">Acepto los términos de Uder.</label><p id="err" style="color:var(--bad);margin-top:10px"></p><button class="btn" onclick="saveReg()">Crear cuenta</button><button class="btn ghost" onclick="go(\'welcome\')">Volver</button></div>'}

  if(ph==="home"){
    var tagH = esNocturno() ? "🌙 Tarifa Nocturna" : "☀️ Tarifa Diurna";
    var placeholderTxt = S.mode === "o" ? "Escribí tu salida (ej: guemes 248)" : "Escribí tu destino (ej: peron 412)";
    v.innerHTML='<div class="card"><h2>¿A dónde vamos, '+esc(U.nombre)+'?</h2><p>'+esc(S.msg)+'</p><div class="chips"><button class="chip" onclick="loc()">🎯 Mi ubicación</button><button class="chip" aria-pressed="'+(S.mode==="o")+'" onclick="mode(\'o\')">Punto de retiro</button><button class="chip" aria-pressed="'+(S.mode==="d")+'" onclick="mode(\'d\')">Destino</button></div><div class="search"><input id="q" placeholder="'+placeholderTxt+'"><button class="go" onclick="find()">Buscar</button></div>'+S.res.map(function(r,i){return '<button class="res" onclick="pickRes('+i+')">'+esc(r.n)+'</button>'}).join("")+'<div class="lbl">Altura o referencia</div><input id="rf" style="width:100%;margin-top:8px" placeholder="Ej. 185, portón negro, Mza B casa 4" value="'+esc(S.mode==="o"?S.oref:S.dref)+'" oninput="setRef(this.value)"><p style="margin-top:14px"><b>Desde:</b> '+(S.o?lab(S.on,S.oref):"sin elegir")+'<br><b>Hasta:</b> '+(S.d?lab(S.dn,S.dref):"sin elegir")+'<br><small id="calc_dist" style="color:var(--mute)">'+(S.o&&S.d?S.cuadras+" cuadras ("+S.km.toFixed(1)+" km) · "+tagH:"")+'</small></p><button class="btn" onclick="opts()">Ver opciones</button></div>';
    $("q").addEventListener("keydown",function(e){if(e.key==="Enter")find()});
  }

  if(ph==="opt"){
    var cuadras = getCuadras();
    var noche = esNocturno();
    var horarioTexto = noche ? "🌙 Tarifa Nocturna (Base $3.600)" : "☀️ Tarifa Diurna (Base $2.600)";
    var detalleCuadras = cuadras <= 10 ? cuadras + " cuadras (cubre la base de 10 cuadras)" : cuadras + " cuadras (" + (cuadras - 10) + " extras × $320)";

    v.innerHTML='<div class="card"><h2>Elegí tu viaje</h2><p>'+lab(S.on,S.oref)+' → '+lab(S.dn,S.dref)+'<br><b>'+detalleCuadras+'</b><br><small style="color:var(--mute)">'+horarioTexto+'</small></p>'+TY.map(function(t,i){return '<button class="opt" aria-pressed="'+(i===S.ty)+'" onclick="S.ty='+i+';go(\'opt\')"><span>'+t[0]+'<small>'+t[1]+'</small></span><b>'+M(price(i))+'</b></button>'}).join("")+'<div class="lbl">Forma de pago</div>'+PG.map(function(x){return '<button class="opt" aria-pressed="'+(x===S.pg)+'" onclick="S.pg=\''+x+'\';go(\'opt\')">'+x+'</button>'}).join("")+'<button class="btn" onclick="ask()">Pedir '+TY[S.ty][0]+' · '+M(price(S.ty))+'</button><button class="btn ghost" onclick="go(\'home\')">Cambiar ruta</button></div>';
  }

  if(ph==="search"){
    v.innerHTML='<div class="card"><h2>Buscando conductor…</h2><p>Avisando a los choferes conectados en Rosario de la Frontera.</p><div class="bar"><i style="width:60%"></i></div><button class="btn ghost" onclick="cancelarViajeActual()">Cancelar pedido</button></div>';
    pollTm=setInterval(consultarViaje, 2500);
  }

  if(ph==="pick"){
    var d=S.dr||["Conductor asignado","Auto en camino","---"];
    v.innerHTML='<div class="card"><h2>'+esc(d[0])+' aceptó tu viaje</h2><div class="row" style="margin:8px 0"><p>'+esc(d[1])+'</p><span class="plate">'+esc(d[2])+'</span></div><div class="row"><b>En camino a retirarte</b><span class="tag">'+esc(S.pg)+'</span></div><div id="eta_chofer" style="margin:12px 0"><span class="badge-chofer">🚗 Localizando conductor en el mapa…</span></div><button class="btn ghost" onclick="cancelarViajeActual()">Cancelar viaje</button></div>';
    pollTm=setInterval(consultarViaje, 2500);
  }

  if(ph==="trip"){
    v.innerHTML='<div class="card"><h2>Viaje en curso</h2><p>Hacia '+lab(S.dn,S.dref)+' con '+esc(S.dr[0])+'</p><div class="row" style="margin-top:8px"><b id="eta_destino">En viaje a destino</b><b>'+M(price(S.ty))+'</b></div><div class="bar"><i style="width:85%"></i></div></div>';
    pollTm=setInterval(consultarViaje, 2500);
  }

  if(ph==="done"){
    v.innerHTML='<div class="card"><h2>Llegaste a destino</h2><div class="fare">'+M(price(S.ty))+'</div><p>'+(S.pg==="Efectivo"?"Pagá en mano al chofer.":"Pagado con "+esc(S.pg)+".")+'</p><button class="btn" onclick="S.d=null;S.dn=\'\';S.viajeId=null;draw();go(\'home\')">Finalizar</button></div>';
  }
}

if(!volverMP())go("home");
</script>
</body>
</html>
