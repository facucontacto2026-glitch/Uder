<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uder · Rosario de la Frontera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#14213D;--mute:#5B6678;--line:#D5DBE5;--accent:#F5B700;--on-accent:#14213D;--ok:#1F9D63;--bad:#D64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--card:#17233A;--ink:#EEF1F5;--mute:#9AA6BA;--line:#2A3956;--ok:#3CC884;--bad:#F07575}}
:root[data-theme="dark"]{--bg:#0E1626;--card:#17233A;--ink:#EEF1F5;--mute:#9AA6BA;--line:#2A3956;--ok:#3CC884;--bad:#F07575}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:440px;margin:0 auto;padding:0 16px 32px}
header{position:sticky;top:0;z-index:1000;background:var(--bg);padding:14px 0}
.logo{font-weight:800;font-size:26px;letter-spacing:-1px}
.logo i{font-style:normal;color:var(--accent);background:var(--ink);padding:0 6px;border-radius:6px;margin-right:6px}
.logo small{font-weight:600;font-size:12px;color:var(--mute);margin-left:6px;letter-spacing:0}
#map{height:300px;border-radius:20px;border:1px solid var(--line);margin-bottom:14px;z-index:1}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid var(--line)}
h2{margin:0 0 6px;font-size:22px;letter-spacing:-.5px}
p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:800 16px "Sora",sans-serif;cursor:pointer;background:var(--accent);color:var(--on-accent);margin-top:14px}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:600}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.st:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:9px 13px;font:600 13px "Sora",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.search{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px "Sora",sans-serif}
.go{border:0;border-radius:14px;padding:0 16px;background:var(--ink);color:var(--bg);font:700 14px "Sora",sans-serif;cursor:pointer}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;margin-top:8px;font:600 13px "Sora",sans-serif;cursor:pointer}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;margin-top:10px;font:600 15px "Sora",sans-serif;cursor:pointer}
.opt small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px}
.opt b{font-size:18px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--bg)}
.lbl{font-size:13px;font-weight:600;color:var(--mute);margin:18px 0 0}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok);width:0}
.tag{display:inline-block;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;background:var(--line);color:var(--ink)}
.plate{font-weight:800;letter-spacing:2px;border:2px solid var(--ink);border-radius:8px;padding:3px 10px;font-size:14px}
.st{border:0;background:none;font-size:34px;color:var(--line);cursor:pointer;padding:2px}.st.on{color:var(--accent)}
.fare{font-size:40px;font-weight:800;letter-spacing:-1.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:90%;z-index:2000}
.fl{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;color:var(--mute);line-height:1.4}
</style>
</head>
<body>
<div class="app">
<header><div class="logo"><i>U</i>der<small>Rosario de la Frontera</small></div></header>
<div id="map" role="application" aria-label="Mapa de Rosario de la Frontera"></div>
<main id="v"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
var CEN={lat:-25.800,lng:-64.967},BB={w:-65.10,e:-64.88,n:-25.72,s:-25.88};
var S={o:null,on:"",d:null,dn:"",mode:"d",ty:0,pg:"Efectivo",p:0,dr:null,km:0,cuadras:0,res:[],msg:"Buscá una calle, barrio o tocá el mapa.",ph:"home",oref:"",dref:"",viajeId:null},tm=null,pollTm=null;
var TY=[["Remis","Servicio estándar",1.0],["Taxi","Con habilitación",1.05],["Uder X","Auto particular",0.95]];
var PG=["Efectivo","Mercado Pago","Tarjeta"];

function $(x){return document.getElementById(x)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function lab(n,r){return esc(n)+(r?" · "+esc(r):"")}
function setRef(v){if(S.mode==="o")S.oref=v;else S.dref=v}
var U=null;try{U=JSON.parse(localStorage.getItem("uder_user")||"null")}catch(e){}
function save(){try{localStorage.setItem("uder_user",JSON.stringify(U))}catch(e){}}
function logout(){U=null;try{localStorage.removeItem("uder_user")}catch(e){}toast("Tus datos se borraron");go("welcome")}
function err(m){$("err").textContent=m}
function age(s){var d=new Date(s),t=new Date(),a=t.getFullYear()-d.getFullYear(),m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a}
function luhn(n){var s=0,d=false;for(var i=n.length-1;i>=0;i--){var x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function brand(n){if(/^4/.test(n))return"Visa";if(/^(5[1-5]|2[2-7])/.test(n))return"Mastercard";if(/^3[47]/.test(n))return"Amex";return"Tarjeta"}

function saveReg(){
  var n=$("f_n").value.trim(),a=$("f_a").value.trim(),d=$("f_d").value,i=$("f_i").value.replace(/\D/g,""),re=/^[A-Za-z\u00C0-\u00FF'. -]{2,}$/;
  if(!re.test(n))return err("Escribí tu nombre completo.");if(!re.test(a))return err("Escribí tu apellido.");
  if(!d||isNaN(new Date(d))||new Date(d).getFullYear()<1900)return err("Elegí tu fecha de nacimiento.");
  if(age(d)<18)return err("Tenés que ser mayor de 18 años para pedir viajes.");
  if(i.length<7||i.length>8)return err("El DNI debe tener 7 u 8 números.");
  if(!$("f_k").checked)return err("Tenés que aceptar los términos para continuar.");
  U={nombre:n,apellido:a,nac:d,dni:i,card:null};save();toast("¡Bienvenido/a, "+n+"!");go("home")
}

function saveCard(){
  var n=$("c_n").value.replace(/\D/g,""),e=$("c_e").value,c=$("c_c").value.replace(/\D/g,""),t=$("c_t").value.trim(),m=/^(\d{2})\/(\d{2})$/.exec(e);
  if(n.length<13||n.length>19||!luhn(n))return err("El número de tarjeta no es válido.");
  if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],1)<=new Date())return err("Revisá el vencimiento.");
  if(c.length<3||c.length>4)return err("Código de seguridad incorrecto.");
  if(t.length<3)return err("Nombre en la tarjeta requerido.");
  U.card={brand:brand(n),last4:n.slice(-4)};save();toast("Tarjeta guardada: "+U.card.brand+" ··"+U.card.last4);var b=S.back||"home";S.back="";go(b)
}

// SISTEMA DE TARIFAS: DÍA vs NOCHE + CUADRAS
function esNocturno(){
  var h = new Date().getHours();
  return (h >= 22 || h < 6);
}

function getCuadras(){
  return Math.max(1, Math.ceil(S.km * 10));
}

function price(i){
  var cuadras = getCuadras();
  var base = esNocturno() ? 3600 : 2600;
  var total = base;
  if(cuadras > 10){
    total += (cuadras - 10) * 320;
  }
  var mult = (TY[i] && TY[i][2]) ? TY[i][2] : 1.0;
  return Math.round(total * mult);
}

function pedirViajeReal(){
  var monto = Math.round(price(S.ty));
  var cuadras = getCuadras();
  var payload = {
    pasajero_nombre: U.nombre + (U.apellido ? " " + U.apellido.charAt(0) + "." : ""),
    tipo: TY[S.ty][0],
    forma_pago: S.pg,
    monto: monto,
    ganancia_conductor: Math.round(monto * 0.85),
    km: Number(S.km.toFixed(1)),
    cuadras: cuadras,
    origen_nombre: S.on,
    origen_ref: S.oref || "",
    origen_lat: S.o.lat,
    origen_lng: S.o.lng,
    destino_nombre: S.dn,
    destino_ref: S.dref || "",
    destino_lat: S.d.lat,
    destino_lng: S.d.lng,
    pasajero_lat: S.o.lat,
    pasajero_lng: S.o.lng,
    estado: "buscando",
    pago_estado: "pendiente"
  };

  fetch("/api/pedir-viaje", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json() })
  .then(function(j){
    if(!j.viaje) throw new Error("Error al crear viaje");
    S.viajeId = j.viaje.id;
    try {
      sessionStorage.setItem("uder_trip", JSON.stringify({
        viajeId: S.viajeId, o:S.o, on:S.on, oref:S.oref, d:S.d, dn:S.dn, dref:S.dref, km:S.km, cuadras:cuadras, ty:S.ty, pg:S.pg
      }));
    } catch(e){}

    if(S.pg === "Mercado Pago"){
      pagarMP(j.viaje.id, monto);
    } else {
      go("search");
    }
  })
  .catch(function(e){
    toast("No se pudo pedir el viaje. Probá de nuevo.");
  });
}

function ask(){
  if(S.pg==="Tarjeta"&&!(U&&U.card)){S.back="opt";toast("Agregá una tarjeta primero");go("card");return}
  pedirViajeReal();
}

function pagarMP(viajeId, monto){
  toast("Abriendo Mercado Pago…");
  fetch("/api/crear-pago", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      viaje_id: viajeId,
      monto: monto,
      descripcion: "Viaje Uder: "+S.on+" a "+S.dn,
      nombre: U.nombre,
      apellido: U.apellido,
      dni: U.dni
    })
  })
  .then(function(r){ return r.json() })
  .then(function(j){
    if(!j.url) throw 0;
    location.href = j.url;
  })
  .catch(function(){
    toast("No se pudo conectar con Mercado Pago. Probá de nuevo.");
  });
}

function volverMP(){
  var q=new URLSearchParams(location.search),r=q.get("pago");if(!r)return false;
  var id=q.get("payment_id")||q.get("collection_id"), viajeId=q.get("viaje"), t=null;
  try{t=JSON.parse(sessionStorage.getItem("uder_trip")||"null")}catch(e){}
  history.replaceState(null,"",location.pathname);
  if(!t && !viajeId){go("home");toast("No encontramos tu viaje.");return true}
  if(t) Object.assign(S,t);
  if(viajeId) S.viajeId = viajeId;
  draw();

  if(r==="ok"&&id){
    S.ph="verif";$("v").innerHTML='<div class="card"><h2>Confirmando pago…</h2><p>Estamos verificando con Mercado Pago.</p><div class="bar"><i style="width:75%"></i></div></div>';
    fetch("/api/verificar-pago?payment_id="+encodeURIComponent(id)+"&ref="+encodeURIComponent(t?t.ref:"")+"&viaje="+encodeURIComponent(S.viajeId||""))
    .then(function(x){return x.json()})
    .then(function(j){
      if(j.aprobado){
        toast("Pago acreditado ✓");
        go("search");
      }else{
        toast("No pudimos confirmar el pago.");
        go("opt");
      }
    }).catch(function(){toast("Error de verificación.");go("opt")});
    return true;
  }
  toast("El pago no se completó.");go("opt");return true;
}

function consultarViaje(){
  if(!S.viajeId) return;
  fetch("/api/estado-viaje?id="+encodeURIComponent(S.viajeId))
  .then(function(r){return r.json()})
  .then(function(res){
    var v = res.viaje;
    if(!v) return;

    if(v.estado === "cancelado"){
      clearInterval(pollTm);
      toast("El viaje fue cancelado.");
      go("home");
      return;
    }

    if((v.estado === "aceptado" || v.estado === "en_camino") && S.ph === "search"){
      S.dr = [v.conductor_nombre, v.vehiculo, v.patente];
      go("pick");
    }

    if(res.conductor_pos && car){
      car.setLatLng([res.conductor_pos.lat, res.conductor_pos.lng]);
    }

    if(v.estado === "en_curso" && S.ph === "pick"){
      go("trip");
    }

    if(v.estado === "finalizado" && (S.ph === "trip" || S.ph === "pick")){
      clearInterval(pollTm);
      go("done");
    }
  })
  .catch(function(){});
}

function cancelarViajeActual(){
  if(S.viajeId){
    fetch("/api/cancelar-viaje", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id: S.viajeId})
    });
  }
  clearInterval(pollTm);
  toast("Viaje cancelado");
  go("home");
}

function M(n){return "$"+Math.round(n).toLocaleString("es-AR")}
function hav(p,q){var r=Math.PI/180,u=(q.lat-p.lat)*r,w=(q.lng-p.lng)*r,a=Math.pow(Math.sin(u/2),2)+Math.cos(p.lat*r)*Math.cos(q.lat*r)*Math.pow(Math.sin(w/2),2);return 12742*Math.asin(Math.sqrt(a))}
function toast(m){var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}

// RUTAS REALES CON SENTIDO DE CALLES
function calcularRutaReal(origen, destino){
  var u = "https://router.project-osrm.org/route/v1/driving/" + origen.lng + "," + origen.lat + ";" + destino.lng + "," + destino.lat + "?overview=full&geometries=geojson";
  return fetch(u)
    .then(function(r){ return r.json() })
    .then(function(j){
      if(!j.routes || !j.routes.length) throw new Error("Sin ruta");
      var r = j.routes[0];
      return {
        km: Math.max(0.5, r.distance / 1000),
        puntos: r.geometry.coordinates.map(function(c){ return [c[1], c[0]] })
      };
    })
    .catch(function(){
      var dist = Math.max(0.5, hav(origen, destino) * 1.35);
      return { km: dist, puntos: [[origen.lat, origen.lng], [destino.lat, destino.lng]] };
    });
}

// BUSCADOR INTELIGENTE DE CALLES Y BARRIOS (ROBUSTO Y SIN CAÍDAS)
function buscarDireccion(q){
  var numMatch = q.match(/\b\d{1,5}\b/);
  var num = numMatch ? numMatch[0] : "";
  
  // Limpiar palabras accesorias
  var limpia = q.replace(/\b(que es en el|que es en|en el|en|barrio|b°|bº)\b/gi, " ")
                .replace(/\s+/g, " ")
                .trim();
  var soloCalle = limpia.replace(/\b\d{1,5}\b/g, "").replace(/\s+/g, " ").trim();

  function queryPhoton(term){
    var url = "https://photon.komoot.io/api/?q=" + encodeURIComponent(term) +
              "&lat=" + CEN.lat + "&lon=" + CEN.lng + "&limit=6&lang=es";
    return fetch(url)
      .then(function(r){ return r.json() })
      .then(function(j){
        if(!j.features) return [];
        return j.features.map(function(f){
          var p = f.properties || {};
          var coords = f.geometry.coordinates;
          var calle = p.name || p.street || "";
          var barrio = p.district || p.suburb || "";
          var ciudad = p.city || "Rosario de la Frontera";
          var texto = calle + (barrio ? " · B° " + barrio : "") + " (" + ciudad + ")";
          return {
            p: { lat: coords[1], lng: coords[0] },
            n: texto,
            num: num,
            refSugerida: num ? "altura " + num + (barrio ? " (B° " + barrio + ")" : "") : (barrio ? "B° " + barrio : "")
          };
        }).filter(function(x){
          return (x.p.lng > BB.w - 0.2 && x.p.lng < BB.e + 0.2 && x.p.lat > BB.s - 0.2 && x.p.lat < BB.n + 0.2);
        });
      })
      .catch(function(){ return [] });
  }

  return queryPhoton(limpia + " Rosario de la Frontera")
    .then(function(res){
      if(res.length) return res;
      return queryPhoton(soloCalle + " Rosario de la Frontera");
    })
    .then(function(res){
      if(res.length) return res;
      return queryPhoton(soloCalle || limpia);
    });
}

// OBTENER NOMBRE AL TOCAR EL MAPA
function obtenerNombreUbicacion(lat, lng){
  var url = "https://photon.komoot.io/reverse?lat=" + lat + "&lon=" + lng;
  return fetch(url)
    .then(function(r){ return r.json() })
    .then(function(j){
      if(!j.features || !j.features.length) throw 0;
      var prop = j.features[0].properties || {};
      var calle = prop.name || prop.street || "";
      var barrio = prop.district || prop.suburb || "";
      if(calle && barrio) return calle + " (B° " + barrio + ")";
      if(calle) return calle;
      return "Punto en Rosario de la Frontera";
    })
    .catch(function(){
      return "Punto en el mapa";
    });
}

var map=L.map("map",{zoomControl:true}).setView([CEN.lat,CEN.lng],14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© Colaboradores de OpenStreetMap"}).addTo(map);
var G=L.layerGroup().addTo(map),car=null,routeLine=null;

function pin(p,c,m,t){
  var k=L.marker([p.lat,p.lng],{draggable:true,icon:L.divIcon({className:"",html:'<div style="width:22px;height:22px;border-radius:50%;background:'+c+';border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(G).bindTooltip(t);
  k.on("dragend",function(){
    var q=k.getLatLng();
    if(S.ph==="home") setPt(m,{lat:q.lat,lng:q.lng},null,true);
  });
}

function draw(keep){
  G.clearLayers();
  routeLine=null;
  var b=[];
  if(S.o){pin(S.o,"#14213D","o","Desde: "+S.on);b.push([S.o.lat,S.o.lng])}
  if(S.d){pin(S.d,"#D64545","d","Hasta: "+S.dn);b.push([S.d.lat,S.d.lng])}
  
  if(S.o && S.d){
    calcularRutaReal(S.o, S.d).then(function(res){
      S.km = res.km;
      S.cuadras = getCuadras();
      routeLine = L.polyline(res.puntos, {color:"#14213D", weight:5, opacity:0.85}).addTo(G);
      var distEl = $("calc_dist");
      var tagHorario = esNocturno() ? "🌙 Tarifa Nocturna" : "☀️ Tarifa Diurna";
      if(distEl) distEl.innerHTML = S.cuadras + " cuadras (" + S.km.toFixed(1) + " km) · " + tagHorario;
    });
  }

  if(keep)return;
  if(b.length===2) map.fitBounds(b,{padding:[40,40]});
  else if(b.length===1) map.setView(b[0],16);
}

function setPt(m,p,n,keep){
  if(m==="o"){S.o=p;S.on=n||"Buscando…"}else{S.d=p;S.dn=n||"Buscando…"}
  S.res=[];
  draw(keep);
  go("home");
  if(!n){
    obtenerNombreUbicacion(p.lat, p.lng).then(function(nm){
      if(m==="o" && S.o===p) S.on = nm;
      if(m==="d" && S.d===p) S.dn = nm;
      if(S.ph==="home") go("home");
    });
  }
}

map.on("click",function(e){
  if(S.ph!=="home")return;
  if(S.mode==="o")S.oref="";else S.dref="";
  setPt(S.mode,{lat:e.latlng.lat,lng:e.latlng.lng});
});

function mode(m){S.mode=m;go("home")}

// GPS DE ALTA PRECISIÓN SATELITAL
function loc(){
  if(!navigator.geolocation){S.msg="Tu celular no permite ubicación.";go("home");return}
  S.msg="Conectando satélites GPS para máxima precisión…";
  go("home");

  var bestPos = null;
  var watchId = navigator.geolocation.watchPosition(function(g){
    var acc = g.coords.accuracy;
    var p = {lat: g.coords.latitude, lng: g.coords.longitude};

    if(!bestPos || acc < bestPos.acc){
      bestPos = {p: p, acc: acc};
    }

    if(acc <= 20){
      navigator.geolocation.clearWatch(watchId);
      aplicarUbicacion(p, acc);
    }
  }, function(){
    S.msg="No pudimos activar el GPS. Probá tocando el mapa.";
    go("home");
  }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 0});

  setTimeout(function(){
    navigator.geolocation.clearWatch(watchId);
    if(bestPos) aplicarUbicacion(bestPos.p, bestPos.acc);
  }, 5000);
}

function aplicarUbicacion(p, acc){
  if(p.lng>BB.w && p.lng<BB.e && p.lat>BB.s && p.lat<BB.n){
    S.msg="GPS detectado con precisión de ±" + Math.round(acc) + " metros.";
    S.oref="";
    setPt("o",p);
  } else {
    S.msg="Estás fuera de Rosario de la Frontera: usamos el centro como punto de partida.";
    setPt("o",{lat:CEN.lat,lng:CEN.lng},"Centro de Rosario de la Frontera");
  }
}

function find(){
  var q = $("q").value.trim();
  if(!q){ toast("Escribí una calle o barrio"); return; }
  S.msg = "Buscando en Rosario de la Frontera…";
  go("home");
  $("q").value = q;

  buscarDireccion(q).then(function(rs){
    S.res = rs;
    S.msg = rs.length ? "Elegí el lugar correcto:" : "No encontramos esa calle exacta. Probá con otra o tocala directo en el mapa.";
    go("home");
    $("q").value = q;
  }).catch(function(){
    S.msg = "No se pudo buscar. Tocá el mapa para marcar el punto.";
    go("home");
  });
}

function pickRes(i){
  var r = S.res[i];
  if(!r) return;
  var ref = r.refSugerida || (r.num ? "altura " + r.num : "");
  if(S.mode === "o") S.oref = ref; else S.dref = ref;
  setPt(S.mode, r.p, r.n);
  if(ref) toast("Marcamos la calle. Se guardó la referencia: " + ref);
}

function opts(){
  if(!S.o||!S.d){toast("Marcá origen y destino");return}
  if(hav(S.o,S.d)<.05){toast("El destino está muy cerca");return}
  
  toast("Calculando recorrido exacto…");
  calcularRutaReal(S.o, S.d).then(function(res){
    S.km = res.km;
    S.cuadras = getCuadras();
    go("opt");
  });
}

function setCar(p){if(!car)car=L.circleMarker([p.lat,p.lng],{radius:11,color:"#14213D",weight:3,fillColor:"#F5B700",fillOpacity:1}).addTo(map);car.setLatLng([p.lat,p.lng])}
function rmCar(){if(car){map.removeLayer(car);car=null}}

function go(ph){
  if(ph==="home"&&!U)ph="welcome";
  clearInterval(tm);clearInterval(pollTm);
  S.ph=ph;
  var v=$("v");
  var showMap=!(ph==="welcome"||ph==="reg"||ph==="card");
  $("map").style.display=showMap?"block":"none";
  if(showMap)map.invalidateSize();
  if(ph==="home"||ph==="opt")rmCar();

  if(ph==="welcome"){v.innerHTML='<div class="card"><h2>Viajá seguro con Uder</h2><p>Rosario de la Frontera. Registrate para pedir tu auto.</p>'+(U?'<button class="btn" onclick="go(\'home\')">Continuar como '+esc(U.nombre)+'</button><button class="btn ghost" onclick="logout()">Cerrar sesión</button>':'<button class="btn" onclick="go(\'reg\')">Registrarme</button>')+'</div>'}
  if(ph==="reg"){var mx=new Date().toISOString().slice(0,10);v.innerHTML='<div class="card"><h2>Creá tu cuenta</h2><label class="fl">Nombre</label><input id="f_n"><label class="fl">Apellido</label><input id="f_a"><label class="fl">Nacimiento</label><input id="f_d" type="date" max="'+mx+'"><label class="fl">DNI</label><input id="f_i" inputmode="numeric" maxlength="10"><label class="ck"><input type="checkbox" id="f_k">Acepto los términos de Uder.</label><p id="err" style="color:var(--bad);margin-top:10px"></p><button class="btn" onclick="saveReg()">Crear cuenta</button><button class="btn ghost" onclick="go(\'welcome\')">Volver</button></div>'}
  if(ph==="card"){v.innerHTML='<div class="card"><h2>Tarjeta</h2><label class="fl">Número</label><input id="c_n" inputmode="numeric"><div class="row"><div><label class="fl">Vencimiento</label><input id="c_e" placeholder="MM/AA"></div><div><label class="fl">CVV</label><input id="c_c" type="password"></div></div><label class="fl">Titular</label><input id="c_t"><p id="err" style="color:var(--bad);margin-top:10px"></p><button class="btn" onclick="saveCard()">Guardar</button><button class="btn ghost" onclick="go(S.back||\'home\')">Volver</button></div>'}

  if(ph==="home"){
    var tagH = esNocturno() ? "🌙 Tarifa Nocturna" : "☀️ Tarifa Diurna";
    v.innerHTML='<div class="card"><h2>¿A dónde vamos, '+esc(U.nombre)+'?</h2><p>'+esc(S.msg)+'</p><div class="chips"><button class="chip" onclick="loc()">🎯 Mi ubicación</button><button class="chip" aria-pressed="'+(S.mode==="o")+'" onclick="mode(\'o\')">Punto de retiro</button><button class="chip" aria-pressed="'+(S.mode==="d")+'" onclick="mode(\'d\')">Destino</button></div><div class="search"><input id="q" placeholder="Buscar calle o barrio (Ej. Ex Combatientes, B° Perón)"><button class="go" onclick="find()">Buscar</button></div>'+S.res.map(function(r,i){return '<button class="res" onclick="pickRes('+i+')">'+esc(r.n)+'</button>'}).join("")+'<div class="lbl">Altura o referencia exacta</div><input id="rf" style="width:100%;margin-top:8px" placeholder="Ej. 412, portón negro, Mza B casa 4" value="'+esc(S.mode==="o"?S.oref:S.dref)+'" oninput="setRef(this.value)"><p style="margin-top:14px"><b>Desde:</b> '+(S.o?lab(S.on,S.oref):"sin elegir")+'<br><b>Hasta:</b> '+(S.d?lab(S.dn,S.dref):"sin elegir")+'<br><small id="calc_dist" style="color:var(--mute)">'+(S.o&&S.d?S.cuadras+" cuadras ("+S.km.toFixed(1)+" km) · "+tagH:"")+'</small></p><button class="btn" onclick="opts()">Ver opciones</button></div>';
    $("q").addEventListener("keydown",function(e){if(e.key==="Enter")find()});
  }

  if(ph==="opt"){
    var cuadras = getCuadras();
    var noche = esNocturno();
    var horarioTexto = noche ? "🌙 Tarifa Nocturna (Base $3.600)" : "☀️ Tarifa Diurna (Base $2.600)";
    var detalleCuadras = cuadras <= 10 ? cuadras + " cuadras (cubre la base de 10 cuadras)" : cuadras + " cuadras (" + (cuadras - 10) + " extras × $320)";

    v.innerHTML='<div class="card"><h2>Elegí tu viaje</h2><p>'+lab(S.on,S.oref)+' → '+lab(S.dn,S.dref)+'<br><b>'+detalleCuadras+'</b><br><small style="color:var(--mute)">'+horarioTexto+'</small></p>'+TY.map(function(t,i){return '<button class="opt" aria-pressed="'+(i===S.ty)+'" onclick="S.ty='+i+';go(\'opt\')"><span>'+t[0]+'<small>'+t[1]+'</small></span><b>'+M(price(i))+'</b></button>'}).join("")+'<div class="lbl">Forma de pago</div>'+PG.map(function(x){return '<button class="opt" aria-pressed="'+(x===S.pg)+'" onclick="S.pg=\''+x+'\';go(\'opt\')">'+x+(x==="Tarjeta"&&U&&U.card?" ·· "+esc(U.card.last4):"")+'</button>'}).join("")+'<button class="btn" onclick="ask()">Pedir '+TY[S.ty][0]+' · '+M(price(S.ty))+'</button><button class="btn ghost" onclick="go(\'home\')">Cambiar ruta</button></div>';
  }

  if(ph==="search"){
    v.innerHTML='<div class="card"><h2>Buscando conductor…</h2><p>Avisando a los choferes conectados en Rosario de la Frontera.</p><div class="bar"><i style="width:60%"></i></div><button class="btn ghost" onclick="cancelarViajeActual()">Cancelar pedido</button></div>';
    pollTm=setInterval(consultarViaje, 2500);
  }

  if(ph==="pick"){
    var d=S.dr||["Conductor asignado","Auto en camino","---"];
    v.innerHTML='<div class="card"><h2>'+esc(d[0])+' aceptó tu viaje</h2><div class="row" style="margin:8px 0"><p>'+esc(d[1])+'</p><span class="plate">'+esc(d[2])+'</span></div><div class="row"><b>En camino a retirarte</b><span class="tag">'+esc(S.pg)+'</span></div><div class="bar"><i style="width:50%"></i></div><button class="btn ghost" onclick="cancelarViajeActual()">Cancelar viaje</button></div>';
    pollTm=setInterval(consultarViaje, 3000);
  }

  if(ph==="trip"){
    v.innerHTML='<div class="card"><h2>Viaje en curso</h2><p>Hacia '+lab(S.dn,S.dref)+' con '+esc(S.dr[0])+'</p><div class="row" style="margin-top:8px"><b>En viaje</b><b>'+M(price(S.ty))+'</b></div><div class="bar"><i style="width:85%"></i></div></div>';
    pollTm=setInterval(consultarViaje, 3000);
  }

  if(ph==="done"){
    v.innerHTML='<div class="card"><h2>Llegaste a destino</h2><div class="fare">'+M(price(S.ty))+'</div><p>'+(S.pg==="Efectivo"?"Pagá en mano al chofer.":"Pagado con "+esc(S.pg)+".")+'</p><button class="btn" onclick="S.d=null;S.dn=\'\';S.viajeId=null;draw();go(\'home\')">Finalizar</button></div>';
  }
}

if(!volverMP())go("home");
</script>
</body>
</html>
