<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uder · Rosario de la Frontera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#14213D;--mute:#5B6678;--line:#D5DBE5;--accent:#F5B700;--on-accent:#14213D;--ok:#1F9D63;--bad:#D64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--card:#17233A;--ink:#EEF1F5;--mute:#9AA6BA;--line:#2A3956;--ok:#3CC884;--bad:#F07575}}
:root[data-theme="dark"]{--bg:#0E1626;--card:#17233A;--ink:#EEF1F5;--mute:#9AA6BA;--line:#2A3956;--ok:#3CC884;--bad:#F07575}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:440px;margin:0 auto;padding:0 16px 32px}
header{position:sticky;top:0;z-index:1000;background:var(--bg);padding:14px 0}
.logo{font-weight:800;font-size:26px;letter-spacing:-1px}
.logo i{font-style:normal;color:var(--accent);background:var(--ink);padding:0 6px;border-radius:6px;margin-right:6px}
.logo small{font-weight:600;font-size:12px;color:var(--mute);margin-left:6px;letter-spacing:0}
#map{height:300px;border-radius:20px;border:1px solid var(--line);margin-bottom:14px;z-index:1}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid var(--line)}
h2{margin:0 0 6px;font-size:22px;letter-spacing:-.5px}
p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:800 16px "Sora",sans-serif;cursor:pointer;background:var(--accent);color:var(--on-accent);margin-top:14px}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:600}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.st:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:9px 13px;font:600 13px "Sora",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.search{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px "Sora",sans-serif}
.go{border:0;border-radius:14px;padding:0 16px;background:var(--ink);color:var(--bg);font:700 14px "Sora",sans-serif;cursor:pointer}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px;margin-top:8px;font:600 13px "Sora",sans-serif;cursor:pointer}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;margin-top:10px;font:600 15px "Sora",sans-serif;cursor:pointer}
.opt small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px}
.opt b{font-size:18px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--bg)}
.lbl{font-size:13px;font-weight:600;color:var(--mute);margin:18px 0 0}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok);width:0}
.tag{display:inline-block;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;background:var(--line);color:var(--ink)}
.plate{font-weight:800;letter-spacing:2px;border:2px solid var(--ink);border-radius:8px;padding:3px 10px;font-size:14px}
.st{border:0;background:none;font-size:34px;color:var(--line);cursor:pointer;padding:2px}.st.on{color:var(--accent)}
.fare{font-size:40px;font-weight:800;letter-spacing:-1.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:90%;z-index:2000}
.fl{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;color:var(--mute);line-height:1.4}
</style>
</head>
<body>
<div class="app">
<header><div class="logo"><i>U</i>der<small>Rosario de la Frontera</small></div></header>
<div id="map" role="application" aria-label="Mapa de Rosario de la Frontera"></div>
<main id="v"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var CEN={lat:-25.800,lng:-64.967},BB={w:-65.10,e:-64.88,n:-25.72,s:-25.88};
var S={o:null,on:"",d:null,dn:"",mode:"d",ty:1,pg:"Efectivo",p:0,dr:null,km:0,res:[],msg:"Tocá “Usar mi ubicación”, buscá una calle o tocá el mapa.",ph:"home",oref:"",dref:""},tm=null,leg=0;
var TY=[["Remis","Cómodo y con precio cerrado",1.0],["Taxi","Con taxímetro habilitado",1.1],["Uder X","Auto particular, el más económico",.85]];
var PG=["Efectivo","Mercado Pago"];
var DR=[["Carlos B.","Toyota Etios gris","AB 123 CD"],["Marta L.","Chevrolet Onix blanco","AE 456 FG"],["Julián S.","Renault Logan negro","AF 789 HI"]];
function $(x){return document.getElementById(x)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function lab(n,r){return esc(n)+(r?" · "+esc(r):"")}
function setRef(v){if(S.mode==="o")S.oref=v;else S.dref=v}
var U=null;try{U=JSON.parse(localStorage.getItem("uder_user")||"null")}catch(e){}
function save(){try{localStorage.setItem("uder_user",JSON.stringify(U))}catch(e){}}
function logout(){U=null;try{localStorage.removeItem("uder_user")}catch(e){}toast("Tus datos se borraron de este dispositivo");go("welcome")}
function err(m){$("err").textContent=m}
function age(s){var d=new Date(s),t=new Date(),a=t.getFullYear()-d.getFullYear(),m=t.getMonth()-d.getMonth();if(m<0||(m===0&&t.getDate()<d.getDate()))a--;return a}
function luhn(n){var s=0,d=false;for(var i=n.length-1;i>=0;i--){var x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function brand(n){if(/^4/.test(n))return"Visa";if(/^(5[1-5]|2[2-7])/.test(n))return"Mastercard";if(/^3[47]/.test(n))return"Amex";return"Tarjeta"}
function saveReg(){var n=$("f_n").value.trim(),a=$("f_a").value.trim(),d=$("f_d").value,i=$("f_i").value.replace(/\D/g,""),re=/^[A-Za-z\u00C0-\u00FF'. -]{2,}$/;
if(!re.test(n))return err("Escribí tu nombre completo.");if(!re.test(a))return err("Escribí tu apellido.");
if(!d||isNaN(new Date(d))||new Date(d).getFullYear()<1900)return err("Elegí tu fecha de nacimiento.");
if(age(d)<18)return err("Tenés que ser mayor de 18 años para pedir viajes.");
if(i.length<7||i.length>8)return err("El DNI debe tener 7 u 8 números.");
if(!$("f_k").checked)return err("Tenés que aceptar los términos para continuar.");
U={nombre:n,apellido:a,nac:d,dni:i,card:null};save();toast("Cuenta creada. ¡Bienvenido/a, "+n+"!");go("home")}
function saveCard(){var n=$("c_n").value.replace(/\D/g,""),e=$("c_e").value,c=$("c_c").value.replace(/\D/g,""),t=$("c_t").value.trim(),m=/^(\d{2})\/(\d{2})$/.exec(e);
if(n.length<13||n.length>19||!luhn(n))return err("El número de tarjeta no es válido.");
if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],1)<=new Date())return err("Revisá el vencimiento (MM/AA) o la tarjeta está vencida.");
if(c.length<3||c.length>4)return err("El código de seguridad debe tener 3 o 4 números.");
if(t.length<3)return err("Escribí el nombre que figura en la tarjeta.");
U.card={brand:brand(n),last4:n.slice(-4)};save();toast("Tarjeta guardada: "+U.card.brand+" ··"+U.card.last4);var b=S.back||"home";S.back="";go(b)}
function ask(){if(S.pg==="Tarjeta"&&!(U&&U.card)){S.back="opt";toast("Agregá una tarjeta para pagar con tarjeta");go("card");return}if(S.pg==="Mercado Pago"){pagarMP();return}go("search")}
function pagarMP(){toast("Abriendo Mercado Pago…");
fetch("/.netlify/functions/crear-pago",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({monto:Math.round(price(S.ty)),descripcion:"Viaje Uder: "+S.on+" a "+S.dn,nombre:U.nombre,apellido:U.apellido,dni:U.dni})}).then(function(r){return r.json()}).then(function(j){if(!j.url)throw 0;
try{sessionStorage.setItem("uder_trip",JSON.stringify({o:S.o,on:S.on,oref:S.oref,d:S.d,dn:S.dn,dref:S.dref,km:S.km,ty:S.ty,pg:S.pg,ref:j.ref}))}catch(e){}
location.href=j.url}).catch(function(){toast("No se pudo conectar con Mercado Pago. Probá de nuevo.")})}
function volverMP(){var q=new URLSearchParams(location.search),r=q.get("pago");if(!r)return false;var id=q.get("payment_id")||q.get("collection_id"),t=null;
try{t=JSON.parse(sessionStorage.getItem("uder_trip")||"null")}catch(e){}
history.replaceState(null,"",location.pathname);
if(!t){go("home");toast("No encontramos tu viaje. Volvé a pedirlo.");return true}
Object.assign(S,t);S.res=[];draw();
if(r==="ok"&&id){S.ph="verif";$("v").innerHTML='<div class="card"><h2>Verificando tu pago…</h2><p>Estamos confirmando con Mercado Pago.</p><div class="bar"><i style="width:60%"></i></div></div>';
fetch("/.netlify/functions/verificar-pago?payment_id="+encodeURIComponent(id)+"&ref="+encodeURIComponent(t.ref||"")).then(function(x){return x.json()}).then(function(j){if(j.aprobado){try{sessionStorage.removeItem("uder_trip")}catch(e){}toast("Pago aprobado ✓");go("search")}else{toast("No pudimos confirmar el pago. Probá de nuevo.");go("opt")}}).catch(function(){toast("No pudimos verificar el pago. Probá de nuevo.");go("opt")});return true}
toast(r==="pendiente"?"Tu pago está pendiente de acreditación.":"El pago no se completó. Podés intentar de nuevo o elegir otro medio de pago.");go("opt");return true}
function M(n){return "$"+Math.round(n).toLocaleString("es-AR")}
function hav(p,q){var r=Math.PI/180,u=(q.lat-p.lat)*r,w=(q.lng-p.lng)*r,a=Math.pow(Math.sin(u/2),2)+Math.cos(p.lat*r)*Math.cos(q.lat*r)*Math.pow(Math.sin(w/2),2);return 12742*Math.asin(Math.sqrt(a))}
function price(i){return (1500+S.km*620)*TY[i][2]}
function toast(m){var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function api(u){return fetch(u,{headers:{"Accept":"application/json"}}).then(function(r){return r.json()})}
var map=L.map("map",{zoomControl:true}).setView([CEN.lat,CEN.lng],14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© Colaboradores de OpenStreetMap"}).addTo(map);
var G=L.layerGroup().addTo(map),car=null;
function pin(p,c,m,t){var k=L.marker([p.lat,p.lng],{draggable:true,icon:L.divIcon({className:"",html:'<div style="width:22px;height:22px;border-radius:50%;background:'+c+';border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(G).bindTooltip(t);k.on("dragend",function(){var q=k.getLatLng();if(S.ph==="home")setPt(m,{lat:q.lat,lng:q.lng},null,true)})}
function draw(keep){G.clearLayers();var b=[];
if(S.o){pin(S.o,"#14213D","o","Desde: "+S.on);b.push([S.o.lat,S.o.lng])}
if(S.d){pin(S.d,"#D64545","d","Hasta: "+S.dn);b.push([S.d.lat,S.d.lng])}
if(S.o&&S.d)L.polyline([[S.o.lat,S.o.lng],[S.d.lat,S.d.lng]],{color:"#14213D",weight:3,dashArray:"6 8"}).addTo(G);
if(keep)return;if(b.length===2)map.fitBounds(b,{padding:[40,40]});else if(b.length===1)map.setView(b[0],16)}
function name(j){var a=j.address||{},r=a.road||a.pedestrian||a.footway||a.path||"";if(r)return r+(a.house_number?" "+a.house_number:"");return (j.display_name||"").split(",")[0]||"Punto en el mapa"}
function setPt(m,p,n,keep){if(m==="o"){S.o=p;S.on=n||"Buscando dirección…"}else{S.d=p;S.dn=n||"Buscando dirección…"}S.res=[];draw(keep);go("home");
if(!n)api("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=es&lat="+p.lat+"&lon="+p.lng).then(function(j){var nm=name(j);if(m==="o"&&S.o===p)S.on=nm;if(m==="d"&&S.d===p)S.dn=nm;if(S.ph==="home")go("home")}).catch(function(){if(m==="o")S.on="Punto en el mapa";else S.dn="Punto en el mapa";if(S.ph==="home")go("home")})}
map.on("click",function(e){if(S.ph!=="home")return;if(S.mode==="o")S.oref="";else S.dref="";setPt(S.mode,{lat:e.latlng.lat,lng:e.latlng.lng})});
function mode(m){S.mode=m;go("home")}
function loc(){if(!navigator.geolocation){S.msg="Tu navegador no permite ubicación. Buscá una calle o tocá el mapa.";go("home");return}
S.msg="Buscando tu ubicación…";go("home");
navigator.geolocation.getCurrentPosition(function(g){var p={lat:g.coords.latitude,lng:g.coords.longitude};
if(p.lng>BB.w&&p.lng<BB.e&&p.lat>BB.s&&p.lat<BB.n){S.msg="Ubicación detectada (±"+Math.round(g.coords.accuracy)+" m).";S.oref="";setPt("o",p)}
else{S.msg="Estás fuera de Rosario de la Frontera: usamos el centro como punto de partida de prueba.";setPt("o",{lat:CEN.lat,lng:CEN.lng},"Centro (punto de prueba)")}},
function(){S.msg="No pudimos obtener tu ubicación. Revisá el permiso del navegador, buscá una calle o tocá el mapa.";go("home")},{enableHighAccuracy:true,timeout:9000})}
function tc(t){return t.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase()})}
function find(){var q=$("q").value.trim();if(!q){toast("Escribí una calle o lugar");return}
var m=q.match(/^(.*?)[\s,]+(\d{1,5})$/),st=m?m[1]:q,num=m?m[2]:"";
function srch(t){return api("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&accept-language=es&bounded=1&viewbox="+BB.w+","+BB.n+","+BB.e+","+BB.s+"&q="+encodeURIComponent(t))}
function geo(){return api("https://apis.datos.gob.ar/georef/api/v2.0/direcciones?max=3&provincia=salta&departamento="+encodeURIComponent("rosario de la frontera")+"&direccion="+encodeURIComponent(q)).then(function(j){return (j.direcciones||[]).filter(function(d){return d.ubicacion&&d.ubicacion.lat!=null&&d.ubicacion.lon!=null}).map(function(d){return{p:{lat:+d.ubicacion.lat,lng:+d.ubicacion.lon},n:tc((d.nomenclatura||"").split(",")[0]),num:""}})}).catch(function(){return []})}
(num?geo():Promise.resolve([])).then(function(g){if(g.length){S.msg="Altura ubicada con datos oficiales. Es aproximada: movés el pin si hace falta.";return g}
return srch(q).then(function(r){return r.length||!num?r:srch(st)}).then(function(r){S.msg=r.length?"Elegí un resultado:":"Sin resultados. Probá con otra calle o tocá el mapa.";return r.map(function(x){return{p:{lat:+x.lat,lng:+x.lon},n:x.display_name.split(",").slice(0,2).join(","),num:num}})})}).then(function(rs){S.res=rs;go("home");$("q").value=q}).catch(function(){S.msg="No se pudo buscar. Revisá tu conexión a internet.";go("home")})}
function pickRes(i){var r=S.res[i],ref=r.num&&r.n.indexOf(r.num)<0?"altura "+r.num:"";if(S.mode==="o")S.oref=ref;else S.dref=ref;setPt(S.mode,r.p,r.n);if(ref)toast("El mapa no tiene esa numeración exacta: marcamos la calle. Movés el pin a la altura correcta.")}
function opts(){if(!S.o||!S.d){toast("Marcá tu punto de partida y tu destino");return}if(hav(S.o,S.d)<.1){toast("El destino está muy cerca del punto de partida");return}S.km=Math.max(.5,hav(S.o,S.d)*1.3);go("opt")}
function setCar(p){if(!car)car=L.circleMarker([p.lat,p.lng],{radius:11,color:"#14213D",weight:3,fillColor:"#F5B700",fillOpacity:1}).addTo(map);car.setLatLng([p.lat,p.lng])}
function run(a,b,mins,next){leg=mins;S.p=0;step(a,b);tm=setInterval(function(){S.p+=1/40;if(S.p>=1){S.p=1;step(a,b);clearInterval(tm);next();return}step(a,b)},200)}
function step(a,b){setCar({lat:a.lat+(b.lat-a.lat)*S.p,lng:a.lng+(b.lng-a.lng)*S.p});var pb=$("pb"),e=$("eta");if(pb)pb.style.width=(S.p*100)+"%";if(e)e.textContent=S.p>=1?"Llegó":"Llega en "+Math.max(1,Math.ceil(leg*(1-S.p)))+" min"}
function rmCar(){if(car){map.removeLayer(car);car=null}}
function go0(ph){if(ph==="home"&&!U){go("welcome");return}clearInterval(tm);clearTimeout(tm);S.ph=ph;var v=$("v");var showMap=!(ph==="welcome"||ph==="reg"||ph==="card");$("map").style.display=showMap?"block":"none";if(showMap)map.invalidateSize();if(ph==="home"||ph==="opt")rmCar();
