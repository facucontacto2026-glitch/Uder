<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uder · Administrador</title>
<link rel="manifest" href="/manifest-admin.json">
<link rel="apple-touch-icon" href="/icon-admin.svg">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --bg:#FFFFFF;--surface:#F6F6F6;--card:#FFFFFF;--ink:#000000;--ink-secondary:#5E5E5E;--line:#EEEEEE;--accent:#F5B700;--ok:#0E8345;--bad:#DE1135;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F9F9F9;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.app{max-width:480px;width:100%;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:#fff}

header{position:sticky;top:0;z-index:1000;background:#000;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px;letter-spacing:-1px}
.logo span{background:#F5B700;color:#000;padding:2px 8px;border-radius:6px;margin-right:6px}

.main-view{flex:1;padding:16px 20px 40px;background:#fff}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,0.04)}

.btn{width:100%;height:50px;border:0;border-radius:12px;font:700 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.btn.accent{background:var(--accent);color:#000}
.btn.ghost{background:transparent;color:var(--ink-secondary);border:1px solid #ddd}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid #ddd;background:var(--surface);color:#000;border-radius:20px;padding:8px 14px;font:700 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:#000;color:#fff;border-color:#000}

.field-input{width:100%;padding:14px;border-radius:10px;border:1px solid #D5DBE5;background:#F9F9F9;font:600 15px 'Plus Jakarta Sans',sans-serif;margin-top:6px;margin-bottom:14px;outline:none}
.field-input:focus{border-color:#000;background:#fff}

.tag{display:inline-block;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;background:var(--surface);color:#000}
.fare{font-size:32px;font-weight:900}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;font-weight:600;box-shadow:0 4px 15px rgba(0,0,0,0.2);z-index:5000;max-width:85%;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span>U</span>der<small style="color:var(--accent);margin-left:6px;font-weight:700">ADMIN</small></div>
    <!-- BOTÓN SIEMPRE VISIBLE -->
    <button id="btn_instalar_admin" class="chip" style="background:var(--accent);color:#000;border:0;font-weight:800;display:inline-flex" onclick="instalarAdminApp()">📲 Instalar App</button>
  </header>
  <main id="v" class="main-view">
    <div style="padding:40px 0;text-align:center"><p style="color:var(--ink-secondary)">Iniciando panel de control…</p></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var sb = supabase.createClient("https://mmgvttmgchnbppcemrwg.supabase.co", "sb_publishable_HtTCeT611_CKOvtxebUxTw_FQpL_seZ");

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}

var deferredAdminPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredAdminPrompt = e;
});

function instalarAdminApp(){
  if(deferredAdminPrompt){
    deferredAdminPrompt.prompt();
    deferredAdminPrompt = null;
  } else {
    alert("Para instalar en tu celular:\n\n1. Tocá los 3 puntitos (⋮) arriba a la derecha en Chrome.\n2. Elegí 'Instalar aplicación' o 'Agregar a la pantalla principal'.");
  }
}

var L_LIST = [], tab = "pendiente", SD = [];
function $(x){return document.getElementById(x)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function M(n){return "ARS " + Math.round(n).toLocaleString("es-AR")}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function view(h){$("v").innerHTML = h}

function login(m){
  view(
    '<div class="card">' +
      '<h2 style="font-size:22px;font-weight:800;margin:0 0 8px">Panel Administrador Uder</h2>' +
      '<p style="color:var(--ink-secondary);font-size:14px;margin:0 0 16px">Acceso exclusivo de administración y comisiones.</p>' +
      '<label style="font-size:12px;font-weight:700">EMAIL</label><input id="e" type="email" class="field-input">' +
      '<label style="font-size:12px;font-weight:700">CONTRASEÑA</label><input id="w" type="password" class="field-input">' +
      (m ? '<p style="color:var(--bad);font-size:13px;margin:0 0 10px">'+esc(m)+'</p>' : '') +
      '<button class="btn accent" onclick="doLogin()">Ingresar</button>' +
    '</div>'
  );
}

function doLogin(){
  var e = $("e").value.trim(), w = $("w").value;
  if(!e || !w) return toast("Completá email y contraseña");
  sb.auth.signInWithPassword({ email: e, password: w }).then(function(r){
    if(r.error) return login("Credenciales incorrectas");
    check();
  });
}

function check(){
  sb.rpc("es_admin").then(function(r){
    if(r.data !== true){
      sb.auth.signOut();
      login("Esta cuenta no tiene permisos de administrador.");
      return;
    }
    load();
  });
}

function load(){
  Promise.all([sb.rpc("admin_lista_conductores"), sb.rpc("admin_saldos")]).then(function(r){
    if(r[0].error) return login(r[0].error.message);
    L_LIST = r[0].data || [];
    SD = r[1].data || [];
    draw();
  }).catch(function(e){ login(e.message); });
}

function setTab(t){ tab = t; draw(); }
function cnt(t){ return L_LIST.filter(function(x){ return x.estado_revision === t; }).length; }

function draw(){
  var h = 
    '<div class="chips">' +
      '<button class="chip" aria-pressed="'+(tab==="pendiente")+'" onclick="setTab(\'pendiente\')">Pendientes ('+cnt("pendiente")+')</button>' +
      '<button class="chip" aria-pressed="'+(tab==="aprobado")+'" onclick="setTab(\'aprobado\')">Aprobados ('+cnt("aprobado")+')</button>' +
      '<button class="chip" aria-pressed="'+(tab==="rechazado")+'" onclick="setTab(\'rechazado\')">Rechazados ('+cnt("rechazado")+')</button>' +
      '<button class="chip" aria-pressed="'+(tab==="saldos")+'" onclick="setTab(\'saldos\')">Saldos y Comisiones</button>' +
    '</div>';

  if(tab === "saldos"){
    h += saldosView();
  } else {
    var rows = L_LIST.filter(function(x){ return x.estado_revision === tab; });
    h += rows.length ? rows.map(cardConductor).join("") : '<div class="card"><p style="color:var(--ink-secondary)">No hay choferes en esta categoría.</p></div>';
  }

  h += '<button class="btn ghost" onclick="load()">🔄 Actualizar datos</button>';
  h += '<button class="btn ghost" style="color:var(--bad);border-color:#FFCDD2" onclick="sb.auth.signOut();login()">Cerrar sesión</button>';
  view(h);
}

function cardConductor(x){
  var docs = [["Licencia", x.doc_licencia], ["Seguro", x.doc_seguro], ["Cédula", x.doc_vehiculo], ["VTV", x.doc_vtv]];
  var verificadoIA = (x.estado_revision === "aprobado");

  return '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
      '<div>' +
        '<b style="font-size:17px">'+esc(x.nombre)+' '+esc(x.apellido)+'</b>' +
        '<p style="margin:2px 0 0;font-size:13px;color:var(--ink-secondary)">'+esc(x.vehiculo)+' · <b>'+esc(x.patente)+'</b></p>' +
      '</div>' +
      (verificadoIA ? '<span class="tag" style="background:#E8F5E9;color:#1B5E20">🤖 Aprobado</span>' : '<span class="tag">'+esc(x.tipo)+'</span>') +
    '</div>' +
    '<p style="font-size:12px;color:var(--ink-secondary);margin:8px 0">'+esc(x.email)+' · DNI '+esc(x.dni)+'</p>' +
    (x.motivo_rechazo ? '<p style="color:var(--bad);font-size:12px;margin:4px 0"><b>Motivo:</b> '+esc(x.motivo_rechazo)+'</p>' : '') +
    '<div class="chips" style="margin:10px 0 6px">' +
      docs.map(function(d){
        return d[1] ? '<button class="chip" onclick="verDoc(\''+esc(d[1])+'\')">👁️ '+d[0]+'</button>' : '<span class="tag">Falta '+d[0]+'</span>';
      }).join("") +
    '</div>' +
    (tab !== "aprobado" ? '<button class="btn accent" onclick="revisar(\''+x.id+'\', true)">Aprobar chofer</button>' : '') +
    (tab !== "rechazado" ? '<button class="btn ghost" style="margin-top:6px" onclick="revisar(\''+x.id+'\', false)">'+(tab==="aprobado"?"Suspender chofer":"Rechazar")+'</button>' : '') +
  '</div>';
}

function verDoc(p){
  var w = window.open("", "_blank");
  sb.storage.from("documentos").createSignedUrl(p, 120).then(function(r){
    if(r.data && r.data.signedUrl) w.location = r.data.signedUrl;
    else { w.close(); toast("No se pudo cargar el documento."); }
  });
}

function revisar(id, ap){
  var m = ap ? null : prompt("Motivo (lo verá el conductor):");
  if(!ap && m === null) return;
  sb.rpc("admin_revisar", { cid: id, aprobar: ap, motivo: m }).then(function(r){
    toast(ap ? "Chofer aprobado" : "Chofer suspendido");
    load();
  });
}

function saldosView(){
  var totViajes = 0, totFacturado = 0, totComision = 0;
  SD.forEach(function(s){
    totViajes += Number(s.viajes || 0);
    totFacturado += Number(s.facturado || 0);
    totComision += Number(s.comision_total || 0);
  });

  var h = 
    '<div class="card">' +
      '<h3 style="margin:0 0 10px;font-size:18px;font-weight:800">Resumen de Comisiones</h3>' +
      '<div style="display:flex;justify-content:space-between;text-align:center">' +
        '<div><b style="font-size:18px">'+totViajes+'</b><small style="display:block;color:var(--ink-secondary)">Viajes</small></div>' +
        '<div><b style="font-size:18px">'+M(totFacturado)+'</b><small style="display:block;color:var(--ink-secondary)">Facturado</small></div>' +
        '<div><b style="font-size:18px;color:var(--ok)">'+M(totComision)+'</b><small style="display:block;color:var(--ink-secondary)">Tu Ganancia</small></div>' +
      '</div>' +
    '</div>';

  var rows = SD.filter(function(s){ return Number(s.viajes) > 0 || Number(s.pendiente) !== 0; });
  h += rows.length ? rows.map(function(s){
    var p = Number(s.pendiente);
    var balanceTxt = p > 0 ? '<span style="color:var(--ok)">Tenés que pagarle '+M(p)+'</span>' : p < 0 ? '<span style="color:var(--bad)">Te debe '+M(-p)+'</span>' : 'Al día';
    return '<div class="card">' +
      '<b>'+esc(s.nombre)+'</b> · <span class="tag">'+s.viajes+' viajes</span>' +
      '<p style="font-size:13px;color:var(--ink-secondary);margin:6px 0 10px">' +
        'Mercado Pago (a favor de chofer): '+M(s.a_favor_mp)+'<br>' +
        'Efectivo (te debe comisión): '+M(s.comision_efectivo) +
      '</p>' +
      '<div style="font-size:18px;font-weight:800">'+balanceTxt+'</div>' +
    '</div>';
  }).join("") : '<div class="card"><p style="color:var(--ink-secondary)">No hay saldos pendientes.</p></div>';

  return h;
}

sb.auth.getSession().then(function(r){
  if(!r.data || !r.data.session) login();
  else check();
});
</script>
</body>
</html>
