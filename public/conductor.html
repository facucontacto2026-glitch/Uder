var audioCtx = null;
function initAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}

function sonarAlerta(){
  try{
    initAudio();
    if(!audioCtx) return;
    var now = audioCtx.currentTime;

    // Tono 1 (880 Hz)
    var osc1 = audioCtx.createOscillator(), gain1 = audioCtx.createGain();
    osc1.type = "sine";
    osc1.frequency.setValueAtTime(880, now);
    gain1.gain.setValueAtTime(0.8, now);
    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc1.connect(gain1); gain1.connect(audioCtx.destination);
    osc1.start(now); osc1.stop(now + 0.3);

    // Tono 2 (1174 Hz)
    var osc2 = audioCtx.createOscillator(), gain2 = audioCtx.createGain();
    osc2.type = "sine";
    osc2.frequency.setValueAtTime(1174, now + 0.2);
    gain2.gain.setValueAtTime(0.9, now + 0.2);
    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.start(now + 0.2); osc2.stop(now + 0.55);

    // Tono 3 Agudo fuerte (1760 Hz)
    var osc3 = audioCtx.createOscillator(), gain3 = audioCtx.createGain();
    osc3.type = "triangle";
    osc3.frequency.setValueAtTime(1760, now + 0.45);
    gain3.gain.setValueAtTime(1.0, now + 0.45);
    gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
    osc3.connect(gain3); gain3.connect(audioCtx.destination);
    osc3.start(now + 0.45); osc3.stop(now + 0.9);

    // Vibración del celular (tres golpes fuertes)
    if(navigator.vibrate){
      navigator.vibrate([400, 200, 400, 200, 600]);
    }
  }catch(e){
    console.error("Error al reproducir alerta:", e);
  }
}

  Promise.all(fs.map(function(f,i){
    var ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5),p=D.u.id+"/"+["licencia","seguro","vehiculo","vtv"][i]+"-"+t+"."+ext;
    return sb.storage.from("documentos").upload(p,f,{contentType:f.type}).then(function(r){if(r.error)throw r.error;return p});
  })).then(function(p){
    return sb.rpc("enviar_documentos",{l:p[0],s:p[1],v:p[2],t:p[3]});
  }).then(function(r){
    if(r.error)throw r.error;toast("Documentos enviados con éxito");D.sig="";refresh();
  }).catch(function(e){err("No se pudieron subir: "+(e.message||"error"))});
}

function verGan(){
  D.view="gan";$("map").style.display="none";$("v").innerHTML='<div class="card"><h2>Mis ganancias</h2><p>Cargando…</p></div>';
  sb.from("viajes").select("id,creado_en,origen_nombre,destino_nombre,forma_pago,ganancia_conductor").eq("conductor_id",D.u.id).eq("estado","finalizado").order("creado_en",{ascending:false}).limit(500).then(function(r){
    var L=r.data||[],now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dw=new Date(d0);dw.setDate(d0.getDate()-((d0.getDay()+6)%7));
    var sum=function(a){return a.reduce(function(s,x){return s+(x.ganancia_conductor||0)},0)},hoy=L.filter(function(x){return new Date(x.creado_en)>=d0}),sem=L.filter(function(x){return new Date(x.creado_en)>=dw});
    function box(t,a){return '<div style="flex:1"><b style="font-size:20px;display:block">'+M(sum(a))+'</b><span style="font-size:12px;color:var(--mute)">'+t+' · '+a.length+(a.length===1?" viaje":" viajes")+'</span></div>'}
    var h='<div class="card"><h2>Mis ganancias</h2><div class="row" style="align-items:flex-start;margin-top:10px">'+box("Hoy",hoy)+box("Semana",sem)+box("Total",L)+'</div></div>';
    h+=L.length?'<div class="card"><h2>Últimos viajes</h2>'+L.slice(0,15).map(function(x){var f=new Date(x.creado_en);return '<div class="row" style="padding:10px 0;border-top:1px solid var(--line)"><div style="min-width:0"><div style="font-size:14px">'+esc(x.origen_nombre)+' → '+esc(x.destino_nombre)+'</div><small style="color:var(--mute)">'+f.toLocaleDateString("es-AR")+' '+f.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})+' · '+esc(x.forma_pago)+'</small></div><b>'+M(x.ganancia_conductor||0)+'</b></div>'}).join("")+'</div>':'<div class="card"><p>Todavía no hiciste viajes.</p></div>';
    $("v").innerHTML=h+'<button class="btn ghost" onclick="D.view=\'\';D.sig=\'\';refresh()">Volver</button>';
  });
}

function setOn(b){
  initAudio(); // Desbloquea el audio en el navegador
  sb.from("conductores").update({conectado:b}).eq("id",D.u.id).then(function(r){
    if(r.error)return toast("No se pudo cambiar el estado.");
    D.on=b;b?track():untrack();D.sig="";refresh();
    if(b) toast("Conectado. Te avisaremos con sonido cuando entre un viaje.");
  });
}

function track(){
  if(wid!==null||!navigator.geolocation)return;
  wid=navigator.geolocation.watchPosition(function(p){
    D.pos=[p.coords.latitude,p.coords.longitude];
    if(me)me.setLatLng(D.pos);
    if(Date.now()-last<8000)return;
    last=Date.now();
    sb.from("conductores").update({lat:p.coords.latitude,lng:p.coords.longitude,actualizado_en:new Date().toISOString()}).eq("id",D.u.id).then(function(){});
  },function(){toast("Activá el GPS para que te vean los pasajeros.")},{enableHighAccuracy:true});
}

function untrack(){
  if(wid!==null){navigator.geolocation.clearWatch(wid);wid=null}
  if(D.u&&D.on)sb.from("conductores").update({conectado:false}).eq("id",D.u.id).then(function(){});
}

function aceptar(id){
  initAudio();
  sb.from("viajes").update({conductor_id:D.u.id,conductor_nombre:D.p.nombre+" "+D.p.apellido.charAt(0)+".",vehiculo:D.c.vehiculo,patente:D.c.patente,estado:"aceptado"}).eq("id",id).eq("estado","buscando").select().then(function(r){
    if(r.error||!r.data||!r.data.length)toast("Otro conductor ya tomó este viaje.");
    else toast("¡Viaje aceptado! Buen viaje.");
    D.sig="";refresh();
  });
}

function avanzar(id,est){
  sb.from("viajes").update({estado:est}).eq("id",id).then(function(r){
    if(r.error)toast("No se pudo actualizar el viaje.");
    else if(est==="finalizado")toast("Viaje finalizado. ¡Buen trabajo!");
    D.sig="";refresh();
  });
}

sb.auth.getSession().then(function(r){
  if(!r.data.session)return login();
  D.u=r.data.session.user;load();
});
</script></body></html>
