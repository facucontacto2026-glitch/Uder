<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#fff;--surface:#F6F6F6;--ink:#000;--mute:#5E5E5E;--line:#EEE;--accent:#F5B700;--ok:#0E8345;--bad:#DE1135}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fff;position:relative}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 8px}
.top-loc{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer}
.top-loc i{width:8px;height:8px;border-radius:50%;background:#276EF1;display:inline-block}
.brand{font-size:24px;font-weight:800}
.brand span{color:var(--accent);background:#000;padding:1px 6px;border-radius:6px;margin-right:3px}
#map{width:100%;height:280px;background:#E5E3DF}
.main-view{flex:1;padding:16px 20px 85px}

.search-pill{display:flex;align-items:center;background:var(--surface);border-radius:30px;padding:12px 18px;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,0.05);margin-bottom:14px}
.search-pill input{border:0;background:transparent;font:700 15px 'Plus Jakarta Sans',sans-serif;color:#000;width:100%;outline:none}
.search-btn{border:0;background:#000;color:#fff;padding:8px 16px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip-u{border:0;background:var(--surface);color:#000;font:700 13px 'Plus Jakarta Sans',sans-serif;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
.chip-u[aria-pressed="true"]{background:#000;color:#fff}

.ride-card{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;border:2px solid transparent;background:#fff;margin-bottom:8px;cursor:pointer}
.ride-card.selected{border-color:#000;box-shadow:0 3px 12px rgba(0,0,0,0.08)}
.ride-left{display:flex;align-items:center;gap:14px}
.ride-icon{width:56px;height:40px;background:var(--surface);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.ride-info h4{margin:0;font-size:16px;font-weight:700}
.ride-info p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.ride-price b{font-size:17px;font-weight:800}

.payment-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-radius:12px;margin:12px 0;cursor:pointer;font-weight:700;font-size:14px}
.bottom-sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:4000;display:flex;flex-direction:column;justify-content:flex-end}
.bottom-sheet-content{background:#fff;border-radius:24px 24px 0 0;padding:14px 20px 32px;max-height:80vh;overflow-y:auto}
.sheet-drag{width:40px;height:4px;background:#DDD;border-radius:2px;margin:0 auto 16px}
.pay-opt{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer}
.pay-opt.selected{border-color:#000;background:#FAFAFA}
.pay-left{display:flex;align-items:center;gap:12px}
.pay-icon{width:42px;height:42px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px}
.card-badges{display:inline-flex;gap:4px;margin-left:6px}
.badge-v{background:#1A1F71;color:#fff;font-size:8px;font-weight:900;padding:1px 4px;border-radius:2px}
.badge-a{background:#006FCF;color:#fff;font-size:8px;font-weight:900;padding:1px 4px;border-radius:2px}

.btn-uber{width:100%;height:52px;background:#000;color:#fff;border:0;border-radius:12px;font:700 16px 'Plus Jakarta Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-ghost-u{width:100%;height:44px;background:transparent;color:var(--mute);border:0;font:700 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer;margin-top:6px}
.field-input{width:100%;padding:13px;border-radius:10px;border:1px solid #D5DBE5;background:#F9F9F9;font:600 15px 'Plus Jakarta Sans',sans-serif;margin:4px 0 12px;outline:none}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;height:62px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:2000}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mute);background:none;border:0;cursor:pointer}
.nav-i.active{color:#000}
.nav-i svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:5000}
.badge-s{display:inline-flex;align-items:center;gap:6px;background:#E8F5E9;color:#1B5E20;padding:5px 10px;border-radius:8px;font-weight:700;font-size:12px}
.res-i{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar" id="top_bar">
    <div class="top-loc" onclick="loc()"><i></i> Rosario de la Frontera ⌵</div>
    <div class="brand"><span>U</span>der</div>
  </div>

  <div id="map"></div>
  <main id="v" class="main-view"></main>

  <!-- MODAL DE PAGO DESLIZABLE -->
  <div id="sheet_pago" class="bottom-sheet-overlay" style="display:none" onclick="cerrarModalPago(event)">
    <div class="bottom-sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-drag"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3 style="margin:0;font-size:18px;font-weight:800">Método de pago</h3>
        <button onclick="cerrarModalPago()" style="border:0;background:none;font-size:24px;cursor:pointer;color:var(--mute)">&times;</button>
      </div>

      <div class="pay-opt" id="opt_efectivo" onclick="seleccionarMetodo('Efectivo')">
        <div class="pay-left"><div class="pay-icon">💵</div><div><b>Efectivo</b><p style="margin:2px 0 0;font-size:12px;color:var(--mute)">Pagás en mano al chofer</p></div></div>
        <div id="check_efectivo" style="color:var(--ok);font-weight:800">✓</div>
      </div>

      <div class="pay-opt" id="opt_tarjeta" onclick="seleccionarTarjetaOAgregar()">
        <div class="pay-left"><div class="pay-icon">💳</div><div id="txt_tarjeta_box"><b>Tarjetas <span class="card-badges"><span class="badge-v">VISA</span><span class="badge-a">AMEX</span></span></b><p style="margin:2px 0 0;font-size:12px;color:var(--mute)">Débito directo sin salir de la app</p></div></div>
        <div id="check_tarjeta" style="color:var(--ok);font-weight:800;display:none">✓</div>
      </div>

      <div class="pay-opt" id="opt_mp" onclick="seleccionarMetodo('Mercado Pago')">
        <div class="pay-left"><div class="pay-icon">🔵</div><div><b>Mercado Pago</b><p style="margin:2px 0 0;font-size:12px;color:var(--mute)">Checkout con dinero en cuenta</p></div></div>
        <div id="check_mp" style="color:var(--ok);font-weight:800;display:none">✓</div>
      </div>
    </div>
  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav" id="bottom_nav" style="display:none">
    <button id="nav_inicio" class="nav-i active" onclick="cambiarSeccion('home')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Inicio
    </button>
    <button id="nav_actividad" class="nav-i" onclick="cambiarSeccion('actividad')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>Actividad
    </button>
    <button id="nav_cuenta" class="nav-i" onclick="cambiarSeccion('cuenta')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Cuenta
    </button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://sdk.mercadopago.com/js/v2"></script>
<script>
var sb = supabase.createClient("https://mmgvttmgchnbppcemrwg.supabase.co", "sb_publishable_HtTCeT611_CKOvtxebUxTw_FQpL_seZ");
var mp = null;
try { mp = new MercadoPago("APP_USR-619e8167-a16b-472a-9e9b-71eef85dbb38"); } catch(e){}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }

var CEN={lat:-25.798,lng:-64.968},BB={w:-65.05,e:-64.90,n:-25.74,s:-25.86};
var S={o:null,on:"",d:null,dn:"",mode:"o",ty:0,pg:"Efectivo",p:0,dr:null,km:0,cuadras:0,res:[],msg:"¿A dónde vamos hoy?",ph:"welcome",oref:"",dref:"",viajeId:null,mapFitDone:false},tm=null,pollTm=null;
var TY=[["Remis","Servicio tradicional",1.0,"🚗","4 min"],["Uder","Auto económico",0.95,"🚘","3 min"]];

function $(x){return document.getElementById(x)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function lab(n,r){var nm=esc(n||"Punto"),rf=esc(r||"").trim();if(!rf)return nm;var num=rf.replace(/altura\s*/gi,"").trim();if(nm.indexOf(num)>=0)return nm;return nm+" · "+rf}
function setRef(v){if(S.mode==="o")S.oref=v;else S.dref=v}

var U=null;try{U=JSON.parse(localStorage.getItem("uder_user")||"null")}catch(e){}
function save(){try{localStorage.setItem("uder_user",JSON.stringify(U))}catch(e){}}
function luhn(n){var s=0,d=false;for(var i=n.length-1;i>=0;i--){var x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function brand(n){if(/^4/.test(n))return"Visa";if(/^(5[1-5]|2[2-7])/.test(n))return"Mastercard";if(/^3[47]/.test(n))return"Amex";return"Tarjeta"}

async function logout(){
  toast("Cerrando sesión…");
  try{await sb.auth.signOut();}catch(e){}
  U=null;try{localStorage.removeItem("uder_user");sessionStorage.clear();}catch(e){}
  toast("Sesión cerrada");
  go("welcome");
}

function sincronizarUsuario(usr){
  var meta=usr.user_metadata||{},partes=(meta.full_name||meta.name||"").split(" ");
  U={id:usr.id,email:usr.email,nombre:meta.first_name||partes[0]||(U&&U.nombre!=="Pasajero"?U.nombre:"Facundo"),apellido:meta.last_name||partes.slice(1).join(" ")||(U?U.apellido:""),dni:meta.dni||(U?U.dni:""),card:U&&U.card?U.card:null};
  save();
  sb.from("perfiles").select("*").eq("id",usr.id).single().then(function(r){if(r.data&&r.data.nombre){U.nombre=r.data.nombre;if(r.data.apellido)U.apellido=r.data.apellido;save();}});
  cambiarSeccion("home");
}

sb.auth.onAuthStateChange(function(e,s){if(s&&s.user)sincronizarUsuario(s.user);});
sb.auth.getSession().then(function(r){if(r.data&&r.data.session&&r.data.session.user)sincronizarUsuario(r.data.session.user);else if(!U||!U.nombre)go("welcome");});

function loginGoogle(){
  toast("Conectando con Google…");
  sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}}).catch(function(){toast("Error de conexión con Google");});
}
function doLoginEmail(){
  var e=$("l_e").value.trim(),w=$("l_w").value;if(!e||!w)return toast("Completá email y contraseña");
  toast("Ingresando…");sb.auth.signInWithPassword({email:e,password:w}).then(function(r){if(r.error)return toast("Email o contraseña incorrectos");sincronizarUsuario(r.data.user);});
}
function doRegistroEmail(){
  var e=$("r_e").value.trim(),w=$("r_w").value,n=$("r_n").value.trim(),a=$("r_a").value.trim();
  if(!e||!w||!n)return toast("Completá todos los campos");if(w.length<6)return toast("Contraseña mínima: 6 caracteres");
  toast("Creando cuenta…");sb.auth.signUp({email:e,password:w,options:{data:{full_name:n+" "+a,first_name:n,last_name:a}}}).then(function(r){if(r.error)return toast("Error: "+r.error.message);toast("¡Cuenta creada!");if(r.data.user)sincronizarUsuario(r.data.user);else go("welcome");});
}
function editarNombrePerfil(){
  var n=prompt("Escribí tu nombre:",(U&&U.nombre)?U.nombre:"Facundo");
  if(n&&n.trim()){if(!U)U={};U.nombre=n.trim();save();toast("Nombre guardado");cambiarSeccion("cuenta");}
}

function guardarTarjetaNativa(){
  var num=$("c_n").value.replace(/\D/g,""),exp=$("c_e").value.trim(),cvv=$("c_c").value.replace(/\D/g,""),nom=$("c_t").value.trim(),dni=$("c_dni").value.replace(/\D/g,"");
  if(num.length<13||!luhn(num))return toast("Tarjeta inválida");if(!/^\d{2}\/\d{2}$/.test(exp))return toast("Vencimiento: MM/AA");if(cvv.length<3)return toast("CVV inválido");if(!nom||!dni)return toast("Completá titular y DNI");
  var m=exp.split("/");toast("Validando con el banco…");
  if(!mp)return toast("SDK Mercado Pago no disponible");
  mp.createCardToken({cardNumber:num,cardholderName:nom,cardExpirationMonth:m[0],cardExpirationYear:"20"+m[1],securityCode:cvv,identificationType:"DNI",identificationNumber:dni}).then(function(t){
    if(!t||!t.id)throw 0;if(!U)U={nombre:"Facundo"};
    U.card={brand:brand(num),last4:num.slice(-4),titular:nom,dni:dni,num:num,exp:exp};save();toast("Tarjeta vinculada ✓");S.pg="Tarjeta";
    if(S.ph==="opt")go("opt");else cambiarSeccion("cuenta");
  }).catch(function(){toast("El banco rechazó la tarjeta.");});
}

function eliminarTarjeta(){if(confirm("¿Quitar tarjeta guardada?")){if(U)U.card=null;save();if(S.pg==="Tarjeta")S.pg="Efectivo";toast("Tarjeta eliminada");cambiarSeccion("cuenta");}}

function abrirModalPago(){actualizarUIModalPago();$("sheet_pago").style.display="flex";}
function cerrarModalPago(){$("sheet_pago").style.display="none";}
function actualizarUIModalPago(){
  $("opt_efectivo").classList.remove("selected");$("opt_tarjeta").classList.remove("selected");$("opt_mp").classList.remove("selected");
  $("check_efectivo").style.display="none";$("check_tarjeta").style.display="none";$("check_mp").style.display="none";
  if(U&&U.card){$("txt_tarjeta_box").innerHTML='<b>'+esc(U.card.brand)+' ···· '+esc(U.card.last4)+'</b><p style="margin:2px 0 0;font-size:12px;color:var(--mute)">Débito automático al instante</p>';}
  else{$("txt_tarjeta_box").innerHTML='<b>Tarjetas <span class="card-badges"><span class="badge-v">VISA</span><span class="badge-a">AMEX</span></span></b><p style="margin:2px 0 0;font-size:12px;color:var(--mute)">Agregar tarjeta de débito/crédito</p>';}
  if(S.pg==="Efectivo"){$("opt_efectivo").classList.add("selected");$("check_efectivo").style.display="block";}
  else if(S.pg==="Tarjeta"){$("opt_tarjeta").classList.add("selected");$("check_tarjeta").style.display="block";}
  else if(S.pg==="Mercado Pago"){$("opt_mp").classList.add("selected");$("check_mp").style.display="block";}
}
function seleccionarMetodo(m){S.pg=m;cerrarModalPago();if(S.ph==="opt")go("opt");}
function seleccionarTarjetaOAgregar(){if(U&&U.card){seleccionarMetodo("Tarjeta");}else{cerrarModalPago();go("tarjeta_form");}}

function cambiarSeccion(sec){
  if(!U||!U.nombre){go("welcome");return;}
  document.querySelectorAll(".nav-i").forEach(function(b){b.classList.remove("active");});
  if(sec==="home"){$("nav_inicio").classList.add("active");go("home");}
  else if(sec==="actividad"){$("nav_actividad").classList.add("active");go("actividad");}
  else if(sec==="cuenta"){$("nav_cuenta").classList.add("active");go("cuenta");}
}

function esNocturno(){var h=new Date().getHours();return (h>=22||h<6);}
function getCuadras(){return Math.max(1,Math.round(S.km*10));}
function price(i){var c=getCuadras(),b=esNocturno()?3600:2600,tot=b+(c>10?(c-10)*320:0);return Math.round(tot*(TY[i]?TY[i][2]:1.0));}
function M(n){return "ARS "+Math.round(n).toLocaleString("es-AR");}

function pedirViajeReal(){
  if(!U||!U.nombre){toast("Iniciá sesión para viajar");go("welcome");return;}
  if(S.pg==="Tarjeta"&&!(U&&U.card)){go("tarjeta_form");return;}
  var monto=Math.round(price(S.ty)),c=getCuadras();
  var payload={pasajero_id:U.id||null,pasajero_nombre:U.nombre+(U.apellido?" "+U.apellido[0]+".":""),tipo:TY[S.ty][0],forma_pago:S.pg,monto:monto,ganancia_conductor:Math.round(monto*0.85),km:Number(S.km.toFixed(1)),cuadras:c,origen_nombre:S.on,origen_ref:S.oref||"",origen_lat:S.o.lat,origen_lng:S.o.lng,destino_nombre:S.dn,destino_ref:S.dref||"",destino_lat:S.d.lat,destino_lng:S.d.lng,pasajero_lat:S.o.lat,pasajero_lng:S.o.lng,estado:"buscando",pago_estado:"pendiente"};

  fetch("/api/pedir-viaje",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(r){return r.json()}).then(function(j){
    if(!j.viaje)throw 0;S.viajeId=j.viaje.id;
    try{sessionStorage.setItem("uder_trip",JSON.stringify({viajeId:S.viajeId,o:S.o,on:S.on,oref:S.oref,d:S.d,dn:S.dn,dref:S.dref,km:S.km,cuadras:c,ty:S.ty,pg:S.pg}));}catch(e){}
    if(S.pg==="Tarjeta")procesarTarjetaSilenciosa(j.viaje.id,monto);
    else if(S.pg==="Mercado Pago")pagarMP(j.viaje.id,monto);
    else go("search");
  }).catch(function(){toast("No se pudo pedir el viaje");});
}

function procesarTarjetaSilenciosa(vid,monto){
  toast("Debitando de tu tarjeta…");
  var cvv=prompt("Código de seguridad CVV (3 dígitos) de tu tarjeta "+U.card.brand+" ···· "+U.card.last4+":");
  if(!cvv||cvv.length<3){toast("Viaje queda en Efectivo");S.pg="Efectivo";go("search");return;}
  var m=(U.card.exp||"12/28").split("/");
  if(!mp){toast("Error con pasarela de pago");S.pg="Efectivo";go("search");return;}
  mp.createCardToken({cardNumber:U.card.num,cardholderName:U.card.titular,cardExpirationMonth:m[0],cardExpirationYear:"20"+m[1],securityCode:cvv,identificationType:"DNI",identificationNumber:U.card.dni||"0"}).then(function(t){
    if(!t||!t.id)throw 0;
    fetch("/api/procesar-pago-tarjeta",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({viaje_id:vid,token:t.id,monto:monto,descripcion:"Viaje Uder: "+S.on+" a "+S.dn,email:U.email||"pasajero@uder.app",dni:U.card.dni||"0",nombre:U.nombre})}).then(function(r){return r.json()}).then(function(res){
      if(res.aprobado){toast("¡Pago debitado con éxito! 💳 ✓");go("search");}
      else{alert("Pago rechazado por el banco ("+(res.detalle||"Fondos insuficientes")+"). El viaje queda en Efectivo.");S.pg="Efectivo";go("search");}
    }).catch(function(){S.pg="Efectivo";go("search");});
  }).catch(function(){toast("CVV incorrecto. Queda en Efectivo.");S.pg="Efectivo";go("search");});
}

function pagarMP(vid,monto){
  toast("Abriendo Mercado Pago…");
  fetch("/api/crear-pago",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({viaje_id:vid,monto:monto,descripcion:"Viaje Uder: "+S.on+" a "+S.dn,nombre:U?U.nombre:"Pasajero",apellido:U?U.apellido:"Uder",dni:U?U.dni:"0"})}).then(function(r){return r.json()}).then(function(j){if(!j.url)throw 0;location.href=j.url;}).catch(function(){toast("Error de conexión");});
}

function volverMP(){
  var q=new URLSearchParams(location.search),r=q.get("pago");if(!r)return false;
  var id=q.get("payment_id")||q.get("collection_id"),vid=q.get("viaje"),t=null;
  try{t=JSON.parse(sessionStorage.getItem("uder_trip")||"null");}catch(e){}
  history.replaceState(null,"",location.pathname);
  if(!t&&!vid){cambiarSeccion("home");return true;}
  if(t)Object.assign(S,t);if(vid)S.viajeId=vid;draw();
  if(r==="ok"&&id){
    S.ph="verif";$("v").innerHTML='<div style="padding:30px 0;text-align:center"><h3>Confirmando pago…</h3><p style="color:var(--mute)">Estamos verificando con Mercado Pago.</p></div>';
    fetch("/api/verificar-pago?payment_id="+encodeURIComponent(id)+"&ref="+encodeURIComponent(t?t.ref:"")+"&viaje="+encodeURIComponent(S.viajeId||"")).then(function(x){return x.json()}).then(function(j){
      if(j.aprobado){toast("Pago acreditado ✓");go("search");}else{toast("Pago no confirmado");go("opt");}
    }).catch(function(){go("opt");});return true;
  }
  toast("El pago no se completó");go("opt");return true;
}

var carMarker=null;
function actualizarPosicionChofer(pos){
  if(!pos||pos.lat==null||pos.lng==null)return;
  var p=[pos.lat,pos.lng];
  if(!carMarker){
    carMarker=L.marker(p,{icon:L.divIcon({className:'',html:'<div style="background:#000;color:#F5B700;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.3)">🚗</div>',iconSize:[38,38],iconAnchor:[19,19]}),zIndexOffset:2000}).addTo(map);
  }else{carMarker.setLatLng(p);}

  if(S.ph==="pick"&&S.o){
    var d=hav({lat:pos.lat,lng:pos.lng},S.o),c=Math.max(1,Math.round(d*10)),el=$("eta_chofer");
    if(el){el.innerHTML=d<0.12?'<span class="badge-s" style="background:#FFF3CD;color:#856404">🔔 ¡El chofer está en tu puerta!</span>':'<span class="badge-s">🚗 Chofer a <b>'+c+' cuadras</b> ('+(d<1?Math.round(d*1000)+" m":d.toFixed(1)+" km")+')</span>';}
    if(!S.mapFitDone){map.fitBounds([p,[S.o.lat,S.o.lng]],{padding:[60,60],maxZoom:17});S.mapFitDone=true;}
  }
  if(S.ph==="trip"&&S.d){
    var dd=hav({lat:pos.lat,lng:pos.lng},S.d),eld=$("eta_destino");
    if(eld)eld.innerHTML='<span class="badge-s">🏁 Faltan <b>'+Math.max(1,Math.round(dd*10))+' cuadras</b></span>';
  }
}

function consultarViaje(){
  if(!S.viajeId)return;
  fetch("/api/estado-viaje?id="+encodeURIComponent(S.viajeId)).then(function(r){return r.json()}).then(function(res){
    var v=res.viaje;if(!v)return;
    if(v.estado==="cancelado"){clearInterval(pollTm);toast("Viaje cancelado");cambiarSeccion("home");return;}
    if((v.estado==="aceptado"||v.estado==="en_camino")&&S.ph==="search"){S.dr=[v.conductor_nombre,v.vehiculo,v.patente];go("pick");}
    if(res.conductor_pos)actualizarPosicionChofer(res.conductor_pos);
    if(v.estado==="en_curso"&&S.ph==="pick")go("trip");
    if(v.estado==="finalizado"&&(S.ph==="trip"||S.ph==="pick")){clearInterval(pollTm);go("done");}
  }).catch(function(){});
}

function cancelarViajeActual(){
  if(S.viajeId)fetch("/api/cancelar-viaje",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:S.viajeId})});
  clearInterval(pollTm);toast("Viaje cancelado");cambiarSeccion("home");
}

function hav(p,q){var r=Math.PI/180,u=(q.lat-p.lat)*r,w=(q.lng-p.lng)*r,a=Math.pow(Math.sin(u/2),2)+Math.cos(p.lat*r)*Math.cos(q.lat*r)*Math.pow(Math.sin(w/2),2);return 12742*Math.asin(Math.sqrt(a))}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}

function calcularRutaReal(origen,destino){
  var distDirecta=hav(origen,destino);
  var uDir="https://router.project-osrm.org/route/v1/driving/"+origen.lng+","+origen.lat+";"+destino.lng+","+destino.lat+"?overview=full&geometries=geojson&alternatives=true";
  var uCruce="https://router.project-osrm.org/route/v1/driving/"+origen.lng+","+origen.lat+";-64.9620,-25.7935;"+destino.lng+","+destino.lat+"?overview=full&geometries=geojson";

  return fetch(uDir).then(function(r){return r.json()}).then(function(j){
    if(!j.routes||!j.routes.length)throw 0;
    var rDir=j.routes.sort(function(a,b){return a.distance-b.distance})[0],kmD=rDir.distance/1000;
    if(kmD>Math.max(0.6,distDirecta*1.35)){
      return fetch(uCruce).then(function(cr){return cr.json()}).then(function(cj){
        if(cj.routes&&cj.routes.length&&cj.routes[0].distance/1000<kmD){
          return {km:Math.max(0.5,cj.routes[0].distance/1000),puntos:cj.routes[0].geometry.coordinates.map(function(c){return [c[1],c[0]]})};
        }
        return {km:Math.max(0.5,Math.min(kmD,distDirecta*1.25)),puntos:rDir.geometry.coordinates.map(function(c){return [c[1],c[0]]})};
      }).catch(function(){return {km:Math.max(0.5,Math.min(kmD,distDirecta*1.25)),puntos:rDir.geometry.coordinates.map(function(c){return [c[1],c[0]]})};});
    }
    return {km:Math.max(0.5,kmD),puntos:rDir.geometry.coordinates.map(function(c){return [c[1],c[0]]})};
  }).catch(function(){return {km:Math.max(0.5,distDirecta*1.25),puntos:[[origen.lat,origen.lng],[destino.lat,destino.lng]]};});
}

function buscarDireccion(q){
  var numM=q.match(/\b\d{1,5}\b/),num=numM?numM[0]:"",limpio=q.replace(/\b\d{1,5}\b/g,"").trim(),tMin=limpio.toLowerCase(),term=limpio,esPeron=false;
  if(tMin.indexOf("peron")>=0||tMin.indexOf("malvina")>=0){term="Ex Combatientes de Malvinas";esPeron=true;}
  else if(tMin.indexOf("mitre")>=0){term="Bartolomé Mitre";}
  else if(tMin.indexOf("guemes")>=0){term="Güemes";}

  var urlG="https://apis.datos.gob.ar/georef/api/v2.0/direcciones?max=6&provincia=salta&departamento=rosario%20de%20la%20frontera&direccion="+encodeURIComponent(term+(num?" "+num:""));
  return fetch(urlG).then(function(r){return r.json()}).then(function(j){
    var l=(j.direcciones||[]).filter(function(d){return d.ubicacion&&d.ubicacion.lat!=null;});
    if(!l.length)throw 0;
    return l.map(function(d){return {p:{lat:+d.ubicacion.lat,lng:+d.ubicacion.lon},n:(esPeron?"Ex Combatientes de Malvinas (B° Perón)":(d.nomenclatura?d.nomenclatura.split(",")[0]:d.calle.nombre)),num:num,refSugerida:num?"altura "+num:""};});
  }).catch(function(){
    var urlN="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=ar&viewbox="+BB.w+","+BB.n+","+BB.e+","+BB.s+"&bounded=0&q="+encodeURIComponent(term+", Rosario de la Frontera, Salta");
    return fetch(urlN).then(function(r){return r.json()}).then(function(arr){
      if(!Array.isArray(arr))return [];
      return arr.map(function(x){var c=x.display_name.split(",")[0].replace(/Ram[oó]n Abdala/gi,"B° Perón");if(esPeron&&c.indexOf("Perón")<0)c="Ex Combatientes de Malvinas (B° Perón)";return {p:{lat:+x.lat,lng:+x.lon},n:c,num:num,refSugerida:num?"altura "+num:""};});
    }).catch(function(){return [];});
  });
}

var map=L.map("map",{zoomControl:false}).setView([CEN.lat,CEN.lng],14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:""}).addTo(map);
var G=L.layerGroup().addTo(map),routeLine=null;

function pin(p,c,m,t){
  var k=L.marker([p.lat,p.lng],{draggable:true,icon:L.divIcon({className:"",html:'<div style="width:20px;height:20px;border-radius:50%;background:'+c+';border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(G).bindTooltip(t);
  k.on("dragend",function(){var q=k.getLatLng();if(S.ph==="home")setPt(m,{lat:q.lat,lng:q.lng},null,true);});
}

function draw(keep){
  G.clearLayers();routeLine=null;var b=[];
  if(S.o){pin(S.o,"#000","o","Desde: "+lab(S.on,S.oref));b.push([S.o.lat,S.o.lng]);}
  if(S.d){pin(S.d,"#DE1135","d","Hasta: "+lab(S.dn,S.dref));b.push([S.d.lat,S.d.lng]);}
  if(S.o&&S.d){
    calcularRutaReal(S.o,S.d).then(function(res){
      S.km=res.km;S.cuadras=getCuadras();routeLine=L.polyline(res.puntos,{color:"#000",weight:5,opacity:0.85}).addTo(G);
    });
  }
  if(keep)return;
  if(b.length===2)map.fitBounds(b,{padding:[40,40]});
  else if(b.length===1)map.setView(b[0],16);
}

function setPt(m,p,n,keep){
  if(m==="o"){S.o=p;S.on=n||"Punto en el mapa";if(!S.d){S.mode="d";S.msg="¿A dónde vas?";}}
  else{S.d=p;S.dn=n||"Punto en el mapa";}
  S.res=[];draw(keep);go("home");
  setTimeout(function(){var qEl=$("q");if(qEl&&S.mode==="d"&&!S.d){qEl.value="";qEl.placeholder="¿A dónde vas? (ej: peron 412)";qEl.focus();}},100);
}

map.on("click",function(e){if(S.ph!=="home")return;if(S.mode==="o")S.oref="";else S.dref="";setPt(S.mode,{lat:e.latlng.lat,lng:e.latlng.lng},"Punto marcado");});
function mode(m){S.mode=m;go("home");}

function loc(){
  toast("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(function(g){
    var p={lat:g.coords.latitude,lng:g.coords.longitude},enR=(p.lng>BB.w&&p.lng<BB.e&&p.lat>BB.s&&p.lat<BB.n);
    if(enR){setPt("o",p,"Ubicación actual");map.setView([p.lat,p.lng],16);}
    else{setPt("o",{lat:CEN.lat,lng:CEN.lng},"Centro (Rosario de la Frontera)");}
  },function(){setPt("o",{lat:CEN.lat,lng:CEN.lng},"Centro (Rosario de la Frontera)");},{enableHighAccuracy:true,timeout:8000});
}

function find(){
  var q=$("q").value.trim();if(!q)return toast("Escribí una calle");
  S.msg="Buscando…";go("home");$("q").value=q;
  buscarDireccion(q).then(function(rs){S.res=rs;S.msg=rs.length?"Seleccioná la dirección:":"Sin resultados. Probá tocando el mapa.";go("home");$("q").value=q;}).catch(function(){toast("No se pudo buscar");go("home");});
}
function pickRes(i){var r=S.res[i];if(!r)return;var ref=r.refSugerida||(r.num?"altura "+r.num:"");if(S.mode==="o")S.oref=ref;else S.dref=ref;setPt(S.mode,r.p,r.n);}
function opts(){if(!S.o||!S.d)return toast("Elegí origen y destino");calcularRutaReal(S.o,S.d).then(function(res){S.km=res.km;S.cuadras=getCuadras();go("opt");});}

  }

8;margin-top:6px"><span>💳 <b>'+esc(U.card.brand)+' ···· '+esc(U.card.last4)+'</b></span><button style="border:0;background:none;color:var(--bad);font-weight:700;font-size:12px;cursor:pointer" onclick="eliminarTarjeta()">Quitar</button></div>':'')+'</div><button class="btn-uber" style="background:#FFF0F0;color:var(--bad);border:1px solid #FFCDD2" onclick="logout()">Cerrar sesión</button></div>';
  }

  if(ph==="tarjeta_form"){
    v.innerHTML='<div style="padding:10px 0"><h2 style="font-size:24px;font-weight:800;margin:0 0 6px">Agregar tarjeta</h2><p style="color:var(--mute);font-size:14px;margin:0 0 20px">Débito o crédito para cobrarte automáticamente los viajes sin salir de Uder.</p><label style="font-size:12px;font-weight:700">NÚMERO DE TARJETA</label><input id="c_n" inputmode="numeric" placeholder="4500 0000 0000 0000" maxlength="19" class="field-input" oninput="this.value=this.value.replace(/\\D/g,\'\').slice(0,19).replace(/(.{4})/g,\'$1 \').trim()"><div style="display:flex;gap:12px"><div style="flex:1"><label style="font-size:12px;font-weight:700">VENCIMIENTO</label><input id="c_e" inputmode="numeric" placeholder="MM/AA" maxlength="5" class="field-input" oninput="var d=this.value.replace(/\\D/g,\'\').slice(0,4);this.value=d.length>2?d.slice(0,2)+\'/\'+d.slice(2):d"></div><div style="flex:1"><label style="font-size:12px;font-weight:700">CVV</label><input id="c_c" type="password" inputmode="numeric" placeholder="123" maxlength="4" class="field-input"></div></div><label style="font-size:12px;font-weight:700">TITULAR DE LA TARJETA</label><input id="c_t" placeholder="Como figura en el plástico" class="field-input"><label style="font-size:12px;font-weight:700">DNI DEL TITULAR</label><input id="c_dni" inputmode="numeric" placeholder="Número de documento" maxlength="8" class="field-input"><button class="btn-uber" onclick="guardarTarjetaNativa()">Vincular tarjeta</button><button class="btn-ghost-u" onclick="cambiarSeccion(\'cuenta\')">Cancelar</button></div>';
  }

  if(ph==="welcome"){
    v.innerHTML='<div style="text-align:center;padding:30px 10px"><div style="width:72px;height:72px;background:#000;color:var(--accent);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;margin-bottom:18px">U</div><h2 style="font-size:26px;font-weight:800;margin:0 0 8px">Te damos la bienvenida a Uder</h2><p style="color:var(--mute);font-size:15px;margin:0 0 26px">Iniciá sesión o registrate para viajar en Rosario de la Frontera.</p><button class="btn-uber" style="background:#fff;color:#000;border:1px solid #ddd;margin-bottom:16px" onclick="loginGoogle()"><svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:8px"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.43 7.34 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.24C.45 8.15 0 9.99 0 12s.45 3.85 1.24 5.42l4.04-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.57 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>Continuar con Google</button><div style="text-align:left;background:var(--surface);border-radius:14px;padding:18px;margin-bottom:14px"><div style="font-weight:700;margin-bottom:10px">O ingresá con tu correo</div><input id="l_e" type="email" placeholder="Email" class="field-input"><input id="l_w" type="password" placeholder="Contraseña" class="field-input"><button class="btn-uber" onclick="doLoginEmail()">Ingresar</button></div><button class="btn-ghost-u" onclick="go(\'reg\')">¿No tenés cuenta? Registrate gratis</button></div>';
  }

  if(ph==="reg"){
    v.innerHTML='<div style="padding:20px 10px"><h2 style="font-size:24px;font-weight:800;margin:0 0 6px">Crear cuenta</h2><p style="color:var(--mute);font-size:14px;margin:0 0 20px">Registrate gratis para pedir viajes.</p><input id="r_n" placeholder="Nombre/s" class="field-input"><input id="r_a" placeholder="Apellido" class="field-input"><input id="r_e" type="email" placeholder="Email" class="field-input"><input id="r_w" type="password" placeholder="Contraseña (mínimo 6)" class="field-input"><button class="btn-uber" onclick="doRegistroEmail()">Crear cuenta</button><button class="btn-ghost-u" onclick="go(\'welcome\')">Volver al inicio</button></div>';
  }

  if(ph==="search"){
    v.innerHTML='<div style="text-align:center;padding:15px 0"><h3 style="margin:0 0 6px;font-size:20px;font-weight:800">Buscando tu '+TY[S.ty][0]+'…</h3><p style="margin:0 0 16px;color:var(--mute);font-size:14px">Avisando a los choferes cercanos.</p><div style="height:6px;border-radius:10px;background:#EEE;overflow:hidden;margin-bottom:20px"><i style="width:65%;display:block;height:100%;background:#000"></i></div><button class="btn-uber" style="background:var(--surface);color:#000" onclick="cancelarViajeActual()">Cancelar pedido</button></div>';
    pollTm=setInterval(consultarViaje,2500);
  }

  if(ph==="pick"){
    var d=S.dr||["Conductor","Auto en camino","---"];
    v.innerHTML='<div style="padding:10px 0"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h3 style="margin:0;font-size:20px;font-weight:800">'+esc(d[0])+' viene a buscarte</h3><p style="margin:4px 0 0;color:var(--mute);font-size:14px">'+esc(d[1])+'</p></div><div class="plate">'+esc(d[2])+'</div></div><div id="eta_chofer" style="margin:16px 0"><span class="badge-s">🚗 Localizando conductor en el mapa…</span></div><div style="background:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between"><span>Pago: <b>'+esc(S.pg)+'</b></span><span>Total: <b>'+M(price(S.ty))+'</b></span></div><button class="btn-ghost-u" style="color:var(--bad)" onclick="cancelarViajeActual()">Cancelar viaje</button></div>';
    pollTm=setInterval(consultarViaje,2500);
  }

  if(ph==="trip"){
    v.innerHTML='<div style="padding:10px 0"><h3 style="margin:0;font-size:20px;font-weight:800">Viaje en curso</h3><p style="margin:4px 0 14px;color:var(--mute);font-size:14px">Con '+esc(S.dr[0])+' hacia tu destino</p><div id="eta_destino" style="margin-bottom:16px"><span class="badge-s">En viaje a destino…</span></div><div style="background:var(--surface);padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;font-weight:600">Total a pagar:</span><b style="font-size:20px">'+M(price(S.ty))+'</b></div></div>';
    pollTm=setInterval(consultarViaje,2500);
  }

  if(ph==="done"){
    v.innerHTML='<div style="text-align:center;padding:20px 0"><h2 style="font-size:26px;font-weight:800;margin:0">¡Llegaste a destino!</h2><div style="font-size:42px;font-weight:900;margin:16px 0;letter-spacing:-1px">'+M(price(S.ty))+'</div><p style="color:var(--mute);margin-bottom:24px">'+(S.pg==="Efectivo"?"Pagale en efectivo a tu chofer.":"El cobro fue procesado automáticamente.")+'</p><button class="btn-uber" onclick="S.d=null;S.dn=\'\';S.viajeId=null;draw();cambiarSeccion(\'home\')">Listo</button></div>';
  }
}

if(!volverMP()){
  if(U&&U.nombre&&U.nombre!=="Pasajero"){cambiarSeccion("home");}
  else{go("welcome");}
}
</script>
</body>
</html>
