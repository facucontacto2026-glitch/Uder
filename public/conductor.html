<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F9F9F9;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.app{max-width:480px;width:100%;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:#fff}

header{position:sticky;top:0;z-index:1000;background:#fff;padding:14px 20px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:24px;letter-spacing:-1px}

#map{height:280px;width:100%;background:#E5E3DF;z-index:1}

.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.card-alerta{border:2px solid var(--accent);box-shadow:0 0 15px rgba(245,183,0,0.35);animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

.btn{width:100%;height:52px;border:0;border-radius:12px;font:700 16px 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.btn.accent{background:var(--accent);color:#000}
.btn.ghost{background:transparent;color:var(--ink-secondary);border:1px solid #ddd;height:46px}

.chip{border:1px solid #ddd;background:var(--surface);color:#000;border-radius:20px;padding:8px 14px;font:700 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.field-input{width:100%;padding:14px;border-radius:10px;border:1px solid #D5DBE5;background:#F9F9F9;font:600 15px 'Plus Jakarta Sans',sans-serif;margin-top:6px;margin-bottom:14px;outline:none}
.field-input:focus{border-color:#000;background:#fff}

.plate{font-weight:800;letter-spacing:2px;border:2px solid #000;border-radius:6px;padding:3px 8px;font-size:13px}
.fare{font-size:36px;font-weight:900;letter-spacing:-1px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;font-weight:600;box-shadow:0 4px 15px rgba(0,0,0,0.2);z-index:5000;max-width:85%;text-align:center}
.tag{display:inline-block;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;background:var(--surface);color:#000}
.nav{display:inline-block;margin:12px 0;color:#000;font-weight:700;font-size:14px;text-decoration:none}

<script>
var sb = supabase.createClient("https://mmgvttmgchnbppcemrwg.supabase.co", "sb_publishable_HtTCeT611_CKOvtxebUxTw_FQpL_seZ");

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});

var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  var b = document.getElementById("btn_instalar");
  if(b) b.style.display = "inline-flex";
});
function instalarPwa(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt = null;
  }
}

var D = { u: null, p: null, c: null, on: false, sig: "", pos: null }, tm = null, wid = null, last = 0;

var audioCtx = null;
function initAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}

function sonarAlerta(){
  try{
    initAudio();
    if(!audioCtx) return;
    var now = audioCtx.currentTime;

    var osc1 = audioCtx.createOscillator(), gain1 = audioCtx.createGain();
    osc1.type = "sine"; osc1.frequency.setValueAtTime(880, now);
    gain1.gain.setValueAtTime(0.8, now); gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc1.connect(gain1); gain1.connect(audioCtx.destination);
    osc1.start(now); osc1.stop(now + 0.3);

    var osc2 = audioCtx.createOscillator(), gain2 = audioCtx.createGain();
    osc2.type = "sine"; osc2.frequency.setValueAtTime(1174, now + 0.2);
    gain2.gain.setValueAtTime(0.9, now + 0.2); gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.start(now + 0.2); osc2.stop(now + 0.55);

    var osc3 = audioCtx.createOscillator(), gain3 = audioCtx.createGain();
    osc3.type = "triangle"; osc3.frequency.setValueAtTime(1760, now + 0.45);
    gain3.gain.setValueAtTime(1.0, now + 0.45); gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
    osc3.connect(gain3); gain3.connect(audioCtx.destination);
    osc3.start(now + 0.45); osc3.stop(now + 0.9);

    if(navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 600]);
  }catch(e){}
}

function $(x){return document.getElementById(x)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function M(n){return "ARS " + Math.round(n).toLocaleString("es-AR")}
function toast(m){var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function err(m){var e=$("err");if(e)e.textContent=m}

function view(h){
  clearInterval(tm);
  var m = $("map"); if(m) m.style.display = "none";
  $("v").innerHTML = h;
}

// INGRESO
function login(){
  view(
    '<div class="card">' +
      '<h2 style="margin:0 0 8px;font-size:22px;font-weight:800">Ingresá como conductor</h2>' +
      '<p style="color:var(--ink-secondary);font-size:14px;margin:0 0 18px">Conectate para recibir viajes en Rosario de la Frontera.</p>' +
      '<label style="font-size:12px;font-weight:700">EMAIL</label>' +
      '<input id="e" type="email" placeholder="tu-email@gmail.com" class="field-input">' +
      '<label style="font-size:12px;font-weight:700">CONTRASEÑA</label>' +
      '<input id="w" type="password" placeholder="Tu contraseña" class="field-input">' +
      '<p id="err" style="color:var(--bad);font-size:13px;margin:0 0 10px"></p>' +
      '<button class="btn accent" onclick="doLogin()">Ingresar al panel</button>' +
      '<button class="btn ghost" onclick="reg()">Quiero ser conductor</button>' +
    '</div>'
  );
}

// REGISTRO
function reg(){
  view(
    '<div class="card">' +
      '<h2 style="margin:0 0 8px;font-size:22px;font-weight:800">Registro de conductor</h2>' +
      '<p style="color:var(--ink-secondary);font-size:14px;margin:0 0 16px">Completá tus datos para empezar a trabajar con Uder.</p>' +
      '<label style="font-size:12px;font-weight:700">EMAIL</label><input id="r_e" type="email" class="field-input">' +
      '<label style="font-size:12px;font-weight:700">CONTRASEÑA</label><input id="r_w" type="password" class="field-input">' +
      '<label style="font-size:12px;font-weight:700">NOMBRE</label><input id="r_n" class="field-input">' +
      '<label style="font-size:12px;font-weight:700">APELLIDO</label><input id="r_a" class="field-input">' +
      '<label style="font-size:12px;font-weight:700">VEHÍCULO (MARCA, MODELO Y COLOR)</label><input id="r_ve" placeholder="Ej: Chevrolet Onix blanco" class="field-input">' +
      '<label style="font-size:12px;font-weight:700">PATENTE</label><input id="r_pa" placeholder="Ej: AB 123 CD" class="field-input">' +
      '<label style="font-size:12px;font-weight:700">TIPO DE SERVICIO</label>' +
      '<select id="r_ti" class="field-input"><option>Remis</option><option>Uder</option></select>' +
      '<p id="err" style="color:var(--bad);font-size:13px;margin:0 0 10px"></p>' +
      '<button class="btn accent" id="btn_crear_chofer" onclick="doReg()">Crear cuenta</button>' +
      '<button class="btn ghost" onclick="login()">Volver al ingreso</button>' +
    '</div>'
  );
}

function doLogin(){
  initAudio();
  var e = $("e").value.trim(), w = $("w").value;
  if(!e || !w) return err("Completá email y contraseña.");
  err("Ingresando…");
  sb.auth.signInWithPassword({ email: e, password: w }).then(function(r){
    if(r.error) return err("Email o contraseña incorrectos.");
    D.u = r.data.user;
    load();
  }).catch(function(e){ err("Error al conectar: " + e.message); });
}

// CREACIÓN DE CONDUCTOR INSTANTÁNEA
function doReg(){
  initAudio();
  var e = $("r_e").value.trim(), w = $("r_w").value, n = $("r_n").value.trim(), a = $("r_a").value.trim(), ve = $("r_ve").value.trim(), pa = $("r_pa").value.trim().toUpperCase(), ti = $("r_ti").value;
  if(!e || !w || !n || !ve || !pa) return err("Completá todos los campos.");
  if(w.length < 6) return err("Contraseña de al menos 6 caracteres.");

  var btn = $("btn_crear_chofer");
  if(btn){ btn.disabled = true; btn.textContent = "Creando cuenta…"; }
  err("Creando tu cuenta de chofer…");

  sb.auth.signUp({
    email: e,
    password: w,
    options: { data: { full_name: n + " " + a, rol: "conductor" } }
  }).then(function(r){
    if(r.error) throw r.error;
    var uid = r.data.user ? r.data.user.id : null;
    if(!uid) throw new Error("No se pudo obtener el usuario");
    D.u = r.data.user;

    // Establecer datos en memoria de inmediato para dibujar la pantalla en 0 segundos
    D.p = { nombre: n, apellido: a, rol: "conductor" };
    D.c = { vehiculo: ve, patente: pa, tipo: ti, verificado: false, estado_revision: "pendiente", conectado: false };

    // Guardar en Supabase en paralelo
    sb.from("perfiles").upsert({ id: uid, rol: "conductor", nombre: n, apellido: a }).then(function(){});
    sb.from("conductores").upsert({ id: uid, vehiculo: ve, patente: pa, tipo: ti, verificado: false, estado_revision: "pendiente", conectado: false }).then(function(){});

    // Abrir de inmediato la pantalla para subir las 4 fotos
    panel();
    draw(null, []);
  }).catch(function(e){
    err("Error: " + (e.message || "No se pudo registrar"));
    if(btn){ btn.disabled = false; btn.textContent = "Crear cuenta"; }
  });
}

function load(){
  if(!D.u) return login();
  
  // Usamos maybeSingle para que no arroje error si el chofer es nuevo
  sb.from("perfiles").select("*").eq("id", D.u.id).maybeSingle().then(function(p){
    if(p.data && p.data.rol === "pasajero"){
      view(
        '<div class="card" style="text-align:center;padding:30px 16px">' +
          '<div style="font-size:40px;margin-bottom:12px">⚠️</div>' +
          '<h3 style="margin:0 0 8px;font-size:20px;font-weight:800">Cuenta de Pasajero detectada</h3>' +
          '<p style="color:var(--ink-secondary);font-size:14px;margin:0 0 20px">Iniciaste sesión con tu cuenta de pasajero. Para recibir viajes como chofer, ingresá con tu cuenta de conductor.</p>' +
          '<button class="btn accent" onclick="cambiarACuentaChofer()">Ingresar con cuenta de chofer</button>' +
        '</div>'
      );
      return;
    }

    var nom = (p.data && p.data.nombre) ? p.data.nombre : (D.u.user_metadata?.first_name || D.u.user_metadata?.full_name?.split(" ")[0] || "Conductor");
    var ape = (p.data && p.data.apellido) ? p.data.apellido : (D.u.user_metadata?.last_name || "");
    D.p = { nombre: nom, apellido: ape, rol: "conductor" };
    panel();
  }).catch(function(){
    D.p = { nombre: "Conductor", apellido: "Uder", rol: "conductor" };
    panel();
  });
}

function cambiarACuentaChofer(){
  try {
    sessionStorage.clear();
    localStorage.clear();
  } catch(e){}
  sb.auth.signOut().then(function(){
    D.u = null; D.p = null; D.c = null;
    login();
  });
}

function out(){
  untrack();
  try {
    sessionStorage.clear();
    localStorage.clear();
  } catch(e){}
  sb.auth.signOut().then(function(){
    D.u = null; D.p = null; D.c = null; D.on = false;
    login();
  });
}

function panel(){
  D.sig = "";
  refresh();
  tm = setInterval(refresh, 3500);
}

function refresh(){
  if(!D.u) return;
  var uid = D.u.id;

  Promise.all([
    sb.from("conductores").select("*").eq("id", uid).maybeSingle(),
    sb.from("viajes").select("*").eq("conductor_id", uid).in("estado", ["aceptado", "en_camino", "en_curso"]).limit(1),
    D.on ? sb.from("viajes").select("*").eq("estado", "buscando").order("creado_en") : Promise.resolve({ data: [] })
  ]).then(function(r){
    var cData = r[0].data;
    if(cData){
      D.c = cData;
    } else if(!D.c){
      D.c = { vehiculo: "Auto Uder", patente: "UDER", tipo: "Remis", verificado: false, estado_revision: "pendiente", conectado: false };
    }

    if(D.init === undefined){
      D.init = 1;
      D.on = !!D.c.conectado;
      if(D.on) track();
    }

    var act = (r[1].data || [])[0];
    var off = r[2].data || [];

    if(D.on && off.length > 0 && !act){
      sonarAlerta();
    }

    // Dibujar la pantalla de inmediato sin trabarse
    draw(act, off);
  }).catch(function(e){
    console.error("Refresh error:", e);
    if(!D.c){
      D.c = { vehiculo: "Auto Uder", patente: "UDER", tipo: "Remis", verificado: false, estado_revision: "pendiente", conectado: false };
    }
    draw(null, []);
  });
}

function draw(act, off){
  if(D.view === "gan") return;

  var nom = (D.p && D.p.nombre) ? D.p.nombre : "Conductor";
  var ape = (D.p && D.p.apellido) ? D.p.apellido : "";
  var veh = (D.c && D.c.vehiculo) ? D.c.vehiculo : "Vehículo";
  var pat = (D.c && D.c.patente) ? D.c.patente : "---";
  var tip = (D.c && D.c.tipo) ? D.c.tipo : "Remis";

  var h = 
    '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<div>' +
          '<h3 style="margin:0;font-size:18px;font-weight:800">'+esc(nom)+' '+esc(ape)+'</h3>' +
          '<p style="margin:3px 0 0;color:var(--ink-secondary);font-size:13px">'+esc(veh)+' · <span class="plate">'+esc(pat)+'</span></p>' +
        '</div>' +
        '<span class="tag" style="background:#000;color:#fff">'+esc(tip)+'</span>' +
      '</div>' +
    '</div>';

  if(!D.c || !D.c.verificado){
    h += docsCard();
  } else if(act){
    var tx = {
      aceptado: ["Voy en camino", "en_camino"],
      en_camino: ["Iniciar viaje", "en_curso"],
      en_curso: ["Finalizar viaje", "finalizado"]
    }[act.estado] || ["Avanzar", "en_curso"];

    h += 
      '<div class="card">' +
        '<h3 style="margin:0 0 6px;font-size:19px;font-weight:800">Viaje con '+esc(act.pasajero_nombre)+'</h3>' +
        '<div class="fare" style="color:var(--ok)">'+M(act.ganancia_conductor)+'</div>' +
        '<p style="color:var(--ink-secondary);font-size:13px;margin:4px 0 14px">'+(act.forma_pago==="Efectivo"?"💵 Cobrá "+M(act.monto)+" en mano al pasajero.":"💳 Pagado con tarjeta / Mercado Pago.")+'</p>' +
        '<div style="background:var(--surface);padding:12px;border-radius:12px;font-size:14px;line-height:1.6">' +
          '<div>📍 <b>Retiro:</b> '+esc(act.origen_nombre)+'</div>' +
          '<div>🏁 <b>Destino:</b> '+esc(act.destino_nombre)+'</div>' +
        '</div>' +
        '<a class="nav" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+(act.estado==="en_curso"?act.destino_lat+","+act.destino_lng:act.origen_lat+","+act.origen_lng)+'">🗺️ Abrir navegación en Google Maps ↗</a>' +
        '<button class="btn accent" onclick="avanzar(\''+act.id+'\',\''+tx[1]+'\')">'+tx[0]+'</button>' +
      '</div>';
  } else if(!D.on){
    h += 
      '<div class="card" style="text-align:center;padding:24px 16px">' +
        '<div style="font-size:36px;margin-bottom:8px">💤</div>' +
        '<h3 style="margin:0 0 6px;font-size:20px;font-weight:800">Estás desconectado</h3>' +
        '<p style="color:var(--ink-secondary);font-size:14px;margin:0 0 16px">Conectate para que los pasajeros te vean y recibas viajes.</p>' +
        '<button class="btn accent" onclick="setOn(true)">Conectarme</button>' +
      '</div>';
  } else {
    h += 
      '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
          '<h3 style="margin:0;font-size:18px;font-weight:800">Pedidos disponibles</h3>' +
          '<span class="tag" style="background:#E8F5E9;color:#1B5E20;font-weight:800">● Conectado</span>' +
        '</div>' +
        '<button class="chip" onclick="sonarAlerta()">🔊 Probar sonido de alerta</button>' +
        (off.length ? 
          off.map(function(o){
            return '<div class="card card-alerta" style="margin-top:14px">' +
              '<div style="display:flex;justify-content:space-between;align-items:center">' +
                '<span class="tag">'+esc(o.tipo)+'</span>' +
                '<span class="tag">'+esc(o.forma_pago)+'</span>' +
              '</div>' +
              '<div class="fare" style="color:var(--ok);margin:10px 0 4px">'+M(o.ganancia_conductor)+'</div>' +
              '<p style="font-size:13px;color:var(--ink-secondary);margin:0 0 12px">Ganancia neta · '+o.km+' km · Pasajero: <b>'+esc(o.pasajero_nombre)+'</b></p>' +
              '<div style="font-size:13px;line-height:1.5;margin-bottom:14px">' +
                '<div>📍 Retiro: <b>'+esc(o.origen_nombre)+'</b></div>' +
                '<div>🏁 Destino: <b>'+esc(o.destino_nombre)+'</b></div>' +
              '</div>' +
              '<button class="btn accent" style="margin:0" onclick="aceptar(\''+o.id+'\')">Aceptar viaje</button>' +
            '</div>';
          }).join("") 
        : '<p style="color:var(--ink-secondary);margin-16px 0 0;font-size:14px">Esperando pedidos… Mantené la pantalla abierta.</p>') +
        '<button class="btn ghost" style="margin-top:16px" onclick="setOn(false)">Desconectarme</button>' +
      '</div>';
  }

  if(D.c && D.c.verificado) h += '<button class="btn ghost" onclick="verGan()">Mis ganancias</button>';
  h += '<button class="btn ghost" style="color:var(--bad);border-color:#FFCDD2" onclick="out()">Cerrar sesión</button>';
  
  $("v").innerHTML = h;
  mapaViaje(act);
}

// FORMULARIO DE DOCUMENTACIÓN CON VERIFICACIÓN POR IA
function docsCard(){
  var c = D.c || {};
  var esRechazado = (c.estado_revision === "rechazado");

  return '<div class="card">' +
    '<h3 style="margin:0 0 6px;font-size:20px;font-weight:800">' + (esRechazado ? 'Documentación no aprobada' : 'Verificación obligatoria') + '</h3>' +
    (esRechazado && c.motivo_rechazo ? '<p style="color:var(--bad);font-weight:700;margin-bottom:12px">Motivo: ' + esc(c.motivo_rechazo) + '</p>' : '') +
    '<p style="color:var(--ink-secondary);font-size:14px;margin-bottom:16px">Subí fotos claras de tus 4 documentos. <b>Nuestra Inteligencia Artificial los analiza en 3 segundos</b> para habilitarte automáticamente.</p>' +
    docInput("d_l", "1. Licencia de conducir (frente)") +
    docInput("d_s", "2. Póliza de seguro vigente") +
    docInput("d_v", "3. Cédula del vehículo (frente)") +
    docInput("d_t", "4. Revisión Técnica (VTV / RTO)") +
    '<p id="err" style="color:var(--bad);font-size:13px;margin:8px 0"></p>' +
    '<button class="btn accent" id="btn_subir_docs" onclick="subirYAnalizarDocs()">🤖 Enviar y verificar con IA</button>' +
  '</div>';
}

function docInput(id, title){
  return '<label style="font-size:12px;font-weight:700;display:block;margin-top:10px">' + title + '</label>' +
         '<input id="' + id + '" type="file" accept="image/jpeg,image/png,image/webp" class="field-input" style="padding:10px">';
}

// SUBIR Y ANALIZAR CON IA EN 3 SEGUNDOS
function subirYAnalizarDocs(){
  var fs = ["d_l", "d_s", "d_v", "d_t"].map(function(i){ return $(i).files[0]; });
  if(fs.some(function(f){ return !f; })) return err("Por favor seleccioná las 4 fotos.");
  if(fs.some(function(f){ return f.size > 5242880; })) return err("Cada foto debe pesar menos de 5 MB.");

  var btn = $("btn_subir_docs");
  btn.disabled = true;
  btn.textContent = "🤖 Analizando con Inteligencia Artificial… (3 seg)";
  err("Subiendo documentos y validando vigencia con IA…");

  var t = Date.now();
  var tipos = ["licencia", "seguro", "cedula", "vtv"];

  Promise.all(fs.map(function(f, i){
    var ext = (f.name.split(".").pop() || "jpg").toLowerCase();
    var p = D.u.id + "/" + tipos[i] + "-" + t + "." + ext;
    return sb.storage.from("documentos").upload(p, f, { contentType: f.type, upsert: true }).then(function(r){
      if(r.error) throw r.error;
      return { tipo: tipos[i], path: p };
    });
  })).then(function(uploadedDocs){
    return fetch("/api/verificar-documentos-ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        conductor_id: D.u.id,
        nombre: D.p ? D.p.nombre : "Chofer",
        apellido: D.p ? D.p.apellido : "",
        vehiculo: D.c ? D.c.vehiculo : "",
        patente: D.c ? D.c.patente : "",
        docs: uploadedDocs
      })
    });
  }).then(function(r){ return r.json(); }).then(function(res){
    if(res.aprobado){
      alert("¡Felicitaciones! 🎉\n\nNuestra Inteligencia Artificial analizó tus documentos y comprobó que todo está en regla.\n\nYa estás habilitado para conectarte y empezar a trabajar con Uder.");
    } else {
      alert("Aviso de verificación de IA:\n\n" + (res.motivo || "No se pudieron validar todos los documentos. Revisá las fotos e intentá de nuevo."));
    }
    D.sig = "";
    refresh();
  }).catch(function(e){
    err("Error: " + (e.message || "No se pudo completar el análisis"));
    btn.disabled = false;
    btn.textContent = "🤖 Reintentar verificación";
  });
}

// MAPA
var map = null, G = null, rkey = "", RL = null, me = null;

function rutaCorta(a, b){
  var u = "https://router.project-osrm.org/route/v1/driving/" + a[1] + "," + a[0] + ";" + b[1] + "," + b[0] + "?overview=full&geometries=geojson";
  return fetch(u).then(function(r){ return r.json() }).then(function(j){
    if(!j.routes || !j.routes.length) throw 0;
    return { pts: j.routes[0].geometry.coordinates.map(function(c){ return [c[1], c[0]]; }) };
  }).catch(function(){
    return { pts: [[a[0], a[1]], [b[0], b[1]]] };
  });
}

function mapaViaje(a){
  var el = $("map");
  if(!a){ el.style.display = "none"; rkey = ""; return; }
  el.style.display = "block";

  if(!map){
    map = L.map("map", { zoomControl: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    G = L.layerGroup().addTo(map);
  }
  map.invalidateSize();
  G.clearLayers();

  var o = [a.origen_lat, a.origen_lng], d = [a.destino_lat, a.destino_lng], pts = [o, d];
  L.circleMarker(o, { radius: 8, color: "#fff", weight: 3, fillColor: "#000", fillOpacity: 1 }).addTo(G).bindTooltip("Retiro: " + a.origen_nombre);
  L.circleMarker(d, { radius: 8, color: "#fff", weight: 3, fillColor: "#DE1135", fillOpacity: 1 }).addTo(G).bindTooltip("Destino: " + a.destino_nombre);

  if(D.pos){
    L.circleMarker(D.pos, { radius: 10, color: "#000", weight: 3, fillColor: "#F5B700", fillOpacity: 1 }).addTo(G).bindTooltip("Vos");
    pts.push(D.pos);
  }

  var k = a.id + a.estado + (D.pos ? "p" : "");
  if(rkey !== k){
    rkey = k;
    rutaCorta(D.pos || o, a.estado === "en_curso" ? d : o).then(function(res){
      if(RL) map.removeLayer(RL);
      RL = L.polyline(res.pts, { color: "#000", weight: 5, opacity: 0.85 }).addTo(G);
    });
    map.fitBounds(pts, { padding: [40, 40], maxZoom: 17 });
  }
}

function verGan(){
  D.view = "gan";
  var el = $("map"); if(el) el.style.display = "none";
  $("v").innerHTML = '<div class="card"><p>Cargando tus ganancias…</p></div>';

  sb.from("viajes").select("id,creado_en,origen_nombre,destino_nombre,forma_pago,ganancia_conductor")
    .eq("conductor_id", D.u.id).eq("estado", "finalizado").order("creado_en", { ascending: false }).limit(50)
    .then(function(r){
      var L = r.data || [];
      var sum = L.reduce(function(acc, x){ return acc + (x.ganancia_conductor || 0); }, 0);
      
      var h = 
        '<div class="card">' +
          '<h3 style="margin:0 0 10px;font-size:20px;font-weight:800">Tus ganancias</h3>' +
          '<div class="fare" style="color:var(--ok)">'+M(sum)+'</div>' +
          '<p style="color:var(--ink-secondary);font-size:13px;margin:4px 0 16px">'+L.length+' viajes completados</p>' +
          (L.length ? L.map(function(x){
            return '<div style="border-top:1px solid var(--line);padding:10px 0;font-size:13px;display:flex;justify-content:space-between">' +
              '<div><b>'+esc(x.origen_nombre)+' → '+esc(x.destino_nombre)+'</b><small style="display:block;color:var(--ink-secondary)">'+esc(x.forma_pago)+'</small></div>' +
              '<b style="font-size:15px">'+M(x.ganancia_conductor)+'</b>' +
            '</div>';
          }).join("") : '<p style="color:var(--ink-secondary)">Todavía no completaste viajes.</p>') +
          '<button class="btn ghost" style="margin-top:16px" onclick="D.view=\'\';D.sig=\'\';refresh()">Volver</button>' +
        '</div>';
      $("v").innerHTML = h;
    });
}

function setOn(b){
  initAudio();
  sb.from("conductores").update({ conectado: b }).eq("id", D.u.id).then(function(r){
    if(r.error) return toast("No se pudo cambiar el estado.");
    D.on = b;
    b ? track() : untrack();
    D.sig = "";
    refresh();
  });
}

function track(){
  if(wid !== null || !navigator.geolocation) return;
  wid = navigator.geolocation.watchPosition(function(p){
    D.pos = [p.coords.latitude, p.coords.longitude];
    if(Date.now() - last < 3000) return;
    last = Date.now();
    sb.from("conductores").update({
      lat: p.coords.latitude,
      lng: p.coords.longitude,
      actualizado_en: new Date().toISOString()
    }).eq("id", D.u.id).then(function(){});
  }, function(){
    toast("Activá el GPS para que te vean los pasajeros.");
  }, { enableHighAccuracy: true, maximumAge: 0 });
}

function untrack(){
  if(wid !== null){ navigator.geolocation.clearWatch(wid); wid = null; }
  if(D.u && D.on) sb.from("conductores").update({ conectado: false }).eq("id", D.u.id).then(function(){});
}

function aceptar(id){
  initAudio();
  sb.from("viajes").update({
    conductor_id: D.u.id,
    conductor_nombre: (D.p ? D.p.nombre : "Chofer") + " " + (D.p && D.p.apellido ? D.p.apellido.charAt(0) + "." : ""),
    vehiculo: D.c ? D.c.vehiculo : "Auto",
    patente: D.c ? D.c.patente : "---",
    estado: "aceptado"
  }).eq("id", id).eq("estado", "buscando").select().then(function(r){
    if(r.error || !r.data || !r.data.length) toast("Otro conductor ya tomó este viaje.");
    else toast("¡Viaje aceptado! Buen viaje.");
    D.sig = "";
    refresh();
  });
}

function avanzar(id, est){
  sb.from("viajes").update({ estado: est }).eq("id", id).then(function(r){
    if(r.error) toast("No se pudo actualizar.");
    else if(est === "finalizado") toast("¡Viaje finalizado con éxito!");
    D.sig = "";
    refresh();
  });
}

// ARRANQUE AUTOMÁTICO INMEDIATO (CON TIMEOUT DE SEGURIDAD PARA NUNCA QUEDARSE COLGADO)
var initTimeout = setTimeout(function(){
  if(!D.u) login();
}, 1500);

sb.auth.getSession().then(function(r){
  clearTimeout(initTimeout);
  if(!r || !r.data || !r.data.session) return login();
  D.u = r.data.session.user;
  load();
}).catch(function(){
  clearTimeout(initTimeout);
  login();
});
</script>
