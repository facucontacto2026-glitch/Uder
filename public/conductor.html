<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Uder Conductor</title>
<link rel="manifest" href="/manifest-conductor.json">
<link rel="apple-touch-icon" href="/icon-conductor.svg">
<meta name="theme-color" content="#F5B700">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#14213D;--mute:#5B6678;--line:#D5DBE5;--accent:#F5B700;--on-accent:#14213D;--ok:#1F9D63;--bad:#D64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sora",sans-serif;min-height:100vh}
.app{max-width:440px;margin:0 auto;padding:0 16px 32px}
header{position:sticky;top:0;z-index:1000;background:var(--bg);padding:14px 0;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:26px;letter-spacing:-1px}
.logo i{font-style:normal;color:var(--accent);background:var(--ink);padding:0 6px;border-radius:6px;margin-right:6px}
.logo small{font-weight:600;font-size:12px;color:var(--mute);margin-left:6px}
#map{height:300px;border-radius:20px;border:1px solid var(--line);margin-bottom:14px;z-index:1}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.alerta-pedido{border:2px solid var(--accent);box-shadow:0 0 15px rgba(245,183,0,0.3)}
h2{margin:0 0 6px;font-size:22px;letter-spacing:-.5px}
p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:800 16px "Sora",sans-serif;cursor:pointer;background:var(--accent);color:var(--on-accent);margin-top:14px}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:9px 13px;font:600 13px "Sora",sans-serif;cursor:pointer}
.plate{font-weight:800;letter-spacing:2px;border:2px solid var(--ink);border-radius:8px;padding:3px 10px;font-size:14px}
.fare{font-size:36px;font-weight:800;letter-spacing:-1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:2000}
.fl{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
input,select{width:100%;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px "Sora",sans-serif}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i>U</i>der<small>Conductor</small></div>
  </header>
  <div id="map" style="display:none"></div>
  <main id="v"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var sb=supabase.createClient("https://mmgvttmgchnbppcemrwg.supabase.co","sb_publishable_HtTCeT611_CKOvtxebUxTw_FQpL_seZ"),D={u:null,p:null,c:null,on:false,sig:""},tm=null,wid=null,last=0;

var audioCtx = null;
function initAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();}catch(e){}}
function sonarAlerta(){
  try{
    initAudio();if(!audioCtx)return;var now=audioCtx.currentTime;
    var osc1=audioCtx.createOscillator(),g1=audioCtx.createGain();osc1.frequency.setValueAtTime(880,now);g1.gain.setValueAtTime(0.8,now);g1.gain.exponentialRampToValueAtTime(0.01,now+0.3);osc1.connect(g1);g1.connect(audioCtx.destination);osc1.start(now);osc1.stop(now+0.3);
    var osc2=audioCtx.createOscillator(),g2=audioCtx.createGain();osc2.frequency.setValueAtTime(1174,now+0.2);g2.gain.setValueAtTime(0.9,now+0.2);g2.gain.exponentialRampToValueAtTime(0.01,now+0.55);osc2.connect(g2);g2.connect(audioCtx.destination);osc2.start(now+0.2);osc2.stop(now+0.55);
    var osc3=audioCtx.createOscillator(),g3=audioCtx.createGain();osc3.frequency.setValueAtTime(1760,now+0.45);g3.gain.setValueAtTime(1.0,now+0.45);g3.gain.exponentialRampToValueAtTime(0.01,now+0.9);osc3.connect(g3);g3.connect(audioCtx.destination);osc3.start(now+0.45);osc3.stop(now+0.9);
    if(navigator.vibrate)navigator.vibrate([400,200,400,200,600]);
  }catch(e){}
}

function $(x){return document.getElementById(x)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function M(n){return "$"+Math.round(n).toLocaleString("es-AR")}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function err(m){var e=$("err");if(e)e.textContent=m}
function view(h){clearInterval(tm);$("map").style.display="none";$("v").innerHTML=h}

function login(){view('<div class="card"><h2>Ingresá como conductor</h2><label class="fl">Email</label><input id="e" type="email"><label class="fl">Contraseña</label><input id="w" type="password"><p id="err" style="color:var(--bad);margin-top:10px"></p><button class="btn" onclick="doLogin()">Ingresar</button><button class="btn ghost" onclick="reg()">Quiero ser conductor</button></div>')}

function reg(){
  view('<div class="card"><h2>Registro de conductor</h2><label class="fl">Email</label><input id="e" type="email"><label class="fl">Contraseña</label><input id="w" type="password"><label class="fl">Nombre</label><input id="n"><label class="fl">Apellido</label><input id="a"><label class="fl">Vehículo</label><input id="ve" placeholder="Ej. Toyota Etios gris"><label class="fl">Patente</label><input id="pa"><label class="fl">Tipo</label><select id="ti"><option>Remis</option><option>Uder</option></select><p id="err" style="color:var(--bad);margin-top:10px"></p><button class="btn" onclick="doReg()">Crear cuenta</button><button class="btn ghost" onclick="login()">Volver</button></div>')
}

function doLogin(){
  initAudio();var e=$("e").value.trim(),w=$("w").value;if(!e||!w)return err("Completá email y contraseña");
  sb.auth.signInWithPassword({email:e,password:w}).then(function(r){if(r.error)return err("Datos incorrectos");D.u=r.data.user;load();});
}

function doReg(){
  initAudio();var e=$("e").value.trim(),w=$("w").value,n=$("n").value.trim(),a=$("a").value.trim(),ve=$("ve").value.trim(),pa=$("pa").value.trim().toUpperCase();
  if(!e||w.length<6||!n||!ve||!pa)return err("Completá todos los campos");
  sb.auth.signUp({email:e,password:w}).then(function(r){
    if(r.error)return err(r.error.message);var id=r.data.user.id;D.u=r.data.user;
    sb.from("perfiles").insert({id:id,rol:"conductor",nombre:n,apellido:a}).then(function(){
      sb.from("conductores").insert({id:id,vehiculo:ve,patente:pa,tipo:$("ti").value,verificado:true}).then(function(){load();});
    });
  });
}

function load(){
  sb.from("perfiles").select("*").eq("id",D.u.id).single().then(function(p){
    if(!p.data)return login();D.p=p.data;panel();
  });
}

function panel(){D.sig="";refresh();tm=setInterval(refresh,4000)}

function refresh(){
  var uid=D.u.id;
  Promise.all([
    sb.from("conductores").select("*").eq("id",uid).single(),
    sb.from("viajes").select("*").eq("conductor_id",uid).in("estado",["aceptado","en_camino","en_curso"]).limit(1),
    D.on?sb.from("viajes").select("*").eq("estado","buscando").order("creado_en"):Promise.resolve({data:[]})
  ]).then(function(r){
    D.c=r[0].data;if(!D.c)return;
    if(D.init===undefined){D.init=1;D.on=!!D.c.conectado;if(D.on)track();}
    var act=(r[1].data||[])[0],off=r[2].data||[];
    if(D.on&&off.length>0&&!act)sonarAlerta();
    var sg=JSON.stringify([D.on,act,off.map(function(o){return o.id})]);
    if(sg===D.sig)return;D.sig=sg;draw(act,off);
  });
}

function draw(act,off){
  var h='<div class="card"><div class="row"><b>'+esc(D.p.nombre)+' '+esc(D.p.apellido)+'</b><span style="font-weight:700">'+esc(D.c.tipo)+'</span></div><p>'+esc(D.c.vehiculo)+' · '+esc(D.c.patente)+'</p></div>';
  if(act){
    var tx={aceptado:["Voy en camino","en_camino"],en_camino:["Iniciar viaje","en_curso"],en_curso:["Finalizar viaje","finalizado"]}[act.estado];
    h+='<div class="card"><h2>Viaje con '+esc(act.pasajero_nombre)+'</h2><div class="fare" style="color:var(--ok)">'+M(act.ganancia_conductor)+'</div><p>'+(act.forma_pago==="Efectivo"?"Cobrá "+M(act.monto)+" en mano al pasajero.":"Pagado con tarjeta / Mercado Pago.")+'</p><div style="margin:12px 0"><div>📍 <b>Retiro:</b> '+esc(act.origen_nombre)+'</div><div>🏁 <b>Destino:</b> '+esc(act.destino_nombre)+'</div></div><a style="display:inline-block;margin:10px 0;font-weight:700;color:#000" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+(act.estado==="en_curso"?act.destino_lat+","+act.destino_lng:act.origen_lat+","+act.origen_lng)+'">🗺️ Abrir en Google Maps ↗</a><button class="btn" onclick="avanzar(\''+act.id+'\',\''+tx[1]+'\')">'+tx[0]+'</button></div>';
  }else if(!D.on){
    h+='<div class="card"><h2>Estás desconectado</h2><p>Conectate para recibir pedidos en Rosario de la Frontera.</p><button class="btn" onclick="setOn(true)">Conectarme</button></div>';
  }else{
    h+='<div class="card"><div class="row"><h2>Pedidos disponibles</h2><span style="color:var(--ok);font-weight:800">● Conectado</span></div><div class="chips"><button class="chip" onclick="sonarAlerta()">🔊 Probar sonido</button></div>'+(off.length?off.map(function(o){
      return '<div class="card alerta-pedido" style="margin:10px 0 0"><div class="fare" style="color:var(--ok);font-size:28px">'+M(o.ganancia_conductor)+'</div><p>'+o.km+' km · Pasajero: <b>'+esc(o.pasajero_nombre)+'</b><br>'+esc(o.forma_pago)+'</p><div style="font-size:13px;margin:8px 0"><div>📍 '+esc(o.origen_nombre)+'</div><div>🏁 '+esc(o.destino_nombre)+'</div></div><button class="btn" onclick="aceptar(\''+o.id+'\')">Aceptar viaje</button></div>';
    }).join(""):'<p style="margin-top:10px">Esperando pedidos…</p>')+'<button class="btn ghost" onclick="setOn(false)">Desconectarme</button></div>';
  }
  h+='<button class="btn ghost" onclick="sb.auth.signOut();D.on=false;login()">Cerrar sesión</button>';
  $("v").innerHTML=h;
}

function setOn(b){
  initAudio();
  sb.from("conductores").update({conectado:b}).eq("id",D.u.id).then(function(){
    D.on=b;b?track():untrack();D.sig="";refresh();
    if(b)toast("Conectado con alerta sonora");
  });
}

function track(){
  if(wid!==null||!navigator.geolocation)return;
  wid=navigator.geolocation.watchPosition(function(p){
    if(Date.now()-last<3000)return;last=Date.now();
    sb.from("conductores").update({lat:p.coords.latitude,lng:p.coords.longitude,actualizado_en:new Date().toISOString()}).eq("id",D.u.id).then(function(){});
  },function(){},{enableHighAccuracy:true,maximumAge:0});
}

function untrack(){if(wid!==null){navigator.geolocation.clearWatch(wid);wid=null;}if(D.u&&D.on)sb.from("conductores").update({conectado:false}).eq("id",D.u.id).then(function(){});}
function aceptar(id){
  initAudio();
  sb.from("viajes").update({conductor_id:D.u.id,conductor_nombre:D.p.nombre+" "+(D.p.apellido?D.p.apellido[0]+".":""),vehiculo:D.c.vehiculo,patente:D.c.patente,estado:"aceptado"}).eq("id",id).eq("estado","buscando").select().then(function(r){
    if(!r.data||!r.data.length)toast("Otro chofer ya tomó este viaje");
    else toast("¡Viaje aceptado!");D.sig="";refresh();
  });
}
function avanzar(id,est){sb.from("viajes").update({estado:est}).eq("id",id).then(function(){if(est==="finalizado")toast("Viaje finalizado ✓");D.sig="";refresh();});}

sb.auth.getSession().then(function(r){if(!r.data.session)return login();D.u=r.data.session.user;load();});
</script>
</body>
</html>
