.field-input{width:100%;padding:14px;border-radius:10px;border:1px solid #D5DBE5;background:#F9F9F9;font:600 15px 'Plus Jakarta Sans',sans-serif;margin-top:6px;margin-bottom:14px;outline:none}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;height:65px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:2000;padding-bottom:env(safe-area-inset-bottom,0px)}

.search-res-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-top:0}

</style>

<script>
// INICIALIZACIÓN SEGURA
var sb, mp;
try {
  sb = supabase.createClient("https://mmgvttmgchnbppcemrwg.supabase.co", "sb_publishable_HtTCeT611_CKOvtxebUxTw_FQpL_seZ");
} catch(e) { console.log("Error Supabase", e); }

try {
  mp = new MercadoPago("APP_USR-619e8167-a16b-472a-9e9b-71eef85dbb38");
} catch(e) { console.log("Error MercadoPago", e); }

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}

var CEN={lat:-25.798,lng:-64.968},BB={w:-65.05,e:-64.90,n:-25.74,s:-25.86};
var S={o:null,on:"",d:null,dn:"",mode:"o",ty:0,pg:"Efectivo",p:0,dr:null,km:0,cuadras:0,res:[],msg:"¿A dónde vamos hoy?",ph:"welcome",oref:"",dref:"",viajeId:null,mapFitDone:false},tm=null,pollTm=null;

var TY=[
  ["Remis", "Servicio tradicional de remis", 1.0, "🚗", "4 min"],
  ["Uder", "Auto particular, el más económico", 0.95, "🚘", "3 min"]
];

function $(x){return document.getElementById(x)}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function lab(n, r){
  var nom = esc(n || "Punto");
  var ref = esc(r || "").trim();
  if(!ref) return nom;
  var soloNum = ref.replace(/altura\s*/gi, "").trim();
  if(nom.indexOf(soloNum) >= 0 || nom.indexOf(ref) >= 0) return nom;
  return nom + " · " + ref;
}

function setRef(v){if(S.mode==="o")S.oref=v;else S.dref=v}

function sonarAvisoAceptado(){
  try{
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var now = ctx.currentTime;
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = "sine"; osc.frequency.setValueAtTime(587.33, now);
    osc.frequency.setValueAtTime(880, now + 0.15);
    g.gain.setValueAtTime(0.5, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.5);
  }catch(e){}
}

function compartirPorWhatsApp(){
  var d = S.dr || ["Conductor asignado", "Auto en camino", "---"];
  var chofer = d[0];
  var auto = d[1];
  var patente = d[2];
  var destino = S.dn ? lab(S.dn, S.dref) : "mi destino";
  var monto = M(price(S.ty));

  var texto = "👋 *Hola! Te comparto mi viaje por seguridad:*\n\n" +
              "🚕 *App:* Uder Rosario de la Frontera\n" +
              "📍 *Destino:* " + destino + "\n" +
              "👤 *Chofer:* " + chofer + "\n" +
              "🚘 *Vehículo:* " + auto + " (Patente: " + patente + ")\n" +
              "💵 *Monto:* " + monto + " (" + S.pg + ")\n\n" +
              "Voy viajando seguro con Uder.";

  var url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(texto);
  window.open(url, "_blank");
}

var U = null;
try { U = JSON.parse(localStorage.getItem("uder_user") || "null"); } catch(e){}
function save(){ try { localStorage.setItem("uder_user", JSON.stringify(U)); } catch(e){} }

function luhn(n){var s=0,d=false;for(var i=n.length-1;i>=0;i--){var x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}
function brand(n){if(/^4/.test(n))return"Visa";if(/^(5[1-5]|2[2-7])/.test(n))return"Mastercard";if(/^3[47]/.test(n))return"Amex";return"Tarjeta"}

async function logout(){
  toast("Cerrando sesión…");
  try { await sb.auth.signOut(); } catch(e){}
  U = null;
  S.viajeId = null;
  try {
    localStorage.removeItem("uder_user");
    localStorage.removeItem("uder_active_viaje");
    sessionStorage.clear();
  } catch(e){}
  toast("Sesión cerrada");
  go("welcome");
}

function sincronizarUsuario(usr){
  var meta = usr.user_metadata || {};
  var nomComp = meta.full_name || meta.name || "";
  var partes = nomComp.split(" ");
  
  var nombreReal = meta.first_name || partes[0] || (U && U.nombre !== "Pasajero" ? U.nombre : "");
  var apellidoReal = meta.last_name || partes.slice(1).join(" ") || (U ? U.apellido : "");

  U = {
    id: usr.id,
    email: usr.email,
    nombre: nombreReal || "Facundo",
    apellido: apellidoReal || "",
    dni: meta.dni || (U ? U.dni : ""),
    card: U && U.card ? U.card : null
  };
  save();

  if (sb) {
    sb.from("perfiles").upsert({
      id: usr.id,
      rol: "pasajero",
      nombre: U.nombre,
      apellido: U.apellido
    }).then(function(){}).catch(function(){});
  }

  verificarViajeActivo();
}

function loginGoogle(){
  toast("Conectando con Google…");
  sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  }).catch(function(){
    toast("Error al conectar con Google.");
  });
}

function doLoginEmail(){
  var e = $("l_e").value.trim(), w = $("l_w").value;
  if(!e || !w) { toast("Completá email y contraseña"); return; }
  toast("Ingresando…");
  sb.auth.signInWithPassword({ email: e, password: w }).then(function(r){
    if(r.error) { toast("Email o contraseña incorrectos"); return; }
    sincronizarUsuario(r.data.user);
  });
}

function doRegistroEmail(){
  var e = $("r_e").value.trim(), w = $("r_w").value;
  var n = $("r_n").value.trim(), a = $("r_a").value.trim();
  if(!e || !w || !n) { toast("Completá tu nombre y correo"); return; }
  if(w.length < 6) { toast("La contraseña debe tener al menos 6 caracteres"); return; }
  toast("Creando cuenta…");
  sb.auth.signUp({
    email: e,
    password: w,
    options: { data: { full_name: n + " " + a, first_name: n, last_name: a } }
  }).then(function(r){
    if(r.error) { toast("Error: " + r.error.message); return; }
    toast("¡Cuenta creada!");
    if(r.data.user) {
      sincronizarUsuario(r.data.user);
    } else {
      go("welcome");
    }
  });
}

function editarNombrePerfil(){
  var actual = (U && U.nombre) ? U.nombre : "Facundo";
  var nuevo = prompt("Escribí tu nombre:", actual);
  if(nuevo && nuevo.trim()){
    if(!U) U = {};
    U.nombre = nuevo.trim();
    save();
    toast("Nombre actualizado");
    cambiarSeccion("cuenta");
  }
}

function guardarTarjetaNativa(){
  var num = $("c_n").value.replace(/\D/g,"");
  var exp = $("c_e").value.trim();
  var cvv = $("c_c").value.replace(/\D/g,"");
  var nom = $("c_t").value.trim();
  var dni = $("c_dni").value.replace(/\D/g,"");

  if(num.length < 13 || num.length > 19 || !luhn(num)) return toast("Número de tarjeta inválido");
  if(!/^\d{2}\/\d{2}$/.test(exp)) return toast("Vencimiento inválido (MM/AA)");
  if(cvv.length < 3 || cvv.length > 4) return toast("Código de seguridad inválido");
  if(nom.length < 3) return toast("Nombre del titular requerido");
  if(dni.length < 7 || dni.length > 8) return toast("DNI del titular requerido");

  var m = exp.split("/");
  toast("Verificando tarjeta con el banco…");

  mp.createCardToken({
    cardNumber: num,
    cardholderName: nom,
    cardExpirationMonth: m[0],
    cardExpirationYear: "20" + m[1],
    securityCode: cvv,
    identificationType: "DNI",
    identificationNumber: dni
  }).then(function(token){
    if(!token || !token.id) throw new Error("No se pudo tokenizar");

    if(!U) U = { nombre: "Facundo" };
    U.card = {
      brand: brand(num),
      last4: num.slice(-4),
      titular: nom,
      dni: dni,
      num: num,
      exp: exp
    };
    save();
    toast("Tarjeta " + U.card.brand + " ···· " + U.card.last4 + " vinculada ✓");
    S.pg = "Tarjeta";
    if(S.ph === "opt") go("opt");
    else cambiarSeccion("cuenta");
  }).catch(function(e){
    console.error(e);
    toast("El banco rechazó la tarjeta. Revisá los datos.");
  });
}

function eliminarTarjeta(){
  if(confirm("¿Querés quitar tu tarjeta guardada?")){
    if(U) U.card = null;
    save();
    if(S.pg === "Tarjeta") S.pg = "Efectivo";
    toast("Tarjeta eliminada");
    cambiarSeccion("cuenta");
  }
}

function esNocturno(){
  var h = new Date().getHours();
  return (h >= 22 || h < 6);
}

function getCuadras(){
  return Math.max(1, Math.round(S.km * 10));
}

function price(i){
  var cuadras = getCuadras();
  var base = esNocturno() ? 3600 : 2600;
  var total = base;
  if(cuadras > 10){
    total += (cuadras - 10) * 320;
  }
  var mult = (TY[i] && TY[i][2]) ? TY[i][2] : 1.0;
  return Math.round(total * mult);
}

function M(n){return "ARS " + Math.round(n).toLocaleString("es-AR")}

function pedirViajeReal(){

  }

  var payload = {

    pasajero_nombre: U.nombre + (U.apellido ? " " + U.apellido.charAt(0) + "." : ""),
    tipo: TY[S.ty][0],
    forma_pago: S.pg,
    monto: monto,
    ganancia_conductor: Math.round(monto * 0.85),
    km: Number(S.km.toFixed(1)),
    cuadras: cuadras,

    origen_lat: S.o.lat,
    origen_lng: S.o.lng,

    destino_ref: S.dref || "",

    pasajero_lat: S.o.lat,
    pasajero_lng: S.o.lng,

function procesarTarjetaSilenciosa(viajeId, monto){
  toast("Debitando de tu tarjeta…");

  var cvv = prompt("Ingresá el código de seguridad (CVV de 3 dígitos) de tu tarjeta " + U.card.brand + " ···· " + U.card.last4 + ":");
  if(!cvv || cvv.length < 3){
    toast("Cancelado. El viaje queda en Efectivo.");
    S.pg = "Efectivo";
    go("search");
    return;
  }

  var m = (U.card.exp || "12/28").split("/");

  mp.createCardToken({
    cardNumber: U.card.num,
    cardholderName: U.card.titular,
    cardExpirationMonth: m[0],
    cardExpirationYear: "20" + m[1],
    securityCode: cvv,
    identificationType: "DNI",
    identificationNumber: U.card.dni || "0"
  }).then(function(t){
    if(!t || !t.id) throw new Error("Token error");

    fetch("/api/procesar-pago-tarjeta", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        viaje_id: viajeId,
        token: t.id,
        monto: monto,
        descripcion: "Viaje Uder: " + S.on + " a " + S.dn,
        email: U.email || "pasajero@uder.app",
        dni: U.card.dni || "0",
        nombre: U.nombre
      })
    })
    .then(function(r){ return r.json() })
    .then(function(res){
      if(res.aprobado){
        toast("¡Pago debitado con éxito! 💳 ✓");
        go("search");
      } else {
        alert("El banco rechazó el débito: " + (res.detalle || "Fondos insuficientes") + ".\n\nEl viaje se mantiene en Efectivo.");
        S.pg = "Efectivo";
        go("search");
      }
    }).catch(function(){
      toast("Error al debitar. El viaje se mantiene en Efectivo.");
      S.pg = "Efectivo";
      go("search");
    });
  }).catch(function(){
    toast("Código de seguridad incorrecto. El viaje queda en Efectivo.");
    S.pg = "Efectivo";
    go("search");
  });
}

  if(!pos || pos.lat == null || pos.lng == null) return;

  if(!carMarker){
    var carHtml = '<div style="background:#000;color:#F5B700;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.3)">🚗</div>';
    carMarker = L.marker(p, {
      icon: L.divIcon({ className: '', html: carHtml, iconSize: [38, 38], iconAnchor: [19, 19] }),
      zIndexOffset: 2000
    }).addTo(window.map);
  } else {
    carMarker.setLatLng(p);
  }

  if(S.ph === "pick" && S.o){
    var distKm = hav({lat: pos.lat, lng: pos.lng}, S.o);
    var cuadras = Math.max(1, Math.round(distKm * 10));
    var elDist = $("eta_chofer");

    if(elDist){
      if(distKm < 0.12){
        elDist.innerHTML = '<span class="badge-status" style="background:#FFF3CD;color:#856404">🔔 ¡Tu conductor ya está en tu puerta!</span>';
      } else {
        var txtDist = distKm < 1 ? Math.round(distKm * 1000) + " m" : distKm.toFixed(1) + " km";
        elDist.innerHTML = '<span class="badge-status">🚗 Conductor a <b>' + cuadras + ' cuadras</b> (' + txtDist + ')</span>';
      }
    }

    if(!S.mapFitDone && window.map){
      window.map.fitBounds([p, [S.o.lat, S.o.lng]], { padding: [60, 60], maxZoom: 17 });
      S.mapFitDone = true;
    }
  }

  if(S.ph === "trip" && S.d){
    var distDest = hav({lat: pos.lat, lng: pos.lng}, S.d);
    var elDest = $("eta_destino");
    if(elDest){
      var cuadrasRest = Math.max(1, Math.round(distDest * 10));
      elDest.innerHTML = '<span class="badge-status">🏁 Faltan <b>' + cuadrasRest + ' cuadras</b> para llegar</span>';
    }
  }
}

function hav(p,q){var r=Math.PI/180,u=(q.lat-p.lat)*r,w=(q.lng-p.lng)*r,a=Math.pow(Math.sin(u/2),2)+Math.cos(p.lat*r)*Math.cos(q.lat*r)*Math.pow(Math.sin(w/2),2);return 12742*Math.asin(Math.sqrt(a))}
function toast(m){var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}

function calcularRutaReal(origen, destino){
  var distDirecta = hav(origen, destino);
  var urlDirecta = "https://router.project-osrm.org/route/v1/driving/" + origen.lng + "," + origen.lat + ";" + destino.lng + "," + destino.lat + "?overview=full&geometries=geojson&alternatives=true";
  var cruceLng = -64.9620, cruceLat = -25.7935;
  var urlConCruce = "https://router.project-osrm.org/route/v1/driving/" + origen.lng + "," + origen.lat + ";" + cruceLng + "," + cruceLat + ";" + destino.lng + "," + destino.lat + "?overview=full&geometries=geojson";

  return fetch(urlDirecta)
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.routes || !j.routes.length) throw new Error("Sin ruta");
      var rDirecta = j.routes.sort(function(a,b){ return a.distance - b.distance; })[0];
      var kmDirecto = rDirecta.distance / 1000;

      if(kmDirecto > Math.max(0.6, distDirecta * 1.35)){
        return fetch(urlConCruce)
          .then(function(cr){ return cr.json(); })
          .then(function(cj){
            if(cj.routes && cj.routes.length){
              var rCruce = cj.routes[0];
              var kmCruce = rCruce.distance / 1000;
              if(kmCruce < kmDirecto){
                return {
                  km: Math.max(0.5, kmCruce),
                  puntos: rCruce.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
                };
              }
            }
            return {
              km: Math.max(0.5, Math.min(kmDirecto, distDirecta * 1.25)),
              puntos: rDirecta.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
            };
          })
          .catch(function(){
            return {
              km: Math.max(0.5, Math.min(kmDirecto, distDirecta * 1.25)),
              puntos: rDirecta.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
            };
          });
      }

      return {
        km: Math.max(0.5, kmDirecto),
        puntos: rDirecta.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })
      };
    })
    .catch(function(){
      return {
        km: Math.max(0.5, distDirecta * 1.25),
        puntos: [[origen.lat, origen.lng], [destino.lat, destino.lng]]
      };
    });
}

function buscarDireccion(textoUsuario){
  var numMatch = textoUsuario.match(/\b\d{1,5}\b/);
  var num = numMatch ? numMatch[0] : "";
  var textoLimpio = textoUsuario.replace(/\b\d{1,5}\b/g, "").trim();

  var tMin = textoLimpio.toLowerCase();
  var terminoBusqueda = textoLimpio;
  var esBarrioPeron = false;

  if(tMin.indexOf("peron") >= 0 || tMin.indexOf("malvina") >= 0){
    terminoBusqueda = "Ex Combatientes de Malvinas";
    esBarrioPeron = true;
  } else if(tMin.indexOf("mitre") >= 0){
    terminoBusqueda = "Bartolomé Mitre";
  } else if(tMin.indexOf("guemes") >= 0){
    terminoBusqueda = "Güemes";
  }

  var consulta = terminoBusqueda + (num ? " " + num : "");
  var urlGeoref = "https://apis.datos.gob.ar/georef/api/v2.0/direcciones?max=6&provincia=salta&departamento=rosario%20de%20la%20frontera&direccion=" + encodeURIComponent(consulta);

  return fetch(urlGeoref)
    .then(function(r){ return r.json() })
    .then(function(j){
      var lista = (j.direcciones || []).filter(function(d){ return d.ubicacion && d.ubicacion.lat != null; });
      if(lista.length > 0){
        return lista.map(function(d){
          var nom = d.nomenclatura ? d.nomenclatura.split(",")[0] : d.calle.nombre;
          if(esBarrioPeron) nom = "Ex Combatientes de Malvinas (B° Perón)";
          return {
            p: { lat: parseFloat(d.ubicacion.lat), lng: parseFloat(d.ubicacion.lon) },
            n: nom,
            num: num,
            refSugerida: num ? "altura " + num : ""
          };
        });
      }
      throw new Error("No en georef");
    })
    .catch(function(){
      var nomUrl = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=ar&viewbox=" + BB.w + "," + BB.n + "," + BB.e + "," + BB.s + "&bounded=0&q=" + encodeURIComponent(terminoBusqueda + ", Rosario de la Frontera, Salta");
      return fetch(nomUrl)
        .then(function(r){ return r.json() })
        .then(function(arr){
          if(!Array.isArray(arr) || !arr.length) return [];
          return arr.map(function(x){
            var calleNombre = x.display_name.split(",")[0];
            calleNombre = calleNombre.replace(/Ram[oó]n Abdala/gi, "B° Perón");
            if(esBarrioPeron && calleNombre.indexOf("Perón") < 0) calleNombre = "Ex Combatientes de Malvinas (B° Perón)";
            return {
              p: { lat: parseFloat(x.lat), lng: parseFloat(x.lon) },
              n: calleNombre,
              num: num,
              refSugerida: num ? "altura " + num : ""
            };
          });
        })
        .catch(function(){ return []; });
    });
}

  routeLine=null;
  var b=[];
  if(S.o){pin(S.o,"#000000","o","Desde: "+lab(S.on,S.oref));b.push([S.o.lat,S.o.lng])}
  if(S.d){pin(S.d,"#DE1135","d","Hasta: "+lab(S.dn,S.dref));b.push([S.d.lat,S.d.lng])}
  
  if(S.o && S.d){
    calcularRutaReal(S.o, S.d).then(function(res){
      S.km = res.km;
      S.cuadras = getCuadras();
      if(G) routeLine = L.polyline(res.puntos, {color:"#000000", weight:5, opacity:0.85}).addTo(G);
    });
  }

  if(keep || !map)return;
  if(b.length===2) map.fitBounds(b,{padding:[40,40]});
  else if(b.length===1) map.setView(b[0],16);
}

function setPt(m,p,n,keep){
  if(m==="o"){
    S.o=p;
    S.on=n||"Punto en el mapa";
    if(!S.d){
      S.mode="d";
      S.msg="¿A dónde vas?";
    }
  } else {
    S.d=p;
    S.dn=n||"Punto en el mapa";
  }
  S.res=[];
  draw(keep);
  go("home");

  setTimeout(function(){
    var qEl = $("q");
    if(qEl && S.mode === "d" && !S.d){
      qEl.value = "";
      qEl.placeholder = "¿A dónde vas? (ej: peron 412)";
      qEl.focus();
    }
  }, 100);
}

if (window.map) {
  window.map.on("click",function(e){
    if(S.ph!=="home")return;
    if(S.mode==="o")S.oref="";else S.dref="";
    setPt(S.mode,{lat:e.latlng.lat,lng:e.latlng.lng},"Punto marcado");
  });
}

function mode(m){S.mode=m;go("home")}

function loc(){
  toast("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(function(g){
    var p = {lat: g.coords.latitude, lng: g.coords.longitude};
    var enRosario = (p.lng > BB.w && p.lng < BB.e && p.lat > BB.s && p.lat < BB.n);
    if(enRosario){
      setPt("o", p, "Ubicación actual");
      if (window.map) window.map.setView([p.lat, p.lng], 16);
    } else {
      setPt("o", { lat: CEN.lat, lng: CEN.lng }, "Centro (Rosario de la Frontera)");
    }
  }, function(){
    setPt("o", { lat: CEN.lat, lng: CEN.lng }, "Centro (Rosario de la Frontera)");
  }, { enableHighAccuracy: true, timeout: 8000 });
}

function find(){
  var q = $("q").value.trim();
  if(!q){ toast("Escribí una calle"); return; }
  S.msg = "Buscando…";
  go("home");
  $("q").value = q;

  buscarDireccion(q).then(function(rs){
    S.res = rs;
    S.msg = rs.length ? "Seleccioná la dirección:" : "No encontramos esa calle. Probá de nuevo o tocala en el mapa.";
    go("home");
    $("q").value = q;
  }).catch(function(){
    toast("No se pudo buscar.");
    go("home");
  });
}

function pickRes(i){
  var r = S.res[i];
  if(!r) return;
  var ref = r.refSugerida || (r.num ? "altura " + r.num : "");
  if(S.mode === "o") S.oref = ref; else S.dref = ref;
  setPt(S.mode, r.p, r.n);
}

function opts(){
  if(!S.o||!S.d){toast("Elegí origen y destino");return}

        '<p style="margin:0 0 16px;color:var(--ink-secondary);font-size:14px">Avisando a los conductores más cercanos en Rosario de la Frontera.</p>' +
        '<div class="bar" style="height:6px;border-radius:10px;background:#EEEEEE;overflow:hidden;margin-bottom:20px"><i style="width:65%;display:block;height:100%;background:#000"></i></div>' +
        '<button class="btn-uber" style="background:var(--surface);color:#000" onclick="cancelarViajeActual()">Cancelar pedido</button>' +
      '</div>';
    pollTm = setInterval(consultarViaje, 2000);
  }

  if(ph==="pick"){
    var d = S.dr || ["Conductor", "Auto en camino", "---"];
    v.innerHTML = 
      '<div style="padding:10px 0">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
          '<div>' +
            '<h3 style="margin:0;font-size:20px;font-weight:800">'+esc(d[0])+' viene a buscarte</h3>' +
            '<p style="margin:4px 0 0;color:var(--ink-secondary);font-size:14px">'+esc(d[1])+'</p>' +
          '</div>' +
          '<div class="plate" style="font-size:15px">'+esc(d[2])+'</div>' +
        '</div>' +
        '<div id="eta_chofer" style="margin:16px 0">' +
          '<span class="badge-status">🚗 Localizando conductor en el mapa…</span>' +
        '</div>' +
        '<div style="background:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between">' +
          '<span>Forma de pago: <b>'+esc(S.pg)+'</b></span>' +
          '<span>Total: <b>'+M(price(S.ty))+'</b></span>' +
        '</div>' +
        '<button class="btn-whatsapp" onclick="compartirPorWhatsApp()">' +
          '📲 Compartir viaje por WhatsApp' +
        '</button>' +
        '<button class="btn-ghost-uber" style="color:var(--bad)" onclick="cancelarViajeActual()">Cancelar viaje</button>' +
      '</div>';
    pollTm = setInterval(consultarViaje, 2000);
  }

  if(ph==="trip"){
    v.innerHTML = 
      '<div style="padding:10px 0">' +
        '<h3 style="margin:0;font-size:20px;font-weight:800">Viaje en curso</h3>' +
        '<p style="margin:4px 0 14px;color:var(--ink-secondary);font-size:14px">Con '+esc(S.dr[0])+' hacia tu destino</p>' +
        '<div id="eta_destino" style="margin-bottom:16px">' +
          '<span class="badge-status">En viaje a destino…</span>' +
        '</div>' +
        '<div style="background:var(--surface);padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
          '<span style="font-size:14px;font-weight:600">Total a pagar:</span>' +
          '<b style="font-size:20px">'+M(price(S.ty))+'</b>' +
        '</div>' +
        '<button class="btn-whatsapp" onclick="compartirPorWhatsApp()">' +
          '📲 Compartir viaje por WhatsApp' +
        '</button>' +
      '</div>';
    pollTm = setInterval(consultarViaje, 2000);
  }

  if(ph==="done"){
    v.innerHTML = 
      '<div style="text-align:center;padding:20px 0">' +
        '<h2 style="font-size:26px;font-weight:800;margin:0">¡Llegaste a destino!</h2>' +
        '<div style="font-size:42px;font-weight:900;margin:16px 0;letter-spacing:-1px">'+M(price(S.ty))+'</div>' +
        '<p style="color:var(--ink-secondary);margin-bottom:24px">'+(S.pg==="Efectivo"?"Pagale en efectivo a tu chofer.":"El cobro fue procesado automáticamente.")+'</p>' +
        '<button class="btn-uber" onclick="S.d=null;S.dn=\'\';S.viajeId=null;localStorage.removeItem(\'uder_active_viaje\');draw();cambiarSeccion(\'home\')">Listo</button>' +
      '</div>';
  }
}

// ARRANQUE AUTOMÁTICO SEGURO
document.addEventListener("DOMContentLoaded", function() {
  // 1. Dibujamos la pantalla de bienvenida o inicio inmediatamente
  if (!U) {
    go("welcome");
  } else {
    go("home");
  }

  // 2. Luego chequeamos si hay sesión de Supabase en segundo plano
  if (sb) {
    sb.auth.getSession().then(function(r){
      if(r.data && r.data.session && r.data.session.user){
        sincronizarUsuario(r.data.session.user);
      } else if (!U || !U.nombre) {
        go("welcome");
      } else {
        verificarViajeActivo();
      }
    }).catch(function() {
      verificarViajeActivo();
    });

    sb.auth.onAuthStateChange(function(event, session){
      if(session && session.user){
        sincronizarUsuario(session.user);
      }
    });
  } else {
    verificarViajeActivo();
  }

  // 3. Verificamos si venimos de un pago de MP
  if (typeof volverMP === 'function') {
    volverMP();
  }
});
</script>
